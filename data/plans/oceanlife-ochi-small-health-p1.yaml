# บริษัทเขียนไว้ที่หน้าผลิตภัณฑ์ว่า "อายุรับประกันภัย 16 - 70 ปี (ต่ออายุสัญญาได้ถึงอายุ 80 ปี)"
entry_age_min: 16
entry_age_max: 70
# 80 ปีมาจากตัวบทสัญญาข้อ 7 และตรงกับหน้าขายพอดี เป็นบริษัทแรกในชุดข้อมูลนี้
# ที่ตัวเลขในสัญญากับตัวเลขบนหน้าโฆษณาไม่ขัดกันเอง
renewal_ceiling_age: 80

# 10,000 บาท เป็นเพดานรวมของหมวด 1-8 และหมวด 12 ต่อการเข้าพักรักษาครั้งใดครั้งหนึ่ง
# ไม่ใช่ต่อปี และไม่ใช่เพดานของแต่ละหมวดแยกกัน เป็นแผนวงเงินเล็กมากเมื่อเทียบกับแผนอื่นในตาราง
ipd_annual_limit_thb: 10000
ipd_limit_basis: per_confinement
# ผู้ป่วยนอกเป็นบันทึกสลักหลังที่ซื้อแยก ระเบียนนี้บันทึกแบบไม่ซื้อ
# ถ้าซื้อ บริษัทให้ 300 บาทต่อครั้ง ซึ่งเป็นเพดานต่อครั้ง ไม่ใช่ต่อปี จึงไม่มีวงเงินต่อปีให้บันทึก
opd_annual_limit_thb: null
# บริษัทไม่ได้แยกค่าห้องออกมาเป็นตัวเลขต่างหาก ค่าห้องรวมอยู่ในเพดาน 10,000 บาทข้างต้นแล้ว
room_board_thb_per_night: null
deductible_thb: 0
copay_percent: 0
copay_on_renewal: >-
  ปีแรกไม่มีค่าใช้จ่ายร่วม ส่วนปีต่ออายุ ไทยสมุทรเขียนกลไกไว้ครบทั้งตัวเลขและเงื่อนไข
  ในตัวบทสัญญาเอง ไม่ใช่ในโบรชัวร์ ซึ่งต่างจากบริษัทส่วนใหญ่ในชุดข้อมูลนี้
  เงื่อนไขแรก ร่วมจ่าย 30% ถ้าเคลมโรคเล็กน้อยทั่วไปแล้วนอนโรงพยาบาลตั้งแต่ 3 ครั้งขึ้นไป
  ในรอบปีกรมธรรม์ และมีอัตราการเรียกร้องค่าสินไหมตั้งแต่ 200% ขึ้นไป
  เงื่อนไขที่สอง ร่วมจ่าย 30% ถ้านอนโรงพยาบาลตั้งแต่ 3 ครั้งขึ้นไปในรอบปีกรมธรรม์
  และมีอัตราการเรียกร้องตั้งแต่ 400% ขึ้นไป โดยไม่นับค่าสินไหมจากโรคร้ายแรงตามรายชื่อ
  แนบท้ายและการผ่าตัดใหญ่ ถ้าเข้าทั้งสองเงื่อนไขพร้อมกัน บริษัทจะกำหนดให้ร่วมจ่าย 50%
  โครงสร้างนี้เหมือนไทยประกันชีวิตทุกประการ ต่างกันตรงที่ของไทยสมุทรอ้างจากตัวบทสัญญา
  ที่บริษัทเผยแพร่เอง ไม่ใช่จากหน้าขาย
  เรื่องการปรับเบี้ย บริษัทผูกไว้กับอายุ ชั้นอาชีพ และค่ารักษาที่สูงขึ้นหรือประสบการณ์
  การจ่ายสินไหมโดยรวมของพอร์ตโฟลิโอ คือคิดจากพอร์ตรวม ไม่ใช่ประวัติการเคลมรายคน
  ต้องแจ้งล่วงหน้าไม่น้อยกว่า 30 วัน และต้องเป็นอัตราที่นายทะเบียนเห็นชอบแล้ว

# ข้อยกเว้นทั่วไป 15 ข้อแรกจากตัวบทสัญญาที่บริษัทเผยแพร่เอง (ข้อ 16-21 เป็นข้อยกเว้น
# เรื่องอุบัติเหตุ สงคราม การก่อการร้าย และกัมมันตภาพรังสี ซึ่งไม่เกี่ยวกับค่ารักษาพยาบาลโดยตรง)
exclusions:
  - th: >-
      ภาวะที่เป็นผลจากความผิดปกติที่เกิดขึ้นแต่กำเนิด
      หรือระบบการสร้างอวัยวะของร่างกายไม่สมบูรณ์แต่กำเนิด หรือโรคทางพันธุกรรม
      หรือความผิดปกติในการพัฒนาการของร่างกาย เว้นแต่
      สัญญาเพิ่มเติมนี้มีผลคุ้มครองมาไม่น้อยกว่าหนึ่งปี (1 ปี)
      และปรากฏอาการหลังผู้เอาประกันภัยมีอายุครบ 16 ปีบริบูรณ์
    en: null
  - th: >-
      การตรวจรักษาหรือการผ่าตัดเพื่อเสริมสวย หรือการแก้ไขปัญหาผิวพรรณ สิว ฝ้า กระ รังแค
      ผมร่วงหรือการควบคุมน้ำหนักตัว การผ่าตัดที่สามารถทดแทนด้วยการรักษาแนวทางอื่น
      เว้นแต่เป็นการตกแต่งบาดแผลอันเนื่องมาจากอุบัติเหตุที่ได้รับความคุ้มครอง
    en: null
  - th: >-
      การตั้งครรภ์ แท้งบุตร ทำแท้ง การคลอดบุตร โรคแทรกซ้อนจากการตั้งครรภ์ การแก้ไขปัญหาการมีบุตรยาก
      (รวมถึง การสืบวิเคราะห์และการรักษา) การทำหมันหรือการคุมกำเนิด ยกเว้น มะเร็ง ครรภ์ไข่ปลาอุก
      (Choriocarcinoma)
    en: null
  - th: >-
      โรคเอดส์ หรือกามโรคหรือโรคติดต่อทางเพศสัมพันธ์ โดยโรคเอดส์ให้รวมถึง ภูมิคุ้มกันบกพร่อง
      (Acquired Immune Deficiency Syndrome) ซึ่งเกิดจากการติดเชื้อไวรัสเอดส์
      และให้หมายความรวมถึงการติดเชื้อจุลชีพฉวยโอกาส หรือ การติดโรค หรือ การเจ็บป่วยใด ๆ
      ซึ่งโดยผลการตรวจเลือดแสดงเป็นเลือดบวกของไวรัส HIV (Human Immunodeficiency Virus)
      การติดเชื้อจุลชีพฉวยโอกาสให้รวมถึง แต่ไม่จำกัดเฉพาะเชื้อที่ทำให้เกิดโรคปอดบวม หรือ ปอดอักเสบ
      (Pneumocystis Carinii Pneumonia) เชื้อที่ทำให้เกิดโรคลำไส้อักเสบ หรือเรื้อรัง (Organism Causes
      Chronic Enteritis) เชื้อไวรัสและ/หรือเชื้อราที่แพร่กระจายอยู่ทั่วไป (Disseminated Virus and/or
      Fungi Infection) เนื้องอกร้ายแรง (Malignant Neoplasm) ให้รวมถึงแต่ ไม่จำกัดเฉพาะเนื้องอก
      Kaposi’s Sarcoma มะเร็งต่อมน้ำเหลืองที่ระบบประสาทส่วนกลาง (Central Nervous System Lymphoma)
      และ/หรือโรคร้ายแรงอื่น ๆ ซึ่งเป็นที่รู้จักในปัจจุบันนี้ว่าเป็นอาการของภูมิคุ้มกันบกพร่อง
      (Acquired Immunodeficiency Syndrome) หรือซึ่งเป็นสาเหตุ ที่ทำให้คนที่เป็นเสียชีวิตอย่างกะทันหัน
      เจ็บป่วย หรือทุพพลภาพ โรคภูมิคุ้มกันบกพร่อง (AIDS) ให้รวมถึงเชื้อไวรัส HIV (Human
      Immunodeficiency Virus) ที่ทำให้เกิดโรคสมองเสื่อม (Encephalopathy Dementia)
    en: null
  - th: >-
      การตรวจรักษา หรือการป้องกัน การใช้ยา หรือสารต่าง ๆ เพื่อการชะลอความเสื่อมของวัย
      หรือการให้ฮอร์โมน ทดแทนในวัยใกล้หมดหรือหมดระดู การเสื่อมสมรรถภาพทางเพศในหญิง หรือชาย
      การรักษาความผิดปกติ ทางเพศ และการแปลงเพศ
    en: null
  - th: >-
      การตรวจสุขภาพ การร้องขอเข้าอยู่รักษาตัวในโรงพยาบาล หรือร้องขอการผ่าตัด การพักฟื้น
      หรือการพักเพื่อ การฟื้นฟูหรือการรักษาโดยวิธีให้พักอยู่เฉย ๆ
      หรือการพักรักษาในโรงพยาบาลเพื่อให้มีผู้ช่วยดูแลทั่วไป
      การตรวจหรือการรักษาที่ไม่เกี่ยวข้องกับโรคที่เป็นสาเหตุของการรับตัวไว้ในโรงพยาบาล
      การตรวจวินิจฉัยการบาดเจ็บหรือการป่วย การรักษาหรือตรวจวิเคราะห์เพื่อหาสาเหตุ
      ซึ่งไม่ใช่ความจำเป็นทางการแพทย์ หรือไม่เป็นมาตรฐานทางการแพทย์
    en: null
  - th: >-
      การตรวจรักษาความผิดปกติเกี่ยวกับสายตา การทำเลสิค
      ค่าใช้จ่ายสำหรับอุปกรณ์เพื่อช่วยในการมองเห็นหรือการรักษาความผิดปกติของการมองเห็น
    en: null
  - th: >-
      การตรวจรักษา หรือผ่าตัดเกี่ยวกับฟัน หรือเหงือก การทำฟันปลอม การครอบฟัน การรักษารากฟัน อุดฟัน
      การจัดฟัน ขูดหินปูน ถอนฟัน การใส่รากฟันเทียม
      ยกเว้นในกรณีจำเป็นอันเนื่องจากการบาดเจ็บโดยอุบัติเหตุ ซึ่งไม่รวมค่าฟันปลอม
      การครอบฟันและการรักษารากฟันหรือใส่รากเทียม
    en: null
  - th: >-
      การรักษาหรือการบำบัดการติดยาเสพติดให้โทษ บุหรี่ สุรา หรือสารออกฤทธิ์ต่อจิตประสาท
    en: null
  - th: >-
      การตรวจรักษา อาการ หรือโรคที่เกี่ยวเนื่องกับภาวะทางจิตใจ โรคทางจิตเวช หรือทางพฤติกรรม
      หรือความผิดปกติทางบุคลิกภาพ รวมถึงสภาวะสมาธิสั้น ออธิสซึม เครียด ความผิดปกติของการกิน
      หรือความวิตกกังวล
    en: null
  - th: >-
      การตรวจรักษาที่ยังอยู่ในระหว่างทดลอง การตรวจหรือการรักษาโรค หรืออาการหยุดหายใจขณะหลับ
      การตรวจหรือการรักษาความผิดปกติของการนอนหลับ การนอนกรน
    en: null
  - th: >-
      การปลูกฝี หรือการฉีดวัคซีนป้องกันโรค ยกเว้นการฉีดวัคซีนป้องกันโรคพิษสุนัขบ้า
      ภายหลังการถูกสัตว์ทำร้าย และวัคซีนป้องกันบาดทะยักภายหลังได้รับการบาดเจ็บ
    en: null
  - th: >-
      การตรวจรักษาที่ไม่ใช่แพทย์แผนปัจจุบัน รวมถึงแพทย์ทางเลือก
    en: null
  - th: >-
      ค่าใช้จ่ายที่เกิดจากการตรวจรักษาพยาบาลที่ผู้เอาประกันภัยซึ่งเป็นแพทย์สั่งให้แก่ตัวเอง
      รวมทั้งค่าใช้จ่ายที่เกิดจากการตรวจรักษาพยาบาลจากแพทย์ผู้ซึ่งเป็น บิดา มารดา คู่สมรส
      หรือบุตรของผู้เอาประกันภัย
    en: null
  - th: >-
      การฆ่าตัวตาย การพยายามฆ่าตัวตาย การทำร้ายร่างกายตนเอง
      หรือการพยายามทำร้ายร่างกายตนเองไม่ว่าจะเป็นการกระทำโดยตนเอง
      หรือยินยอมให้ผู้อื่นกระทำไม่ว่าจะอยู่ในระหว่างวิกลจริตหรือไม่ก็ตาม ทั้งนี้รวมถึง
      อุบัติเหตุจากการที่ผู้เอาประกันภัย กิน ดื่ม หรือ ฉีดยาหรือสารมีพิษเข้าร่างกาย
      การใช้ยาเกินกว่าที่แพทย์สั่ง
    en: null
waiting_period_days: 30

premium_source:
  url: https://www.ocean.co.th/our-products/health-insurance/ochi-small-health-package?purchase_intent=1
  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    ตัวเลขทุกช่องมาจากระบบขายออนไลน์ของไทยสมุทรเอง ไล่เก็บทุกอายุ 16-80 ปี ทั้งสองเพศ
    จึงเป็นตารางเต็ม ไม่ใช่ตัวอย่างรายจุดแบบที่เอไอเอหรือกรุงเทพประกันชีวิตเผยแพร่
    ราคานี้เป็นราคาที่บริษัทขายจริงในวันที่ตรวจ ไม่ใช่ราคาในโบรชัวร์
    เบี้ยแยกชายหญิง ผู้หญิงจ่ายสัญญาเพิ่มเติมแพงกว่าผู้ชายเกือบทุกช่วงอายุ
    แต่จ่ายสัญญาหลักถูกกว่าผู้ชายทุกช่วงอายุ สองอย่างนี้หักกลบกันบางส่วน
    ถ้าดูแค่ราคาสัญญาเพิ่มเติมอย่างเดียวจะสรุปผิด
    ตัวเลขในตารางนี้เป็นเบี้ยสัญญาเพิ่มเติมสุขภาพอย่างเดียว ยังไม่รวมสองอย่าง
    (1) สัญญาหลัก ซึ่งบังคับซื้อ และอยู่ในช่อง host_policy ด้านบน
    (2) บันทึกสลักหลังค่ารักษาผู้ป่วยนอก ซึ่งเลือกซื้อได้ ราคาแยกอีกชุดหนึ่ง
    เริ่มที่ 1,101 บาทต่อปีสำหรับผู้ชายอายุ 16-30 ปี และ 1,491 บาทสำหรับผู้หญิงช่วงเดียวกัน
    ไล่ขึ้นไปถึง 5,436 และ 5,904 บาทที่อายุ 76-80 ปี
    แพ็กเกจ 2 และ 3 ของโครงการนี้ให้วงเงินผู้ป่วยใน 20,000 และ 50,000 บาท
    ค่ารักษาผู้ป่วยนอก 500 และ 1,000 บาทต่อครั้ง ยอดรวมทั้งแพ็กเกจที่ผู้ชายอายุ 35 ปี
    คือ 8,255 และ 13,481 บาทต่อปี แต่เรายังไม่บันทึกเป็นระเบียนแยก เพราะเก็บตารางเบี้ย
    ครบทุกอายุได้เฉพาะแพ็กเกจ 1 การใส่ระเบียนที่มีเบี้ยจุดเดียวจะทำให้ยอดรวมตลอดสัญญา
    เป็นช่องว่างเกือบทั้งแถว
terms_source:
  url: https://www.ocean.co.th/our-products/health-insurance/ochi-small-health-package/download/benefit
  tier: filed_wording
  verified_on: 2026-08-10
  note: >-
    ไฟล์ "รายละเอียดความคุ้มครองเพิ่มเติม" ที่ไทยสมุทรให้ดาวน์โหลดจากหน้าผลิตภัณฑ์
    ไม่ใช่โบรชัวร์ แต่เป็นตัวบทจริง 20 หน้า มีทั้งเงื่อนไขทั่วไปแห่งกรมธรรม์ประกันชีวิต
    ประเภทสามัญ (ขายผ่านทางอิเล็กทรอนิกส์) รหัส 20803 และตัวบทสัญญาเพิ่มเติมคุ้มครองสุขภาพ
    สมอล เฮลท์ แผน 1 เต็มฉบับ รหัส 30008_01 / อ.72_01 และ 20681 / ร.302
    เป็นแหล่งระดับตัวบทสัญญาแหล่งที่สองที่โครงการนี้หาเจอสำหรับสัญญาเพิ่มเติมของบริษัทประกันชีวิต
    และต่างจากของไทยประกันสุขภาพตรงที่ฉบับนี้เป็นฉบับปัจจุบัน ไม่ใช่ฉบับปี 2560 ที่ค้างอยู่
    ข้อควรรู้เรื่องตัวอักษรในเอกสารนี้ ชั้นข้อความใน PDF ของบริษัทมีปัญหาสองอย่าง
    คือทำสระอำหาย (เขียน "กาเนิด" แทน "กำเนิด") และแทรกช่องว่างกลางคำจากการจัดหน้า
    ข้อความข้อยกเว้นด้านบนจึงผ่านการซ่อมสองอย่างนี้แล้ว ไม่ได้แก้คำ ไม่ได้ตัดทอน
    ไม่ได้เรียบเรียงใหม่ ใครที่อยากตรวจว่าตรงกับต้นฉบับไหม เปิดไฟล์จากลิงก์ด้านบนได้เลย
    เรื่องวงเงิน ตัวบทกำหนดว่า "ผลประโยชน์รวม หมวดที่ 1-8 และหมวดที่ 12 ไม่เกิน 10,000 บาท
    ต่อการเข้าพักรักษาตัวเป็นผู้ป่วยในครั้งใดครั้งหนึ่ง" และนิยาม "ครั้งใดครั้งหนึ่ง"
    ว่านับการกลับเข้ารักษาภายใน 90 วันหลังออกจากโรงพยาบาลครั้งสุดท้ายเป็นครั้งเดียวกัน
    เกณฑ์ 90 วันเดียวกับเอไอเอ ไทยประกันสุขภาพ และแปซิฟิค ครอส
    เพดานต่ออายุ 80 ปีมาจากข้อ 7 ของตัวบท "สัญญาเพิ่มเติมนี้จะต่ออายุเมื่อครบรอบปี
    กรมธรรม์ประกันภัย จนถึงรอบปีกรมธรรม์ประกันภัยที่ผู้เอาประกันภัยมีอายุ 80 ปี
    โดยไม่ต้องแสดงหลักฐาน แต่บริษัทยังคงไว้ซึ่งสิทธิในการปรับเบี้ยประกันภัยตามข้อ 14"
    ระยะเวลาที่ไม่คุ้มครอง 30 วันสำหรับการป่วยทั่วไป และ 120 วันสำหรับแปดกลุ่มโรคมาตรฐาน
    โดยอุบัติเหตุไม่ต้องรอ อยู่ที่ข้อ 12 ของตัวบท
    เรื่องมาตรฐานประกันสุขภาพแบบใหม่ ระเบียนนี้ยืนยันได้จากตัวบทโดยตรง ไม่ต้องเดาจากโครงสร้าง
    เพราะตัวบทมีนิยาม "การป่วยเล็กน้อยทั่วไป (Simple diseases)" ตามระบบ ICD-10
    และนิยาม "ค่าใช้จ่ายร่วม (Copayment)" ครบถ้วนตามมาตรฐานปี 2564
    รวมทั้งเอกสารแนบท้ายกลุ่มโรคป่วยเล็กน้อยสำหรับเด็กอายุ 3-5 ปีอีกฉบับหนึ่ง


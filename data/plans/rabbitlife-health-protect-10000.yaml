  note: >-
    บริษัทไม่เผยแพร่ตัวบทกรมธรรม์หรือเอกสารสรุปสาระสำคัญที่ใดในเว็บไซต์เลย
    (ตรวจหน้าผลิตภัณฑ์และหน้าศูนย์บริการเอกสารแล้วเมื่อ 2026-08-12 ไม่พบ)
    โบรชัวร์สามหน้านี้คือเอกสารที่เป็นทางการที่สุดที่หาได้ ระเบียนนี้จึงใช้ tier
    เป็น official_insurer ไม่ใช่ filed_wording เหมือนแผนอื่นส่วนใหญ่ในชุดข้อมูลนี้
    ตารางผลประโยชน์หน้า 2 ใช้โครงสร้าง 13 หมวดตรงตามมาตรฐานประกันสุขภาพแบบใหม่ทุกหมวด
    (หมวด 8-11 เวชศาสตร์ฟื้นฟู/ล้างไต/รังสีรักษา/เคมีบำบัด เขียนชัดว่า "ไม่คุ้มครอง"
    สำหรับสัญญาเพิ่มเติมนี้) จึงบันทึก new_health_standard เป็นจริงจากโครงสร้าง
    การมีส่วนร่วมจ่ายระบุตรงๆ ว่า "ความรับผิดส่วนแรก ไม่มี / ค่าใช้จ่ายร่วม ไม่มี"
    แถวเดียวใช้ร่วมกันทั้งเจ็ดแผน ไม่แยกตามแผน ส่วนข้อยกเว้นและระยะเวลาที่ไม่คุ้มครอง
    ไม่ปรากฏที่ใดเลยในเอกสารสามหน้านี้ ทั้งที่บริษัทอื่นในชุดข้อมูลนี้ (นวกิจ เอไอเอ)
    อย่างน้อยยังเผยแพร่ข้อยกเว้นบางส่วนหรือระยะเวลาที่ไม่คุ้มครอง 30/120 วัน
    ผู้ซื้อแผนนี้จึงไม่มีทางรู้ล่วงหน้าเลยว่าโรคใดถูกยกเว้นหรือต้องรอนานแค่ไหนก่อนเคลมได้


# AIA Health Saver, แผนความคุ้มครอง 200,000 บาท (the cheapest plan in the family).
# Every figure below came from AIA's own site or its own PDF. Where AIA publishes
# nothing — the full age-band rate table, the host policy requirement — this file
# says so instead of guessing. The host floor is 12,000 THB/year, published.
id: aia-health-saver-200k
insurer:
  th: เอไอเอ ประเทศไทย
  en: AIA Thailand
name:
  th: สัญญาเพิ่มเติมเอไอเอ เฮลธ์ เซฟเวอร์ — แผน 200,000
  en: AIA Health Saver — 200,000 plan

type: rider
host_policy:
  name:
    th: สัญญาหลักที่ถูกที่สุดเท่าที่เอไอเอประกาศราคาไว้ — เอไอเอ อิสระ พลัส (ยูนิต ลิงค์)
    en: Cheapest AIA main policy with a published minimum premium — Issara Plus (Unit Linked)
  min_sum_insured_thb: 60000
  premium:
    - { age_from: 11, age_to: 98, thb_per_year: 12000 }
  premium_unknown_reason: null
  source:
    url: https://www.aia.co.th/content/dam/th-wise/images/th/our-products/si_117_aia-issara-plus-unit-linked/AIA_Issara_Plus_(Unit%20Linked)_28122022.pdf
    tier: official_insurer
    verified_on: 2026-08-10
    note: >-
      โบรชัวร์เอไอเอ อิสระ พลัส หน้า 5 ระบุ "เบี้ยประกันภัยหลักเพื่อความคุ้มครอง (RPP)
      ขั้นต่ำ 6,000 บาทต่อปี โดยจะต้องมีเบี้ยประกันภัยหลักเพื่อความคุ้มครองรวมขั้นต่ำ
      12,000 บาทต่อปี" และ "จำนวนเงินเอาประกันภัย...ไม่น้อยกว่า 60,000 บาท"
      ข้อจำกัดที่ต้องรู้ (1) เอไอเอไม่ประกาศรายชื่อสัญญาหลักที่แนบสัญญาเพิ่มเติมนี้ได้
      จึงไม่มีเอกสารยืนยันว่าต้องเป็นแบบนี้ นี่คือแบบที่ถูกที่สุดที่ "ประกาศราคาไว้"
      (2) อิสระ พลัส รับประกันอายุ 15 วัน - 70 ปี ผู้สมัครอายุ 71-75 ปีใช้แบบนี้ไม่ได้
      (3) 12,000 บาทคือขั้นต่ำ ไม่ใช่ใบเสนอราคา และสมมติว่าชำระต่อเนื่องตลอดสัญญา

shape: per_item_schedule
new_health_standard: true

# เอไอเอเผยแพร่เบี้ยเป็นตัวอย่างรายจุด ไม่ใช่ตารางเต็มทุกช่วงอายุ
# จึงบันทึกเฉพาะจุดที่มีเอกสารอ้างอิงจริง ช่วงอายุที่เหลือแสดงว่า "ไม่มีข้อมูล"
premium:
  - { age_from: 21, age_to: 25, thb_per_year: 6900, sex: male }
  - { age_from: 35, age_to: 35, thb_per_year: 7500, sex: male }
  - { age_from: 35, age_to: 35, thb_per_year: 9200, sex: female }

entry_age_min: 11
entry_age_max: 75
renewal_ceiling_age: 98

# 200,000 บาทเป็นวงเงิน "ต่อการเข้าพักรักษาตัวครั้งใดครั้งหนึ่ง" ไม่ใช่ต่อปี
# (เฉพาะหมวด 9-11 เท่านั้นที่คิดต่อรอบปีกรมธรรม์) หน้าโฆษณาของเอไอเอเองเขียนว่า
# "ต่อรอบปีกรมธรรม์" ซึ่งขัดกับตารางผลประโยชน์ในโบรชัวร์ของเอไอเอเอง เรายึดตารางผลประโยชน์
ipd_annual_limit_thb: 200000
ipd_limit_basis: per_confinement
opd_annual_limit_thb: null
room_board_thb_per_night: 1500
deductible_thb: 0
copay_percent: 0
copay_on_renewal: >-
  ปีแรกไม่มีค่าใช้จ่ายร่วม แต่ในปีต่ออายุ ถ้าเคลมผู้ป่วยในด้วยโรคเล็กน้อยทั่วไปตั้งแต่ 3 ครั้ง
  และอัตราการเคลมตั้งแต่ 200% หรือเคลมโรคทั่วไป (ยกเว้นผ่าตัดใหญ่/โรคร้ายแรง 50 โรค)
  ตั้งแต่ 3 ครั้งและอัตราการเคลมตั้งแต่ 400% จะมีค่าใช้จ่ายร่วม 30% ถ้าเข้าเงื่อนไขทั้งสองข้อ
  จะเป็น 50% — ตามเงื่อนไขมาตรฐานใหม่ที่ระบุในโบรชัวร์ของเอไอเอ

# เอไอเอเผยแพร่เฉพาะ "ข้อยกเว้นบางส่วน" 3 ข้อ ไม่ใช่ชุดเต็มจากกรมธรรม์
# ที่บันทึกไว้ด้านล่างจึงไม่ครบ และห้ามอ่านว่าเป็นรายการข้อยกเว้นทั้งหมด
exclusions:
  - th: ภาวะที่เป็นผลจากความผิดปกติที่เกิดขึ้นแต่กำเนิด หรือระบบการสร้างอวัยวะของร่างกายไม่สมบูรณ์แต่กำเนิด หรือโรคทางพันธุกรรม หรือความผิดปกติในการพัฒนาการของร่างกาย
    en: null
  - th: การตรวจรักษาหรือการผ่าตัดเพื่อเสริมสวย หรือการแก้ไขปัญหาผิวพรรณ
    en: null
  - th: การตั้งครรภ์ แท้งบุตร ทำแท้ง การคลอดบุตร โรคแทรกซ้อนจากการตั้งครรภ์ การแก้ไขปัญหาการมีบุตรยาก การทำหมันหรือการคุมกำเนิด
    en: null
waiting_period_days: 30


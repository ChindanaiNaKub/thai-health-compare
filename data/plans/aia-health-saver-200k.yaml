  note: >-
    ชาย 35 ปี 7,500 บาท / หญิง 35 ปี 9,200 บาท จากโบรชัวร์เอไอเอ (แผน 200,000)
    ชาย 21-25 ปี 6,900 บาท จากเชิงอรรถหน้าผลิตภัณฑ์ของเอไอเอ
    เอไอเอไม่เผยแพร่ตารางเบี้ยเต็มทุกช่วงอายุ ยอดรวมตลอดสัญญาจึงคำนวณไม่ได้
terms_source:
  url: https://www.aia.co.th/th/our-products/health/aia-health-saver
  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    อายุรับประกัน 11-75 ปี ต่ออายุถึง 98 ปี วงเงิน 200,000 บาทต่อการเข้าพักรักษาตัว
    ครั้งใดครั้งหนึ่ง ค่าห้อง 1,500 บาทต่อวัน แผน 200,000 ไม่มีความคุ้มครองผู้ป่วยนอก
    ระยะเวลาที่ไม่คุ้มครอง 30 วัน (120 วันสำหรับไส้เลื่อน ต้อเนื้อ/ต้อกระจก
    ตัดทอนซิล/อดีนอยด์ และเยื่อบุโพรงมดลูกเจริญผิดที่) — จากตารางผลประโยชน์
    และหน้า 8 ของโบรชัวร์เอไอเอ ไม่ใช่ตัวบทกรมธรรม์ เพราะเอไอเอไม่เผยแพร่กรมธรรม์
    ต่อสาธารณะ ข้อยกเว้นที่บันทึกไว้เป็น "ข้อยกเว้นบางส่วน" ตามที่เอไอเอเผยแพร่เท่านั้น


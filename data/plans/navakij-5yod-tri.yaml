deductible_thb: 0
copay_percent: 0
copay_on_renewal: >-
  ปีแรกไม่มีค่าใช้จ่ายร่วม ส่วนปีต่ออายุบริษัทเขียนไว้ว่า "ปีต่ออายุกรมธรรม์
  บริษัทขอสงวนสิทธิ์ในการเปลี่ยนแปลงเงื่อนไขข้อตกลงความคุ้มครองโดยอาจเพิ่มเงื่อนไข
  ให้ผู้เอาประกันภัยมีค่าใช้จ่ายร่วม (Copayment)" จบแค่นั้น ไม่มีเปอร์เซ็นต์
  ไม่มีเงื่อนไขว่าเคลมเท่าไรถึงโดน ต่างจากไทยประกันชีวิตที่ประกาศครบทั้งสามอย่าง
  แปลว่าผู้ซื้อไม่มีทางรู้ล่วงหน้าว่าจะโดนร่วมจ่ายเมื่อไรและเท่าไร
  เรื่องการปรับเบี้ยเป็นข่าวดีกว่า บริษัทผูกการปรับเบี้ยไว้กับ "ค่าใช้จ่ายในการรักษาพยาบาล
  ที่สูงขึ้น หรือจากประสบการณ์การจ่ายค่าสินไหมทดแทนโดยรวมของพอร์ตโฟลิโอ (Portfolio)"
  คือคิดจากพอร์ตรวม ไม่ใช่ประวัติการเคลมรายคน ดีกว่าไทยประกันสุขภาพที่ปรับรายคนได้ถึง 100%
  และดีกว่าทิพยที่ปรับตามผู้เอาประกันภัยแต่ละราย ทั้งยังต้องแจ้งล่วงหน้าไม่น้อยกว่า 30 วัน
  และต้องเป็นอัตราที่นายทะเบียนเห็นชอบแล้ว
  แต่มีข้อ 17 ที่ต้องอ่านคู่กันเสมอ "บริษัทฯ ขอสงวนสิทธิ์ในการเปลี่ยนแปลงเงื่อนไข
  หรือยกเลิกแผนประกัน ๕ ยอด โดยไม่ต้องแจ้งให้ทราบล่วงหน้า" ยกเลิกทั้งแผนได้โดยไม่ต้องบอกก่อน

# ข้อยกเว้นเฉพาะความคุ้มครองสุขภาพ ข้อ 3 ถึง 18 คัดมาตรงตัวจากหน้าผลิตภัณฑ์ของบริษัทเอง
# ข้อ 1 และ 2 เป็นระยะเวลาที่ไม่คุ้มครอง จึงย้ายไปอยู่ใน waiting_period_days และ terms_source
# บริษัทกำกับท้ายรายการเองว่า "(โดยสังเขป)" ห้ามอ่านว่าเป็นรายการทั้งหมด
exclusions:
  - th: >-
      3. สภาพที่เป็นมาก่อนการเอาประกันภัย สำหรับโรคเรื้อรัง การบาดเจ็บหรือการป่วย
      (รวมถึงภาวะแทรกซ้อน) หรือการบาดเจ็บ
      ที่ยังมิได้รักษาให้หายก่อนวันที่กรมธรรม์ประกันภัยนี้เริ่มมีผลบังคับเป็นครั้งแรกเว้นแต่ 3.1
      ผู้เอาประกันภัยได้แถลงให้บริษัททราบและบริษัทยินยอมรับความเสี่ยงภัย
      โดยไม่มีเงื่อนไขยกเว้นความคุ้มครองดังกล่าว 3.2 โรคเรื้อรัง การบาดเจ็บหรือการป่วย
      (รวมถึงภาวะแทรกซ้อน) นั้น ไม่ปรากฏอาการ
      ไม่ได้รับการตรวจรักษาหรือวินิจฉัยโดยแพทย์หรือไม่ได้พบหรือปรึกษาแพทย์ - ในช่วงระยะเวลา 3 ปี
      ตั้งแต่วันที่กรมธรรม์ประกันภัยนี้เริ่มมีผลบังคับเป็นครั้งแรก - ในระยะเวลา 5 ปี
      ก่อนวันที่กรมธรรม์ประกันภัยนี้ เริ่มมีผลบังคับเป็นครั้งแรก
    en: null
  - th: >-
      4. ภาวะที่เป็นผลจากความผิดปกติที่เกิดขึ้นแต่กำเนิด
      หรือระบบการสร้างอวัยวะของร่างกายไม่สมบูรณ์แต่กำเนิด หรือโรคทางพันธุกรรม
      หรือความผิดปกติในการพัฒนาการของร่างกาย เว้นแต่
      กรมธรรม์ประกันภัยนี้มีผลคุ้มครองมาไม่น้อยกว่าหนึ่งปี (1 ปี)
      และปรากฏอาการหลังผู้เอาประกันภัยมีอายุครบ 16 ปีบริบูรณ์ (ไม่เกินสิบหกปีบริบูรณ์ (16 ปีบริบูรณ์)
    en: null
  - th: >-
      5. การตรวจรักษาหรือการผ่าตัดเพื่อเสริมสวย หรือการแก้ไขปัญหาผิวพรรณ สิว ฝ้า กระ รังแค
      ผมร่วงหรือการควบคุมน้ำหนักตัว  การผ่าตัดที่สามารถทดแทนด้วยการรักษาแนวทางอื่น
      เว้นแต่เป็นการตกแต่งบาดแผล อันเนื่องมาจากอุบัติเหตุที่ได้รับความคุ้มครอง
    en: null
  - th: >-
      6. การตั้งครรภ์ แท้งบุตร ทำแท้ง การคลอดบุตร โรคแทรกซ้อนจากการตั้งครรภ์
      การแก้ไขปัญหาการมีบุตรยาก (รวมถึงการสืบวิเคราะห์และการรักษา) การทำหมันหรือการคุมกำเนิด ยกเว้น
      มะเร็งครรภ์ไข่ปลาอุก (Choriocarcinoma)
    en: null
  - th: >-
      7. โรคเอดส์ หรือกามโรคหรือโรคติดต่อทางเพศสัมพันธ์
    en: null
  - th: >-
      8. การตรวจรักษาหรือการป้องกัน การใช้ยา หรือสารต่างๆ เพื่อชะลอการเสื่อมของวัย
      หรือการใช้ฮอร์โมนทดแทนในวัยใกล้หมดหรือหมดระดู การเสื่อมสมรรถภาพทางเพศ
      การรักษาความผิดปกติทางเพศและการแปลงเพศ
    en: null
  - th: >-
      9. การเข้ารักษาตัวหรือการผ่าตัดในโรงพยาบาลที่มิได้มีการแนะนำโดยแพทย์
    en: null
  - th: >-
      10.การตรวจรักษาความผิดปกติเกี่ยวกับสายตา การทำเลสิค
      ค่าใช้จ่ายสำหรับอุปกรณ์เพื่อช่วยในการมองเห็นหรือการรักษาความผิดปกติของการมองเห็น
    en: null
  - th: >-
      11. ค่าใช้จ่ายเดี่ยวกับการทำฟัน เหงือก เว้นแต่กรณีอุบัติเหตุ ทั้งนี้ไม่รวมค่าฟันปลอม การครอบฟัน
      และการรักษารากฟันหรือใส่รากเทียม (เว้นแต่จะได้มีการขยายความคุ้มครอง)
    en: null
  - th: >-
      12. การรักษาหรือการบำบัดการติดยาเสพติดให้โทษ บุหรี่ สุรา หรือสารออกฤทธิ์ต่อจิตประสาท
    en: null
  - th: >-
      13. การตรวจรักษาอาการ หรือ โรคที่เกี่ยวข้องกับภาวะทางจิตใจ
    en: null
  - th: >-
      14. การตรวจรักษาที่ยังอยู่ในระหว่างทดลอง การตรวจหรือการรักษาโรคหรืออาการหยุดหายใจขณะหลับ
      การตรวจหรือการรักษาความผิดปกติของการนอนหลับ การนอนกรน
    en: null
  - th: >-
      15. การปลูกฝีหรือการฉีดวัคซีนป้องกันโรค
      ยกเว้นการฉีดวัคซีนป้องกันโรคพิษสุนัขบ้าภายหลังการถูกสัตว์ทำร้าย และวัคซีนป้องกันบาดทะยัก
      ภายหลังได้รับการบาดเจ็บ
    en: null
  - th: >-
      16. การตรวจรักษาที่ไม่ใช่แผนปัจจุบัน รวมถึงแพทย์ทางเลือก เช่น การฝังเข็ม ชีวจิต
    en: null
  - th: >-
      17. ค่าใช้จ่ายที่เกิดจากการตรวจรักษาพยาบาลที่ผู้เอาประกันภัย ซึ่งเป็นแพทย์สั่งให้แก่ตัวเอง
      รวมทั้งค่าใช้จ่ายที่เกิดจากการตรวจรักษาพยาบาลจากแพทย์ ผู้ซึ่งเป็น บิดา มารดา คู่สมรส
      หรือบุตรของผู้เอาประกันภัย
    en: null
  - th: >-
      18. ค่ารักษาพยาบาลที่เกิดจากการพยายามฆ่าตัวตาย ทำร้ายร่างกายตนเอง
      รวมถึงอุบัติเหตุจากการที่ผู้เอาประกันภัย กิน ดื่ม หรือฉีดยาหรือสารมีพิษเข้าร่างกาย
      การใช้ยาเกินกว่าที่แพทย์สั่ง
    en: null
waiting_period_days: 30

premium_source:
  url: https://www.navakij.co.th/public/core/uploaded/insurance/file/95625a78cb596c44869408c9a708651b.pdf
  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    ตารางเบี้ยอยู่ในเอกสารรายละเอียดผลิตภัณฑ์ของบริษัทเอง หน้า 4 (รหัสแก้ไข
    Rev.ALL5YOD_20251215_3) ครบทั้ง 13 ช่วงอายุ ไม่ใช่ตัวอย่างรายจุด
    หน้าผลิตภัณฑ์เขียนกำกับว่า "เบี้ยประกันข้างต้นรวมอากรแสตมป์แล้ว"
    ตัวเลขในตารางจึงเป็นยอดที่จ่ายจริง ไม่ต้องบวกอะไรเพิ่ม
    อัตราเดียวกันทั้งชายและหญิง ทั้งเอกสารไม่มีการแยกเพศเลยสักที่
    สามเรื่องที่ต้องรู้คู่กับตัวเลข
    (1) ตั้งแต่ช่วงอายุ 56-60 ขึ้นไป บริษัทกำกับทุกช่วงว่า "(ต่ออายุเท่านั้น)"
    แปลว่าคนอายุเกิน 55 สมัครใหม่ไม่ได้ ตัวเลขช่วงท้ายมีไว้สำหรับคนที่ถือกรมธรรม์มาก่อนแล้ว
    ตรงกับเงื่อนไขรับประกันที่เขียนว่ารับอายุแรกเข้า 11-55 ปี
    (2) ตารางนี้มีวันหมดอายุของตัวเอง บริษัทเขียนว่า "หนังสือเสนอราคาฉบับนี้มีผลบังคับ
    ภายในวันที่ 31 ธันวาคม 2569" เป็นบริษัทเดียวในชุดข้อมูลนี้ที่ประทับวันหมดอายุ
    ไว้บนตารางราคาของตัวเอง วันนั้นคือวันที่ต้องกลับมาตรวจซ้ำ
    (3) ตัวเลขด้านบนเป็นแผนพื้นฐาน ยังไม่รวมความคุ้มครองผู้ป่วยนอกทั่วไป
    ถ้าจะซื้อเพิ่ม บริษัทมีตารางเบี้ยผู้ป่วยนอกแยกอีกชุด 13 ช่วงอายุเท่ากัน ห้าแบบ
    แบบที่ให้วงเงิน 1,200 บาทต่อครั้งสำหรับแผนนี้ เริ่มที่ 8,496 บาทต่อปีที่อายุ 11-15 ปี
    เส้นกราฟเบี้ยผู้ป่วยนอกวิ่งสวนทางกับเบี้ยผู้ป่วยใน คือถูกลงเรื่อยๆ จนต่ำสุดที่ช่วงอายุ 41-45
    แล้วค่อยขึ้น ห้ามเอาสองตารางมาเฉลี่ยรวมกัน
    เรื่องสำคัญที่ผู้อ่านต้องรู้ก่อนเทียบกับแผนอื่น แผนนี้ไม่ใช่ประกันสุขภาพล้วน
    แต่พ่วงประกันอุบัติเหตุ อบ.2 วงเงิน 20,000 บาท กับเงินชดเชยรายวันโรคมะเร็งและหัวใจ
    มาในเบี้ยก้อนเดียวกัน แกะออกไม่ได้ เบี้ยที่เห็นจึงเป็นราคาของสองอย่าง ไม่ใช่อย่างเดียว
    และแผนนี้ซื้อได้เฉพาะคนสัญชาติไทยที่พำนักในไทย คุ้มครองค่ารักษาในประเทศไทยเท่านั้น
    ใช้ยื่นวีซ่าไม่ได้
terms_source:
  url: https://www.navakij.co.th/th/products/miscellaneous-insurance/ประกัน-๕-ยอด-มีไว้ยอดเยี่ยม-หมดห่วงเรื่องประกัน
  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    ข้อจำกัดที่ต้องบอกก่อน นวกิจไม่เผยแพร่ตัวบทกรมธรรม์เลย ทั้งเว็บมีแค่ใบคำขอ
    กับเอกสารรายละเอียดผลิตภัณฑ์ และหน้าผลิตภัณฑ์เองก็เขียนโยนไปที่เอกสารที่ไม่ได้เผยแพร่ว่า
    "เงื่อนไขความคุ้มครอง และข้อยกเว้นเป็นไปตามกรมธรรม์ประกันภัยสุขภาพและอุบัติเหตุส่วนบุคคล"
    เราไล่ดูหน้าผลิตภัณฑ์ทั้งแปดหน้าในหมวดประกันเบ็ดเตล็ด หน้ารวมผลิตภัณฑ์
    และหน้าเปิดเผยข้อมูลตามประกาศ คปภ. เมื่อ 2026-08-10 ไม่พบตัวบทกรมธรรม์
    ระเบียนนี้จึงใช้ tier เป็น official_insurer ไม่ใช่ filed_wording
    ข้อดีที่ต้องพูดถึงคู่กัน รายการข้อยกเว้นบนหน้าขายของนวกิจละเอียดกว่าที่เอไอเอ
    เอฟดับบลิวดี หรือกรุงเทพประกันชีวิตเผยแพร่ที่ใดเลย คือข้อยกเว้นสุขภาพ 18 ข้อ
    ข้อยกเว้นทั่วไป 5 ข้อ และรายการเฉพาะผู้ป่วยนอกกับเฉพาะอุบัติเหตุอีกสองชุด
    แต่บริษัทก็ยังกำกับว่า "(โดยสังเขป)" อยู่ดี จึงต้องอ่านว่าไม่ครบ
    เรื่องวงเงินผู้ป่วยใน คือช่องที่เว้นว่างไว้ในระเบียนนี้
    นวกิจไม่ประกาศวงเงินรวมของผู้ป่วยในเลย ไม่มีทั้ง "วงเงินสูงสุดต่อปี" และ
    "ผลประโยชน์สูงสุดต่อการเข้าพักรักษาตัวครั้งใดครั้งหนึ่ง" มีแต่วงเงินย่อยรายหมวด
    ทั้ง 13 หมวด แต่ละหมวดคิดต่อการเข้าพักรักษาครั้งใดครั้งหนึ่ง ยกเว้นหมวด 9-11
    (ไตวายเรื้อรัง รังสีรักษา เคมีบำบัด) ที่คิดต่อรอบปีกรมธรรม์
    ตัวเลขที่ใกล้เคียงวงเงินรวมที่สุดคือความคุ้มครองส่วนเกิน 500,000 บาทของแผนนี้
    แต่ห้ามบันทึกเป็นวงเงินผู้ป่วยใน เพราะเป็นการจ่ายเพิ่ม 90% ของส่วนที่เกินวงเงินหมวดปกติ
    นับเฉพาะหมวด 2-5 ไม่รวมค่าห้อง ไม่รวมการผ่าตัดเปลี่ยนอวัยวะ และคิดต่อการบาดเจ็บ
    หรือการป่วยแต่ละครั้ง ไม่ใช่ต่อปี ถ้าเอามาแสดงเป็นวงเงินรวมจะทำให้ผู้อ่านเข้าใจผิดทันที
    อีกเพดานที่ต้องรู้ ถ้าถือกรมธรรม์สุขภาพของนวกิจหลายฉบับ บริษัทเขียนว่า
    "ผลประโยชน์รวมสูงสุดไม่เกินวงเงิน 2 ล้านบาท" ซื้อเพิ่มก็ไม่ทะลุเพดานนี้
    เรื่องค่าห้อง 4,200 บาทต่อคืนดูดี แต่ต้องอ่านคู่กับเพดาน 45 คืน
    ไทยประกันสุขภาพแผน SP1500 ให้ค่าห้อง 1,500 บาทเท่ากับแผนเอกแต่ให้ถึง 60 คืน
    ตัวเลขต่อคืนอย่างเดียวจึงเทียบกันตรงๆ ไม่ได้ ส่วนห้อง ICU จ่ายถึง 8,400 บาทต่อคืน
    แต่จำกัดที่ 15 คืน
    ระยะเวลาที่ไม่คุ้มครอง 30 วันสำหรับการป่วยทั่วไป และ 120 วันสำหรับแปดกลุ่มโรค
    คือ เนื้องอก ถุงน้ำ หรือมะเร็งทุกชนิด ริดสีดวงทวาร ไส้เลื่อนทุกชนิด ต้อเนื้อหรือต้อกระจก
    การตัดทอนซิลหรืออดีนอยด์ นิ่วทุกชนิด เส้นเลือดขอดที่ขา และเยื่อบุโพรงมดลูกเจริญผิดที่
    ชุดเดียวกับวิริยะ แอกซ่า และไทยประกันสุขภาพ
    การนับ "ครั้งใดครั้งหนึ่ง" ใช้เกณฑ์ 90 วัน บริษัทเขียนว่าเบิกค่ารักษาโรคเดิมได้
    "แต่ต้องเว้นระยะเวลาจากการรักษาในครั้งก่อน 90 วัน" เกณฑ์เดียวกับเอไอเอและไทยประกันสุขภาพ
    คำว่า "มาตรฐานประกันสุขภาพแบบใหม่" ไม่ปรากฏที่ใดในเอกสารของบริษัทเลย
    แต่ตารางผลประโยชน์ใช้โครงสร้าง 13 หมวดตามมาตรฐานใหม่ครบถ้วน รวมถึงการแยก
    การผ่าตัดใหญ่ที่ไม่ต้องนอนโรงพยาบาล (Day Surgery) และหมวดย่อย 4.5
    จึงบันทึก new_health_standard เป็นจริงจากโครงสร้าง ไม่ใช่จากถ้อยคำ


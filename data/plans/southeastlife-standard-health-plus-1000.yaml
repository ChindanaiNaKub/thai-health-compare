# บริษัทไม่ประกาศวงเงินผู้ป่วยในรวมต่อครั้งหรือต่อปีเลย มีแต่วงเงินย่อยรายหมวด 13 หมวด
# (ต่างจากแรบบิท ไลฟ์ เฮลท์ โพรเทค ที่อย่างน้อยประกาศ "ผลประโยชน์สูงสุดต่อครั้ง" ของแผนสูงสุด)
# จึงเว้นเป็นไม่มีข้อมูล แทนที่จะรวมตัวเลขรายหมวดเองซึ่งจะกลายเป็นตัวเลขที่บริษัทไม่ได้ประกาศ
ipd_annual_limit_thb: null
ipd_limit_basis: per_confinement
# หมวด 6.2 และหมวด 7 ให้ค่ารักษาผู้ป่วยนอกเฉพาะต่อเนื่องหลังผู้ป่วยในหรือจากอุบัติเหตุ
# เป็นวงเงินต่อครั้ง ไม่ใช่ต่อปี ไม่มีวงเงินผู้ป่วยนอกทั่วไปรายปี เลข 0 นี้เป็นข้อเท็จจริง
opd_annual_limit_thb: 0
room_board_thb_per_night: 1000
# คำว่า "ความรับผิดส่วนแรก" และ "ค่าใช้จ่ายร่วม" ไม่ปรากฏในโบรชัวร์นี้เลยแม้แต่ครั้งเดียว
# (ตรวจด้วยการค้นทั้งไฟล์ 6 หน้า) ต่างจากเฮลท์ โพรเทค ของแรบบิท ไลฟ์ ที่อย่างน้อยยืนยันตรงๆ

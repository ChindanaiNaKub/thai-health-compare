  note: >-
    โบรชัวร์ "สแตนดาร์ด เฮลท์ พลัส" ของอาคเนย์ประกันชีวิต ตารางอัตราเบี้ยประกันภัยรายปี
    ชั้นอาชีพ 1 และ 2 (สองหน้าแยกชายหญิง) ครบทั้ง 14 ช่วงอายุตั้งแต่ 11-15 ถึง 76-80 ปี
    บันทึกไว้ครบทั้งหมดด้านบนคอลัมน์แผน 1,000 ตรงกับหน้าโฆษณาที่เขียนว่า
    "เบี้ยฯ เริ่มต้น 9 บ./วัน* ... *ตัวอย่างเบี้ยประกันภัยเพศชายอายุ 16-20 ปี แผน 1,000"
    (3,114 บาท/ปี ÷ 365 ≈ 8.5 บาท/วัน ปัดเป็น 9 บาท) ข้อจำกัดสำคัญ (1) บริษัทตีพิมพ์
    ตารางเบี้ยแยกอีก 3 ชุดสำหรับชั้นอาชีพ 3 และ 4 (สูงกว่าชั้นอาชีพ 1-2 ชัดเจน โดยเฉพาะ
    ช่วงอายุ 76-80 ชั้นอาชีพ 4 เพศชายอยู่ที่ 73,569 บาท เทียบกับ 49,046 บาทของชั้นอาชีพ 1-2)
    ระเบียนนี้บันทึกเฉพาะชั้นอาชีพ 1-2 (2) สื่อฉบับนี้ระบุว่า "ใช้ตั้งแต่วันที่ 8 พฤศจิกายน 2564
    เป็นต้นไป หรือจนกว่าจะมีการเปลี่ยนแปลง" ไม่มีวันหมดอายุกำกับตายตัวเหมือนตารางของนวกิจ
terms_source:
  url: https://www.southeastlife.co.th/uploads/product/pdf/20230619154520_7750.pdf
  tier: official_insurer
  verified_on: 2026-08-12
  note: >-
    บริษัทไม่เผยแพร่ตัวบทกรมธรรม์หรือเอกสารสรุปสาระสำคัญที่ใดในเว็บไซต์เลย ตรวจหน้า
    "บริการลูกค้า" (https://www.southeastlife.co.th/services/policy-holder) และหน้าศูนย์
    บริการแล้วเมื่อ 2026-08-12 พบแต่แบบฟอร์มธุรการ (คำขอเปลี่ยนแปลงกรมธรรม์ แบบฟอร์มเคลม)
    ไม่มีตัวบทกรมธรรม์ โบรชัวร์ 6 หน้านี้จึงเป็นเอกสารที่เป็นทางการที่สุดที่หาได้ ใช้ tier
    เป็น official_insurer หน้าผลิตภัณฑ์เขียนคำว่า "สัญญาเพิ่มเติมการประกันสุขภาพมาตรฐานใหม่"
    ตรงตัวเลย จึงบันทึก new_health_standard เป็นจริงจากถ้อยคำโดยตรง ไม่ใช่แค่จากโครงสร้าง
    13 หมวด เงื่อนไขการรับประกันภัยระบุ "อายุรับประกันภัย 11-70 ปี (ต่ออายุได้ถึงอายุ 80 ปี)"
    ระยะเวลาที่ไม่คุ้มครอง 30 วันทั่วไป และ 120 วันสำหรับแปดกลุ่มโรค (เนื้องอก/ถุงน้ำ/มะเร็ง
    ทุกชนิด ริดสีดวงทวาร ไส้เลื่อนทุกชนิด ต้อเนื้อ/ต้อกระจก ตัดทอนซิล/อดีนอยด์ นิ่วทุกชนิด
    เส้นเลือดขอดที่ขา เยื่อบุโพรงมดลูกเจริญผิดที่) ชุดเดียวกับที่นวกิจและวิริยะประกาศ
    ข้อยกเว้นที่บันทึกไว้กำกับว่า "ข้อยกเว้นบางส่วน" เอง จึงต้องอ่านว่าไม่ครบ
    ไม่พบข้อความเรื่องความรับผิดส่วนแรกหรือค่าใช้จ่ายร่วมในเอกสารนี้เลย (ดูหมายเหตุที่
    deductible_thb/copay_percent ด้านบน) และไม่พบเงื่อนไขค่าใช้จ่ายร่วมเมื่อต่ออายุ
    (copay on renewal) ในเอกสารนี้เช่นกัน


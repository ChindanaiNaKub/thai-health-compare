# เพราะเป็นค่าตั้งต้นของสคีมา แต่ต้องอ่านคู่กับข้อจำกัดนี้เสมอ ไม่ใช่ตัวเลขที่บริษัทยืนยัน
deductible_thb: 0
copay_percent: 0

# "ข้อยกเว้นบางส่วน" ตามที่บริษัทกำกับไว้เอง ไม่ใช่ชุดเต็มจากกรมธรรม์
exclusions:
  - th: ผู้เอาประกันภัยฉ้อฉลประกันภัย
    en: null
  - th: >-
      สภาพที่เป็นมาก่อนการเอาประกันภัย (Pre-existing Condition) เว้นแต่ ผู้เอาประกันภัย
      ได้แถลงให้บริษัททราบ และบริษัทยินยอมรับความเสี่ยงภัย โดยไม่มีเงื่อนไขยกเว้นความคุ้มครอง
      ดังกล่าว หรือ โรคเรื้อรัง การบาดเจ็บ หรือการป่วย (รวมถึงภาวะแทรกซ้อน) นั้นไม่ปรากฏอาการ
      ไม่ได้รับการตรวจรักษาหรือวินิจฉัยโดยแพทย์ หรือไม่ได้พบหรือปรึกษาแพทย์ ในระยะ 5 ปี
      ก่อนวันที่สัญญาเพิ่มเติมเริ่มมีผลคุ้มครองเป็นครั้งแรก และในช่วงเวลา 3 ปี ตั้งแต่วันที่
      สัญญาเพิ่มเติมนี้เริ่มมีผลคุ้มครองเป็นครั้งแรก
    en: null
  - th: >-
      ข้อยกเว้นทั่วไป ตามที่ระบุในสัญญาเพิ่มเติมนี้ เช่น ภาวะที่เป็นผลจากความผิดปกติที่เกิดขึ้น
      แต่กำเนิด การตรวจรักษาที่ยังอยู่ในระหว่างทดลอง การแก้ไขปัญหาการมีบุตรยาก (รวมถึงการสืบ
      วิเคราะห์และการรักษา) การพักฟื้นหรือการพักเพื่อการฟื้นฟู หรือการรักษาโดยวิธีให้พักอยู่เฉยๆ
      เป็นต้น
    en: null
  - th: การยกเว้น หรือการไม่คุ้มครองใดๆ ตามที่ระบุไว้ในแต่ละข้อตกลงคุ้มครอง
    en: null
waiting_period_days: 30


# 80 ปีมาจากโบรชัวร์ แต่ต้องอ่านคู่กับเงื่อนไขว่าสัญญาสิ้นผลทันทีถ้าสัญญาหลักสิ้นผล
# เพดานนี้จึงไม่ได้ขึ้นกับสัญญาสุขภาพอย่างเดียว
renewal_ceiling_age: 80

# 1,000,000 บาท คิดต่อรอบปีกรมธรรม์ ไม่ใช่ต่อการเข้าพักรักษาครั้งใดครั้งหนึ่ง
# ต่างจากเอไอเอ ไทยประกันสุขภาพ นวกิจ และแปซิฟิค ครอส ที่คิดต่อครั้ง
# ถ้าตรวจพบโรคร้ายแรง 44 โรค บริษัทเพิ่มวงเงินให้เป็นสองเท่าของตัวเลขนี้
ipd_annual_limit_thb: 1000000
ipd_limit_basis: per_policy_year
# บริษัทเขียนว่า "ไม่คุ้มครอง" ในช่องผู้ป่วยนอกของแผนนี้ เลข 0 จึงเป็นข้อเท็จจริง
opd_annual_limit_thb: 0
# 2,500 บาทต่อวัน จำกัดไม่เกิน 365 วันต่อการเข้าพักรักษาครั้งใดครั้งหนึ่ง
# เป็นเพดานจำนวนวันแบบต่อครั้ง ซ้อนอยู่ใต้เพดานเงินแบบต่อปี
room_board_thb_per_night: 2500
# แผนนี้ไม่มีความรับผิดส่วนแรก บริษัทเขียนว่า "ไม่มี" ในตารางผลประโยชน์
deductible_thb: 0
copay_percent: 0
copay_on_renewal: >-
  ปีแรกไม่มีค่าใช้จ่ายร่วม ส่วนปีต่ออายุ เจนเนอราลี่ประกาศกลไกไว้ครบทั้งสามระดับในโบรชัวร์
  ระดับแรก ถ้าเคลมผู้ป่วยในตั้งแต่ 3 ครั้งขึ้นไปด้วยโรคเล็กน้อยทั่วไป และมีอัตราการเคลมรวม
  ตั้งแต่ 200% ขึ้นไป จะร่วมจ่าย 30% ของค่ารักษาในปีถัดไป
  ระดับที่สอง ถ้าเคลมผู้ป่วยในตั้งแต่ 3 ครั้งขึ้นไปด้วยโรคทั่วไปที่ไม่ใช่โรคร้ายแรง
  และมีอัตราการเคลมรวมตั้งแต่ 400% ขึ้นไป จะร่วมจ่าย 30% เช่นกัน
  ระดับที่สาม ถ้าเข้าเงื่อนไขทั้งสองกรณี จะร่วมจ่ายสูงสุด 50%
  ข้อดีที่ต้องบอกด้วย บริษัทเขียนทางออกไว้ให้ว่า "หากการเคลมของผู้เอาประกันภัย
  มีการปรับตัวลดลงตามเกณฑ์ บริษัทประกันภัยจะยกเลิกการมีส่วนร่วมจ่าย Copayment"
  คือร่วมจ่ายแล้วมีสิทธิ์หลุดออกได้ ไม่ใช่ติดไปตลอดสัญญา
  โครงสร้าง 3 ครั้ง / 200% / 400% / 30% / 50% เป็นชุดมาตรฐานของ คปภ.
  ชุดเดียวกับที่เอไอเอ ไทยประกันชีวิต และไทยสมุทรใช้

# บริษัทเผยแพร่ข้อยกเว้นเพียงบางส่วน และพาดหัวรายการของตัวเองว่า "ข้อยกเว้นบางส่วน"
# มีแค่สามข้อ และไม่มีเอกสารข้อยกเว้นฉบับเต็มที่ใดบนเว็บของบริษัท เราจึงเว้นว่างไว้
# แทนที่จะแสดงสามข้อนั้นราวกับเป็นรายการทั้งหมด เหตุผลเต็มอยู่ใน terms_source
exclusions: []
waiting_period_days: 30

premium_source:
  url: https://generali.co.th/download/brochure-gen-health-hero-plus/?wpdmdl=95007
  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    ตารางเบี้ยในโบรชัวร์ของเจนเนอราลี่เป็นช่วงอายุจริงครบทั้ง 14 ช่วง ตั้งแต่แรกเกิดถึง 70 ปี
    แยกชายหญิง และครบทั้งเก้าแผน ไม่ใช่ตัวอย่างรายจุดแบบที่เอไอเอ กรุงเทพประกันชีวิต
    หรือไทยสมุทรแผนใหญ่เผยแพร่ ในกลุ่มบริษัทประกันชีวิตด้วยกัน นี่คือตารางที่สมบูรณ์ที่สุด
    ที่โครงการนี้หาเจอ
    ข้อสังเกตเรื่องเพศ ผู้ชายจ่ายแพงกว่าผู้หญิงในช่วงเด็ก (0-15 ปี) แต่ผู้หญิงจ่ายแพงกว่า
    ตั้งแต่ 16 ปีขึ้นไปเกือบทุกช่วง แล้วกลับมาถูกกว่าอีกครั้งช่วง 56 ปีขึ้นไป
    เส้นสองเส้นตัดกันสามครั้ง ไม่ใช่ว่าบริษัทคิดผู้หญิงแพงกว่าเสมอ
    ข้อสังเกตเรื่องอายุ ช่วง 0-5 ปีแพงกว่าช่วง 16-20 ปีเกือบสี่เท่าที่ความคุ้มครองเท่ากัน
    รูปแบบเดียวกับทุกบริษัทในชุดข้อมูลนี้
    บริษัทพิมพ์ข้อสงวนสิทธิ์ปรับเบี้ยไว้ใต้ตารางเองว่าอาจปรับ "อันเนื่องมาจากปัจจัยอื่นๆ
    เช่น ค่าใช้จ่ายในการรักษาพยาบาล หรือจากประสบการณ์การจ่ายค่าสินไหมทดแทนโดยรวม"
    โดยแจ้งล่วงหน้าไม่น้อยกว่า 30 วัน คือปรับจากพอร์ตรวม ไม่ใช่ประวัติการเคลมรายคน
    ตัวเลขในตารางจึงเป็นเบี้ยปีแรก ไม่ใช่เบี้ยที่ตรึงตลอดสัญญา
terms_source:
  url: https://generali.co.th/individual-insurance/gen-health-hero-2/
  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    เจนเนอราลี่ไม่เผยแพร่ตัวบทกรมธรรม์ของสัญญาเพิ่มเติมนี้ มีแต่โบรชัวร์
    ระเบียนนี้จึงใช้ tier เป็น official_insurer ไม่ใช่ filed_wording
    เรื่องข้อยกเว้น โบรชัวร์พาดหัวรายการของตัวเองว่า "ข้อยกเว้นบางส่วน" แล้วพิมพ์มาสามข้อ
    เราเลือกเว้นช่องข้อยกเว้นไว้ว่าง แทนที่จะเอาสามข้อนั้นมาแสดง เพราะการแสดงสามข้อ
    บนเว็บเทียบประกันจะทำให้ผู้อ่านเข้าใจว่านั่นคือรายการทั้งหมด ทั้งที่บริษัทบอกเองว่าไม่ใช่
    ใครที่จะซื้อจริงต้องขอตัวบทกรมธรรม์จากบริษัทก่อนเซ็น
    เรื่องที่ต้องระวังที่สุดของแผนนี้ ไม่ใช่ตัวเลขในตาราง แต่เป็นสิ่งที่ไม่มีในตาราง
    บริษัทเขียนว่าสัญญาเพิ่มเติมนี้คุ้มครอง "จนกระทั่งแบบประกันภัยหลักสิ้นผลบังคับ"
    แต่ไม่บอกว่าสัญญาหลักคือแบบไหน ทุนเท่าไร ราคาเท่าไร เงินที่ต้องจ่ายจริงต่อปี
    จึงมากกว่าตัวเลขในตารางนี้เสมอ และไม่มีใครบอกได้ว่ามากกว่าเท่าไรจนกว่าจะคุยกับตัวแทน
    ช่องว่างนี้คือสิ่งที่เว็บนี้ตั้งใจทำให้เห็น ไม่ใช่ช่องว่างที่เราหาข้อมูลไม่เจอ
    ระยะเวลาที่ไม่คุ้มครอง 30 วันสำหรับการป่วยทั่วไป และ 120 วันสำหรับแปดกลุ่มโรคมาตรฐาน
    และมีอีกชุดที่ยาวผิดปกติ คือ 12 เดือนสำหรับหมวด 17 20 และ 21
    (วัคซีน ตรวจสุขภาพประจำปี และการดูแลดวงตา)
    เรื่องวงเงิน ตัวเลข 1,000,000 บาทคิดต่อรอบปีกรมธรรม์ ได้วงเงินใหม่ทุกปี
    ต่างจากเอไอเอ ไทยประกันสุขภาพ นวกิจ และแปซิฟิค ครอส ที่คิดต่อการเข้าพักรักษาแต่ละครั้ง
    สองแบบนี้เทียบกันตรงๆ ไม่ได้ และแบบต่อปีมักดีกว่าสำหรับคนที่ป่วยหลายโรคในปีเดียว
    ส่วนค่าห้อง 2,500 บาทต่อวันมีเพดาน 365 วันต่อการเข้าพักครั้งใดครั้งหนึ่งกำกับไว้อีกชั้น
    คำว่า "มาตรฐานประกันสุขภาพแบบใหม่" ไม่ปรากฏในโบรชัวร์ แต่ตารางผลประโยชน์ใช้โครงสร้าง
    13 หมวดตามมาตรฐานใหม่ครบ แล้วเพิ่มหมวด 14-21 เป็นผลประโยชน์เพิ่มเติม
    จึงบันทึก new_health_standard เป็นจริงจากโครงสร้าง ไม่ใช่จากถ้อยคำ


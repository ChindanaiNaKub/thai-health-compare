# ไทยประกันสุขภาพ Simply Healthy แผน SP3000 (ค่าห้อง 3,000 บาท/วัน)
# เป็นแผนแรกในชุดข้อมูลนี้ที่บริษัทประกาศ "ตารางเบี้ยครบทุกช่วงอายุ" ตั้งแต่ 15 วัน ถึง 85 ปี
# และเป็นแผนแรกที่มีตัวบทกรมธรรม์เผยแพร่จริง (tier: filed_wording)
id: thaihealth-simply-healthy-sp3000
insurer:
  th: ไทยประกันสุขภาพ
  en: Thai Health Insurance PCL
name:
  th: Simply Healthy — แผน SP3000 (ผู้ป่วยในอย่างเดียว ไม่มีความคุ้มครองค่ารักษาที่มีค่าใช้จ่ายสูง)
  en: Simply Healthy — plan SP3000 (IPD only, no major medical)

type: standalone
host_policy: null

shape: per_item_schedule
new_health_standard: true

# ตารางบนหน้าผลิตภัณฑ์ "IPD ผู้ป่วยใน เบี้ยประกันภัยรายปี รวมอากรแสตมป์
# ตารางเบี้ยประกันสุขภาพ เริ่ม 1 ม.ค. 2568" คอลัมน์ SP3000 ครบทั้ง 13 ช่วงอายุ
# อัตราเดียวกันทั้งชายและหญิง บริษัทไม่แยกเพศ
# ช่วง 71-75 และ 76-85 บริษัทกำกับว่า "เฉพาะกรณีต่ออายุ" ไม่รับสมัครใหม่
premium:
  - { age_from: 0, age_to: 5, thb_per_year: 73078 }
  - { age_from: 6, age_to: 10, thb_per_year: 33965 }
  - { age_from: 11, age_to: 20, thb_per_year: 14409 }
  - { age_from: 21, age_to: 35, thb_per_year: 11615 }
  - { age_from: 36, age_to: 40, thb_per_year: 13291 }
  - { age_from: 41, age_to: 45, thb_per_year: 14409 }
  - { age_from: 46, age_to: 50, thb_per_year: 17203 }
  - { age_from: 51, age_to: 55, thb_per_year: 19996 }
  - { age_from: 56, age_to: 60, thb_per_year: 22790 }
  - { age_from: 61, age_to: 65, thb_per_year: 28462 }
  - { age_from: 66, age_to: 70, thb_per_year: 39805 }
  - { age_from: 71, age_to: 75, thb_per_year: 56903 }
  - { age_from: 76, age_to: 85, thb_per_year: 84841 }

entry_age_min: 0
entry_age_max: 70
# หน้าผลิตภัณฑ์เขียนว่าต่ออายุได้ถึง 85 ปี แต่ตัวบทกรมธรรม์ที่บริษัทเผยแพร่เอง ข้อ 6.1
# เขียนว่า "อายุไม่เกิน 80 ปี" เราบันทึกตัวเลขของกรมธรรม์ ไม่ใช่ตัวเลขของหน้าขาย
# (ดูรายละเอียดความขัดแย้งใน terms_source.note)
renewal_ceiling_age: 80

# 390,000 บาท คือ "ผลประโยชน์กรณีผู้ป่วยใน" ของแผน SP3000 คิดต่อการเข้าพักรักษาตัว
# เป็นผู้ป่วยในครั้งใดครั้งหนึ่ง (Per Confinement) ไม่ใช่ต่อรอบปีกรมธรรม์
# ยกเว้นหมวด 9-11 (ล้างไต รังสีรักษา เคมีบำบัด) ที่คิดต่อรอบปีกรมธรรม์
ipd_annual_limit_thb: 390000
ipd_limit_basis: per_confinement
# ผู้ป่วยนอกเป็นตารางเบี้ยแยกต่างหาก ต้องซื้อพ่วง IPD เสมอ ซื้อเดี่ยวไม่ได้
# แผนนี้เป็นแผน IPD ล้วน จึงไม่มีวงเงิน OPD
opd_annual_limit_thb: null
room_board_thb_per_night: 3000
deductible_thb: 0
copay_percent: 0
copay_on_renewal: >-
  ไทยประกันสุขภาพไม่มีเงื่อนไขค่าใช้จ่ายร่วม (Copayment) ในเอกสารที่เผยแพร่เลย
  แต่มีกลไกที่ให้ผลคล้ายกันและระบุตัวเลขไว้ชัดกว่า คือหน้าผลิตภัณฑ์เขียนว่า
  "เบี้ยประกันภัยสำหรับปีต่ออายุของผู้เอาประกันภัยแต่ละราย อาจถูกปรับขึ้นตามประวัติ
  การรับประกันของปีกรมธรรม์ก่อนหน้า สูงสุดไม่เกิน 100 เปอร์เซ็นต์ของเบี้ยประกันมาตรฐาน"
  และ "ส่วนลดพิเศษ 10 เปอร์เซ็นต์ในปีต่ออายุ กรณีที่ไม่มีการเรียกร้องสินไหมในปีกรมธรรม์ก่อนหน้า"
  แปลว่าตารางเบี้ยข้างต้นเป็น "พื้น" ไม่ใช่ "ราคา" คนที่เคลมอาจถูกเรียกเก็บได้ถึงสองเท่า
  ของตัวเลขในตาราง ยอดรวมตลอดสัญญาที่คำนวณจากตารางนี้จึงเป็นกรณีดีที่สุดเท่านั้น
  นอกจากนี้บริษัทยังสงวนสิทธิ์ไม่ต่ออายุรายบุคคลได้ "ภายใน 2 ปีแรกหลังเริ่มทำประกันภัย"

# ข้อยกเว้นจากเอกสารสรุปสาระสำคัญที่บริษัทเผยแพร่เอง ซึ่งบริษัทกำกับท้ายเอกสารว่า
# "เอกสารนี้เป็นการสรุปสาระสำคัญ เงื่อนไขความคุ้มครอง ข้อยกเว้น บางส่วนเท่านั้น"
# จึงห้ามอ่านว่าเป็นรายการทั้งหมด
exclusions:
  - th: โรคเรื้อรัง การบาดเจ็บ หรือการป่วย (รวมถึงภาวะแทรกซ้อน) ที่ยังมิได้รักษาให้หายก่อนวันที่กรมธรรม์ประกันภัยนี้เริ่มมีผลบังคับเป็นครั้งแรก เว้นแต่ไม่ปรากฏอาการ ไม่ได้รับการตรวจรักษาหรือวินิจฉัยโดยแพทย์ ในระยะเวลาห้าปี (5 ปี) ก่อนวันที่กรมธรรม์เริ่มมีผลบังคับเป็นครั้งแรก และในช่วงระยะเวลาสามปี (3 ปี) ตั้งแต่วันที่กรมธรรม์เริ่มมีผลบังคับเป็นครั้งแรก
    en: null
  - th: ภาวะที่เป็นผลจากความผิดปกติที่เกิดขึ้นแต่กำเนิด เว้นแต่กรมธรรม์มีผลคุ้มครองมาไม่น้อยกว่าหนึ่งปี (1 ปี) และปรากฏอาการหลังผู้เอาประกันภัยมีอายุครบสิบหกปีบริบูรณ์
    en: null
  - th: การตรวจรักษาหรือการผ่าตัดเพื่อเสริมสวย
    en: null
  - th: การตั้งครรภ์ การคลอดบุตร และภาวะแทรกซ้อนจากการตั้งครรภ์ ยกเว้นมะเร็งเนื้อรก (Choriocarcinoma)
    en: null
  - th: โรคเอดส์ หรือกามโรค หรือโรคติดต่อทางเพศสัมพันธ์
    en: null
waiting_period_days: 30

premium_source:
  url: https://www.thaihealth.co.th/simply-healthy/
  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    ตารางเบี้ยอยู่ใน HTML ของหน้าผลิตภัณฑ์เอง ไม่ใช่ PDF จึงตรวจซ้ำได้ด้วย view-source
    หัวตารางระบุ "IPD ผู้ป่วยใน เบี้ยประกันภัยรายปี รวมอากรแสตมป์ / ตารางเบี้ยประกันสุขภาพ
    เริ่ม 1 ม.ค. 2568" และกำกับว่า "เบี้ยประกันภัยมาตรฐานสำหรับแต่ละช่วงอายุ
    สำหรับปีกรมธรรม์แรกเท่านั้น" ตัวเลขจึงเป็นเบี้ยปีแรก ไม่ใช่เบี้ยที่ตรึงตลอดสัญญา
    บริษัทประกาศเหตุผลการปรับเบี้ยครั้งนี้ไว้ที่ https://www.thaihealth.co.th/change-premium-th/
    ว่า "ไม่ได้ทำการปรับเพิ่มเบี้ยประกันภัยสุขภาพรายบุคคล มาตั้งแต่ปี พ.ศ. 2552 นับเป็นเวลา
    กว่า 15 ปี ... จะทำการปรับเบี้ยประกันภัยเพิ่มขึ้นประมาณ 100% สำหรับผู้เอาประกันภัย
    ที่มีช่วงอายุระหว่าง 1-10 ปี และประมาณ 38% สำหรับทุกช่วงอายุอื่นๆ" และคาดว่า
    "จะสามารถคงราคาเบี้ยประกันภัยที่ปรับขึ้นครั้งนี้ไปอย่างน้อยอีก 3 ปีข้างหน้า"
    ต้องซื้อ IPD ก่อนเสมอ บริษัทระบุว่า "หากมีความประสงค์ซื้อ OPD จะต้องซื้อพร้อมกับ
    ความคุ้มครองของ IPD ด้วยทุกครั้ง ... โดยเบี้ยประกันภัยสุขภาพ รับชำระเป็นรายปีเท่านั้น"
terms_source:
  url: https://www.thaihealth.co.th/wp-content/uploads/2021/01/simplyhealthy_20171116.pdf
  tier: filed_wording
  verified_on: 2026-08-10
  note: >-
    ตัวบทกรมธรรม์ที่บริษัทเผยแพร่เอง ข้อ 6.1 "กรมธรรม์ประกันภัยนี้อาจต่ออายุต่อเนื่องได้
    จนถึงรอบปีกรมธรรม์ประกันภัยและผู้เอาประกันภัยมีอายุไม่เกิน 80 ปี โดยไม่ต้องแสดงหลักฐาน"
    และข้อ 6.3 "บริษัทอาจปฏิเสธการต่ออายุกรมธรรม์ประกันภัยได้ โดยการแจ้งต่อผู้เอาประกันภัย
    ทราบเป็นลายลักษณ์อักษรล่วงหน้าอย่างน้อย 30 วัน"
    ข้อควรระวังที่ต้องบอกผู้อ่าน: หน้าผลิตภัณฑ์ของบริษัทเองเขียนว่า "สมัครทำประกันภัยปีแรกได้
    ตั้งแต่อายุ 15 วัน ถึง 70 ปีบริบูรณ์ ต่ออายุได้ถึง 85 ปีบริบูรณ์" ซึ่งขัดกับตัวบทกรมธรรม์
    ที่เขียนว่า 80 ปี เราบันทึกตัวเลขของกรมธรรม์ เพราะกรมธรรม์คือสิ่งที่ผูกพันตามกฎหมาย
    ไฟล์กรมธรรม์ลงวันที่ 2017-11-16 ในชื่อไฟล์ของตัวเอง ซึ่งเก่ากว่ามาตรฐานประกันสุขภาพ
    แบบใหม่ปี 2564 ที่ตารางผลประโยชน์ปัจจุบันใช้อยู่ บริษัทไม่เผยแพร่กรมธรรม์ฉบับใหม่กว่านี้
    นิยาม Per Confinement และระยะเวลาที่ไม่คุ้มครอง 30 วัน / 120 วัน (เนื้องอก ถุงน้ำ มะเร็ง
    ริดสีดวงทวาร ไส้เลื่อน ต้อเนื้อ ต้อกระจก ตัดทอนซิล นิ่ว เส้นเลือดขอดที่ขา
    เยื่อบุโพรงมดลูกเจริญผิดที่) มาจากเอกสารสรุปสาระสำคัญที่บริษัทเผยแพร่คู่กัน
    https://www.thaihealth.co.th/files/summary_healthy.pdf โดยอุบัติเหตุและการผ่าตัดฉุกเฉิน
    ไม่ต้องรอคอย บริษัทไม่เคยเขียนคำว่า "มาตรฐานประกันสุขภาพแบบใหม่" ที่ใดเลย แต่ตาราง
    ผลประโยชน์ใช้โครงสร้าง 13 หมวดตามมาตรฐานใหม่ครบถ้วน จึงบันทึก new_health_standard เป็นจริง

verified_on: 2026-08-10

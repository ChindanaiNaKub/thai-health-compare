# ตารางเบี้ยของ Wealthy Healthy หยุดที่ช่วง 76-80 ปี ไม่มีช่วง 81-85 เหมือน Simply Healthy
# และตัวบทกรมธรรม์ที่บริษัทเผยแพร่ก็เขียนว่าต่ออายุได้ถึง 80 ปี เราจึงบันทึก 80
# ไม่ใช่ 85 ตามที่หน้าขายเขียน (ดู terms_source.note)
renewal_ceiling_age: 80

# 390,000 บาท คือ "ผลประโยชน์กรณีผู้ป่วยใน" ของแผน WH3000 คิดต่อการเข้าพักรักษาตัว
# เป็นผู้ป่วยในครั้งใดครั้งหนึ่ง (Per Confinement) ส่วนที่เกินจากนี้เข้าชั้น
# "ค่ารักษาที่มีค่าใช้จ่ายสูง" ซึ่งจ่าย 90% ของส่วนเกิน ไม่มีความรับผิดส่วนแรก
# บริษัทไม่ประกาศเพดานรวมของชั้นนี้เป็นตัวเลข เราจึงไม่บันทึกตัวเลขรวมที่เดาเอา
ipd_annual_limit_thb: 390000
ipd_limit_basis: per_confinement
opd_annual_limit_thb: null
room_board_thb_per_night: 3000
deductible_thb: 0
copay_percent: 0
copay_on_renewal: >-
  ไม่มีเงื่อนไขค่าใช้จ่ายร่วม (Copayment) ในเอกสารที่บริษัทเผยแพร่ แต่มีกลไกที่ให้ผล
  ทางกระเป๋าเงินคล้ายกัน คือหน้าผลิตภัณฑ์ระบุว่าเบี้ยปีต่ออายุ "อาจถูกปรับขึ้นตามประวัติ
  การรับประกันของปีกรมธรรม์ก่อนหน้า สูงสุดไม่เกิน 100 เปอร์เซ็นต์ของเบี้ยประกันมาตรฐาน"
  และมี "ส่วนลดพิเศษ 10 เปอร์เซ็นต์ในปีต่ออายุ กรณีที่ไม่มีการเรียกร้องสินไหม"
  ตารางเบี้ยข้างต้นจึงเป็นราคาพื้นสำหรับคนที่ไม่เคลม ยอดรวมตลอดสัญญาที่คำนวณจากตารางนี้
  เป็นกรณีดีที่สุด และบริษัทสงวนสิทธิ์ไม่ต่ออายุรายบุคคลได้ภายใน 2 ปีแรก

exclusions:
  - th: โรคเรื้อรัง การบาดเจ็บ หรือการป่วย (รวมถึงภาวะแทรกซ้อน) ที่ยังมิได้รักษาให้หายก่อนวันที่กรมธรรม์ประกันภัยนี้เริ่มมีผลบังคับเป็นครั้งแรก เว้นแต่ไม่ปรากฏอาการ ไม่ได้รับการตรวจรักษาหรือวินิจฉัยโดยแพทย์ ในระยะเวลาห้าปี (5 ปี) ก่อนวันที่กรมธรรม์เริ่มมีผลบังคับเป็นครั้งแรก และในช่วงระยะเวลาสามปี (3 ปี) ตั้งแต่วันที่กรมธรรม์เริ่มมีผลบังคับเป็นครั้งแรก
    en: null
  - th: ภาวะที่เป็นผลจากความผิดปกติที่เกิดขึ้นแต่กำเนิด เว้นแต่กรมธรรม์มีผลคุ้มครองมาไม่น้อยกว่าหนึ่งปี (1 ปี) และปรากฏอาการหลังผู้เอาประกันภัยมีอายุครบสิบหกปีบริบูรณ์
    en: null
  - th: การตรวจรักษาหรือการผ่าตัดเพื่อเสริมสวย
    en: null
  - th: การตั้งครรภ์ การคลอดบุตร และภาวะแทรกซ้อนจากการตั้งครรภ์ ยกเว้นมะเร็งเนื้อรก (Choriocarcinoma)
    en: null
  - th: โรคเอดส์ หรือกามโรค หรือโรคติดต่อทางเพศสัมพันธ์
    en: null
waiting_period_days: 30


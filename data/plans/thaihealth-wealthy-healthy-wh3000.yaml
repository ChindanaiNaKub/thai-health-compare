    และกำกับว่าเป็นเบี้ยมาตรฐานปีกรมธรรม์แรกเท่านั้น เบี้ยจะปรับตามอายุที่เพิ่มขึ้น
    เหตุผลการปรับเบี้ยรอบนี้บริษัทประกาศไว้ที่ https://www.thaihealth.co.th/change-premium-th/
    ("ปรับเพิ่มขึ้นประมาณ 100% สำหรับช่วงอายุ 1-10 ปี และประมาณ 38% สำหรับทุกช่วงอายุอื่นๆ")
    ถ้าต้องการความคุ้มครองผู้ป่วยนอกต้องซื้อเป็นตารางเบี้ยแยกอีกชุด และซื้อเดี่ยวไม่ได้
terms_source:
  url: https://www.thaihealth.co.th/files/summary_healthy.pdf
  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    เอกสารสรุปสาระสำคัญที่บริษัทเผยแพร่เอง ให้นิยาม "การเข้าพักรักษาตัวเป็นผู้ป่วยใน
    ครั้งใดครั้งหนึ่ง (Per Confinement)" ว่านับรวมการเข้าพักด้วยเหตุจากการบาดเจ็บหรือ
    การป่วยเดียวกันที่ยังรักษาไม่หาย รวมภาวะแทรกซ้อนต่อเนื่อง ภายใน 90 วันนับแต่วันที่
    ออกจากโรงพยาบาลครั้งสุดท้าย และกำหนดระยะเวลาที่ไม่คุ้มครอง 30 วันสำหรับการป่วยใดๆ
    กับ 120 วันสำหรับ 8 กลุ่มโรค (เนื้องอก ถุงน้ำ มะเร็ง ริดสีดวงทวาร ไส้เลื่อน
    ต้อเนื้อ ต้อกระจก ตัดทอนซิลหรืออดีนอยด์ นิ่ว เส้นเลือดขอดที่ขา เยื่อบุโพรงมดลูก
    เจริญผิดที่) โดยอุบัติเหตุและการผ่าตัดฉุกเฉินไม่ต้องรอคอย
    เอกสารนี้กำกับตัวเองว่า "เป็นการสรุปสาระสำคัญ เงื่อนไขความคุ้มครอง ข้อยกเว้น
    บางส่วนเท่านั้น" รายการข้อยกเว้นข้างต้นจึงไม่ครบ
    ข้อควรระวังเรื่องอายุต่ออายุ: หน้าผลิตภัณฑ์เขียนว่าต่ออายุได้ถึง 85 ปี แต่ตัวบท
    กรมธรรม์ที่บริษัทเผยแพร่ (https://www.thaihealth.co.th/wp-content/uploads/2021/01/simplyhealthy_20171116.pdf
    ข้อ 6.1) เขียนว่า "อายุไม่เกิน 80 ปี" และตารางเบี้ยของ Wealthy Healthy เองก็หยุดที่ 80
    เราจึงบันทึก 80 บริษัทยังสงวนสิทธิ์ปฏิเสธการต่ออายุได้ โดยแจ้งล่วงหน้าอย่างน้อย 30 วัน
    ชั้นค่ารักษาที่มีค่าใช้จ่ายสูงของแผนนี้ ตารางผลประโยชน์เขียนว่า "(จ่ายร้อยละ 90 ของ
    ค่าใช้จ่ายส่วนเกินผลประโยชน์กรณีผู้ป่วยใน)" ซึ่งแปลว่าผู้เอาประกันภัยรับเอง 10%
    ของส่วนเกินโดยไม่มีเพดาน บริษัทไม่ประกาศเพดานรวมของชั้นนี้


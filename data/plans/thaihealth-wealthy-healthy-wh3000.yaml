  en: Thai Health Insurance PCL
name:
  th: Wealthy Healthy — แผน WH3000 (ผู้ป่วยใน + ค่ารักษาที่มีค่าใช้จ่ายสูง)
  en: Wealthy Healthy — plan WH3000 (IPD plus major medical)

type: standalone
host_policy: null

shape: per_item_schedule
new_health_standard: true


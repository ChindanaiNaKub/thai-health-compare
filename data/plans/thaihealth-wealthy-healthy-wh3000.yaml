# ไทยประกันสุขภาพ Wealthy Healthy แผน WH3000 (ค่าห้อง 3,000 บาท/วัน)
# ตารางผลประโยชน์ผู้ป่วยในเหมือน Simply Healthy ทุกประการ ต่างกันตรงที่ Wealthy
# เพิ่มชั้น "ค่ารักษาที่มีค่าใช้จ่ายสูง" จ่าย 90% ของส่วนที่เกินวงเงินผู้ป่วยใน
id: thaihealth-wealthy-healthy-wh3000
insurer:

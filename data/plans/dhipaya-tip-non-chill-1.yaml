# ทิพยประกันภัย — TIP นอนชิล 1 แผนถูกที่สุดที่พบในการเก็บข้อมูลรอบนี้ (4,240 บาท/ปี)
# ซื้อเดี่ยวได้ ไม่ต้องมีสัญญาประกันชีวิตหลัก
#
# แผนนี้เคยถูกตัดออกจากรายการ เพราะสคีมาบังคับให้ต้องมี "ต่ออายุถึงอายุ" เป็นตัวเลข
# แต่ทิพยไม่ประกาศอายุต่ออายุสูงสุดของสินค้าตัวนี้เลย การเดาว่า 65 หรือ 70
# คือการแต่งตัวเลข ส่วนการตัดออกเงียบ ๆ ทำให้เว็บนี้กลายเป็นรายการเฉพาะบริษัท
# ที่บังเอิญประกาศตัวเลขครบ จึงบันทึกเป็น null พร้อมเหตุผลแทน
id: dhipaya-tip-non-chill-1
insurer:
  th: ทิพยประกันภัย
  en: Dhipaya Insurance
name:
  th: TIP ชิลชิล — แผน TIP นอนชิล 1
  en: TIP Chill Chill — Non Chill 1

type: standalone
host_policy: null

shape: per_item_schedule
new_health_standard: false

# ตารางเบี้ยเต็มทุกช่วงอายุที่ทิพยประกาศเอง เบี้ยเท่ากันทั้งชายและหญิง
# (ค่าที่เครื่องคำนวณของทิพยคืนมาตรงกันทุกตัวอักษรทั้งสองเพศ)
premium:
  - { age_from: 15, age_to: 30, thb_per_year: 4240, sex: any }
  - { age_from: 31, age_to: 40, thb_per_year: 4900, sex: any }
  - { age_from: 41, age_to: 50, thb_per_year: 5495, sex: any }
  - { age_from: 51, age_to: 60, thb_per_year: 7230, sex: any }
premium_unknown_reason: null

entry_age_min: 15
entry_age_max: 60

# ทิพยประกาศเฉพาะอายุรับประกัน 15-60 ปี ไม่มีวงเล็บ "(ต่ออายุถึง N ปี)"
# แบบที่สินค้าพี่น้องกัน (TIP Insure ยันต์) มี การละไว้จึงเป็นการเลือกของหน้าเว็บเอง
renewal_ceiling_age: null
renewal_ceiling_unknown_reason: >-
  ทิพยไม่ประกาศอายุสูงสุดที่ต่ออายุได้สำหรับแผนนี้ ไม่ว่าในหน้าสินค้า หน้าคำถามที่พบบ่อย
  หรือเอกสารใด ๆ ที่เผยแพร่ต่อสาธารณะ และไม่มีกรมธรรม์หรือสรุปสาระสำคัญให้ตรวจสอบ
  ตัวเลขเดียวที่ยืนยันได้คือเครื่องคำนวณเบี้ยของทิพยเองหยุดคืนราคาที่อายุเกิน 60 ปี
  ซึ่งบอกได้แค่ว่าหยุด "ขาย" ที่อายุ 60 ไม่ได้บอกว่าต่ออายุได้ถึงอายุเท่าไร
  เว็บนี้จึงไม่คำนวณยอดรวมตลอดสัญญาให้ และไม่เดาตัวเลขแทนบริษัท

# 100,000 คือวงเงินต่อรอบปีกรมธรรม์ ส่วน 25,000 คือวงเงินต่อการพักรักษา
# (ต่อครั้ง/ต่อโรค) ซึ่งเป็นเพดานที่กัดจริงในเคลมส่วนใหญ่
ipd_annual_limit_thb: 100000
ipd_limit_basis: per_policy_year
opd_annual_limit_thb: 0
room_board_thb_per_night: 3000
deductible_thb: 0
copay_percent: 0
copay_on_renewal: >-
  ทิพยไม่ประกาศเงื่อนไขค่าใช้จ่ายร่วมในปีต่ออายุ (ไม่ใช่ประกันสุขภาพมาตรฐานใหม่ของ คปภ.
  ที่มีกติกา copay 30/50%) สิ่งที่ทิพยประกาศคือ "การปรับเบี้ยประกันภัยในปีต่ออายุ
  จะพิจารณาจากอายุผู้เอาประกันภัย และประวัติการเคลม" ซึ่งไม่ใช่การรับประกันการต่ออายุ

# ทิพยไม่เผยแพร่กรมธรรม์หรือสรุปสาระสำคัญของสินค้าตัวนี้ จึงไม่มีชุดข้อยกเว้นให้บันทึก
# ห้ามอ่านรายการว่างนี้ว่า "ไม่มีข้อยกเว้น"
exclusions: []
waiting_period_days: null

premium_source:

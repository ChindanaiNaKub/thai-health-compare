  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    ตารางเบี้ยเต็ม 4 ช่วงอายุจาก packageData JSON ของเครื่องคำนวณเบี้ยของทิพยเอง
    (4,240 / 4,900 / 5,495 / 7,230 บาทต่อปี) สอบทานที่ปีเกิด 1996 และ 1970 ทั้งสองเพศ
    ได้ตารางผลประโยชน์ชุดเดียวกัน แปลว่าความคุ้มครองคงที่ทุกช่วงอายุ ต่างจาก TIP Insure ยันต์
    เครื่องคำนวณไม่คืนแผนใด ๆ สำหรับปีเกิด 1965, 1964, 1960 และ 1955 ตารางจึงจบที่อายุ 60
terms_source:
  url: https://ft.tipinsure.com/Health/index
  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    "คุ้มครองผู้เอาประกันภัยรายใหม่ ซึ่งมีอายุระหว่าง 15 – 60 ปี" และตารางผลประโยชน์
    "ความคุ้มครองสูงสุดต่อปี = 100,000 · ความคุ้มครองสูงสุดต่อการพักรักษา (ต่อครั้ง/ต่อโรค)
    = 25,000 · ค่าห้อง (ต่อวัน/สูงสุด 365 วันต่อปี) = 3,000 · ผู้ป่วยนอก = ไม่คุ้มครอง"
    จากหน้าสินค้าของทิพยเอง ไม่ใช่ตัวบทกรมธรรม์ เพราะทิพยไม่เผยแพร่กรมธรรม์ของสินค้านี้


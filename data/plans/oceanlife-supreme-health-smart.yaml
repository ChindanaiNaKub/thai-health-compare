# ไทยสมุทร โอเชี่ยนไลฟ์ ซูพรีม เฮลท์ — แผน Smart (ค่าห้อง 6,000 บาท/วัน)
# แผนวงเงินใหญ่ คิดต่อรอบปีกรมธรรม์ ไม่ใช่ต่อการเข้าพักรักษาครั้งใดครั้งหนึ่ง
# ข้อจำกัดใหญ่ที่สุด: บริษัทประกาศเบี้ยแค่ 4 อายุ และไม่ประกาศราคาสัญญาหลักเลย
id: oceanlife-supreme-health-smart
insurer:
  th: ไทยสมุทรประกันชีวิต
  en: Ocean Life Insurance PCL
name:
  th: โอเชี่ยนไลฟ์ ซูพรีม เฮลท์ — แผน Smart (ความคุ้มครองในประเทศไทย)
  en: Ocean Life Supreme Health — Smart plan (Thailand territory)

type: rider
host_policy:
  name:
    th: บริษัทไม่ระบุชื่อแบบประกันภัยหลัก
    en: Insurer does not name the required main policy
  min_sum_insured_thb: null
  premium: null
  premium_unknown_reason: >-
    ไทยสมุทรไม่เผยแพร่ราคาสัญญาหลักของแผนนี้ และไม่เผยแพร่รายชื่อแบบประกันภัยหลัก
    ที่แนบสัญญาเพิ่มเติมนี้ได้ ทั้งที่โบรชัวร์เขียนเองว่างวดการชำระเบี้ยของสัญญาเพิ่มเติมนี้
    "ต้องสอดคล้องกับงวดการชำระเบี้ยประกันภัยของกรมธรรม์หลัก" แปลว่าต้องมีสัญญาหลักแน่นอน
    เงินที่ต้องจ่ายจริงต่อปีจึงสูงกว่าตัวเลขในตารางนี้เสมอ
    น่าสังเกตว่าบริษัทเดียวกันนี้ประกาศราคาสัญญาหลักครบทุกอายุสำหรับโครงการโอชิ สมอล เฮลท์
    ที่ขายออนไลน์ แต่ไม่ประกาศสำหรับแผนนี้ที่ขายผ่านตัวแทน
  source:
    url: https://www.ocean.co.th/our-products/health-insurance/supreme-health/download/brochure
    tier: official_insurer
    verified_on: 2026-08-10
    note: >-
      โบรชัวร์รหัสเอกสาร PST-P07-0119 (01/05/2569) อ้างถึงกรมธรรม์หลักอยู่บรรทัดเดียว
      คือ "ต้องสอดคล้องกับงวดการชำระเบี้ยประกันภัยของกรมธรรม์หลัก" ไม่มีรายชื่อแบบประกัน
      ไม่มีทุนขั้นต่ำ ไม่มีเบี้ยขั้นต่ำ และไม่มีตัวอย่างราคาที่ใดบนเว็บของบริษัท
      ตรวจหน้าดาวน์โหลดเอกสารของบริษัทเมื่อ 2026-08-10 พบเฉพาะแบบฟอร์มเคลมและแบบฟอร์มบริการ

shape: lump_sum
new_health_standard: true

# บริษัทประกาศเบี้ยแค่สี่อายุ คือ 20 30 40 และ 50 ปี ไม่ใช่ตารางช่วงอายุ
# เราบันทึกเฉพาะสี่จุดที่มีเอกสารจริง อายุอื่นจึงแสดงว่าไม่มีข้อมูล
# และโบรชัวร์เขียนเองว่า "ข้อมูลเบี้ยประกันภัย สามารถสอบถามเพิ่มเติมได้จากที่ปรึกษาประกันชีวิต"
# อัตราเดียวกันทั้งชายและหญิง ทั้งโบรชัวร์ไม่มีการแยกเพศ
premium:
  - { age_from: 20, age_to: 20, thb_per_year: 11681 }
  - { age_from: 30, age_to: 30, thb_per_year: 16967 }
  - { age_from: 40, age_to: 40, thb_per_year: 23174 }
  - { age_from: 50, age_to: 50, thb_per_year: 36311 }

entry_age_min: 11
entry_age_max: 80
renewal_ceiling_age: 99

# 5,000,000 บาท คิดต่อรอบปีกรมธรรม์ ได้วงเงินใหม่ทุกปี
# ต่างจากเอไอเอ นวกิจ ไทยประกันสุขภาพ และแปซิฟิค ครอส ที่คิดต่อการเข้าพักรักษาแต่ละครั้ง
ipd_annual_limit_thb: 5000000
ipd_limit_basis: per_policy_year
opd_annual_limit_thb: null
# 6,000 บาทต่อวัน จำกัดไม่เกิน 365 วัน
room_board_thb_per_night: 6000
deductible_thb: 0
copay_percent: 0
copay_on_renewal: >-
  ปีแรกไม่มีค่าใช้จ่ายร่วม ส่วนปีต่ออายุ ไทยสมุทรเขียนไว้แค่ว่าอาจมี ไม่ได้บอกว่าเท่าไร
  ข้อความเต็มคือ "สำหรับปีต่ออายุ อาจมีการเปลี่ยนแปลงเบี้ยประกันภัย หรือให้ผู้เอาประกันภัย
  มีค่าใช้จ่ายร่วม (Copayment) ขึ้นอยู่กับอายุ ชั้นอาชีพ ค่าใช้จ่ายในการรักษาพยาบาลที่สูงขึ้น
  หรือจากประสบการณ์การจ่ายค่าสินไหมทดแทน ตามเงื่อนไข และหลักเกณฑ์ของบริษัท"
  ไม่มีเปอร์เซ็นต์ ไม่มีเกณฑ์จำนวนครั้ง ไม่มีเกณฑ์อัตราการเคลม
  ต่างจากโครงการโอชิ สมอล เฮลท์ ของบริษัทเดียวกัน ที่ประกาศครบทั้ง 30% 50% และเงื่อนไข
  ทั้งสองข้อในตัวบทสัญญา ผู้ซื้อแผนนี้จึงไม่มีทางรู้ล่วงหน้าว่าจะโดนร่วมจ่ายเมื่อไรและเท่าไร

# บริษัทไม่เผยแพร่ตัวบทกรมธรรม์ของแผนนี้ และโบรชัวร์ไม่มีรายการข้อยกเว้นแบบครบถ้วน
exclusions: []
waiting_period_days: 30

premium_source:
  url: https://www.ocean.co.th/our-products/health-insurance/supreme-health/download/brochure
  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    โบรชัวร์ให้เบี้ยแค่สี่อายุ คือ 20 30 40 และ 50 ปี แล้วบอกให้ไปถามตัวแทน
    ยอดรวมตลอดสัญญาที่เว็บนี้คำนวณให้จึงเป็นช่องว่างเกือบทั้งแถว และนั่นคือสภาพ
    ของข้อมูลที่บริษัทเปิดเผย ไม่ใช่ข้อมูลที่เราหาไม่เจอ
    แผนนี้มีห้าระดับ Smart ถึง Platinum วงเงินต่อรอบปี 5 ล้าน 10 ล้าน 30 ล้าน 80 ล้าน
    และ 100 ล้านบาท ค่าห้อง 6,000 8,000 10,000 15,000 และ 25,000 บาทต่อวันตามลำดับ
    เราบันทึกเฉพาะ Smart ระดับล่างสุดและเทียบกับแผนอื่นในตารางนี้ได้ตรงที่สุด
    แผน Platinum ยังมีให้เลือกเขตความคุ้มครองสามแบบ คือในประเทศไทย เอเชีย และทั่วโลก
    ราคาที่อายุ 20 ปีคือ 79,535 / 86,670 / 93,708 บาทต่อปีตามลำดับ
    ตัวเลขทั้งหมดข้างต้นเป็นเบี้ยสัญญาเพิ่มเติมอย่างเดียว ยังไม่รวมสัญญาหลักที่บังคับซื้อ
terms_source:
  url: https://www.ocean.co.th/our-products/health-insurance/supreme-health
  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    ไทยสมุทรไม่เผยแพร่ตัวบทกรมธรรม์ของแผนนี้ มีแต่โบรชัวร์
    ต่างจากโครงการโอชิ สมอล เฮลท์ ที่ขายออนไลน์และเผยแพร่ตัวบทเต็ม 20 หน้า
    ตรวจหน้าดาวน์โหลดเอกสารของบริษัทเมื่อ 2026-08-10 พบเฉพาะแบบฟอร์มเคลม
    และแบบฟอร์มขอเปลี่ยนแปลงกรมธรรม์ ไม่มีตัวบทของสัญญาเพิ่มเติมทั้งสองฉบับที่ขายผ่านตัวแทน
    ระเบียนนี้จึงใช้ tier เป็น official_insurer ไม่ใช่ filed_wording และช่องข้อยกเว้นเว้นว่าง
    ระยะเวลาที่ไม่คุ้มครองมีสามชั้น ไม่ใช่สองชั้นแบบปกติ คือ 30 วันสำหรับการป่วยทั่วไป
    120 วันสำหรับแปดกลุ่มโรคมาตรฐาน และ 360 วันสำหรับค่าตรวจสุขภาพประจำปี
    โบรชัวร์เขียนว่า "เมื่อพ้น 360 วัน นับจากวันเริ่มมีผลคุ้มครอง คุ้มครองค่าตรวจสุขภาพประจำปี"
    ชั้น 360 วันนี้ไม่พบในบริษัทอื่นในชุดข้อมูลนี้
    เรื่องฐานการคิดวงเงิน หมวดผลประโยชน์หลักคิดต่อรอบปีกรมธรรม์ แต่โบรชัวร์ยังนิยาม
    "ต่อการเข้าพักรักษาครั้งใดครั้งหนึ่ง" ไว้ด้วย เพราะหมวดย่อย 2.4 ใช้ฐานนั้น
    อ่านตัวเลขวงเงินรวมเป็นแบบต่อปีได้ แต่หมวดย่อยบางหมวดไม่ใช่

verified_on: 2026-08-10

# 60 ล้านบาทคือ "ผลประโยชน์สูงสุดต่อรอบปีกรมธรรม์"
# แต่ค่าห้องคิดคนละฐาน คือ "หมวดที่ 1 ... ต่อการเข้าพักรักษาตัวเป็นผู้ป่วยในครั้งใดครั้งหนึ่ง"
ipd_annual_limit_thb: 60000000
ipd_limit_basis: per_policy_year
opd_annual_limit_thb: null
room_board_thb_per_night: 15000
deductible_thb: 0
copay_percent: 0
copay_on_renewal: >-
  ปีแรกไม่มีค่าใช้จ่ายร่วม เงื่อนไขที่บริษัทประกาศบนหน้าผลิตภัณฑ์นี้เอง
  กรณีที่ 1 ร่วมจ่ายอัตราร้อยละ 30 ของค่าใช้จ่ายที่ได้รับความคุ้มครอง กรณีผู้เอาประกันภัย
  มีการเรียกร้องผลประโยชน์จากการป่วยเล็กน้อยทั่วไป (Simple Diseases) และเข้าพักรักษาตัว
  ในโรงพยาบาล ในรอบปีกรมธรรม์ประกันภัยตั้งแต่ 3 ครั้งขึ้นไป และมีอัตราการเรียกร้อง
  ค่าสินไหมทดแทนตั้งแต่ร้อยละ 200 กรณีที่ 2 เงื่อนไขเดียวกันแต่อัตราการเรียกร้อง
  ตั้งแต่ร้อยละ 400 โดยไม่รวมค่าสินไหมทดแทนจากค่ารักษาโรคร้ายแรง
  กรณีที่ 3 เข้าเงื่อนไขทั้งสองกรณี บริษัทจะกำหนดให้มีค่าใช้จ่ายร่วมร้อยละ 50
  บริษัทต้องแจ้งล่วงหน้าไม่น้อยกว่า 15 วัน และมีเงื่อนไขยกเลิกค่าใช้จ่ายร่วมคืนได้
  รายละเอียดกลางอยู่ที่ https://www.thailife.com/COPAYMENT


# ทิพยประกันภัย — TIP Insure ยันต์ แผนเบี้ย 8,888 บาท/ปี สำหรับผู้สมัครอายุ 15-40 ปี
# ซื้อเดี่ยวได้จริง ไม่ต้องมีสัญญาประกันชีวิตหลัก (บริษัทประกันวินาศภัย ขายออนไลน์ที่ TIPINSURE)
# เบี้ยคงที่ 8,888 บาท/ปีทุกช่วงอายุ แต่ "วงเงินความคุ้มครองลดลงตามช่วงอายุที่สมัคร"
# จึงต้องแยกบันทึกเป็นรายช่วงอายุ ไฟล์นี้คือช่วง 15-40 ปีเท่านั้น
id: dhipaya-tip-insure-yant-basic-15-40
insurer:
  th: ทิพยประกันภัย
  en: Dhipaya Insurance
name:
  th: TIP Insure ยันต์ — เบี้ย 8,888 บาท/ปี (สมัครอายุ 15-40 ปี)
  en: TIP Insure Yant — 8,888 THB/yr tier (entry age 15-40)

type: standalone
host_policy: null

shape: per_item_schedule
new_health_standard: false

# เบี้ยคงที่ทุกช่วงอายุตามที่ทิพยประกาศ ("เบี้ยราคาเดียวทุกช่วงอายุ")
# ตรวจสอบจากเครื่องคำนวณเบี้ยของทิพยเองที่ปีเกิด 2011 / 1996 / 1985 / 1970 / 1960
# ได้ 8,888.00 บาททุกครั้ง ทั้งเพศชายและหญิง
premium:
  - { age_from: 15, age_to: 70, thb_per_year: 8888, sex: any }

entry_age_min: 15
entry_age_max: 40
renewal_ceiling_age: 80

# "สูงสุดต่อปี 450,000" คือวงเงินต่อรอบปีกรมธรรม์ ส่วน 90,000 คือวงเงิน
# "ต่อโรคหรือต่ออุบัติเหตุแต่ละครั้ง" ซึ่งเป็นเพดานที่กัดจริงในเคลมส่วนใหญ่
ipd_annual_limit_thb: 450000
ipd_limit_basis: per_policy_year
opd_annual_limit_thb: 0
room_board_thb_per_night: 4500
deductible_thb: 0
copay_percent: 0
copay_on_renewal: >-
  ทิพยไม่ประกาศเงื่อนไขค่าใช้จ่ายร่วมในปีต่ออายุ (ไม่ใช่ประกันสุขภาพมาตรฐานใหม่ของ คปภ.
  ที่มีกติกา copay 30/50%) สิ่งที่ทิพยประกาศคือ "บริษัทฯ สงวนสิทธิ์ในการปรับเบี้ยประกันภัย
  แผนประกันภัยในปีต่ออายุ โดยการพิจารณาจากอายุผู้เอาประกันภัย และประวัติการเรียกร้องสินไหมทดแทน"
  แปลว่าต่ออายุได้ถึงอายุ 80 ปีตามที่ประกาศ แต่ทั้งเบี้ยและ "แผนประกันภัย" ปรับได้ตามประวัติเคลม
  ไม่ใช่การต่ออายุแบบการันตี

exclusions:
  - th: การบาดเจ็บ/เจ็บป่วย/โรคเรื้อรัง ที่เป็นมาก่อนการทำประกันภัย และยังรักษาไม่หายก่อนกรมธรรม์ประกันภัยมีผลบังคับครั้งแรก และการรักษาที่ไม่ใช่ความจำเป็นทางการแพทย์
    en: null
  - th: การเจ็บป่วยใดๆ ที่เกิดขึ้นในระยะเวลา 30 วัน (Waiting Period) หลังจากที่กรมธรรม์ประกันภัยมีผลบังคับครั้งแรก
    en: null
  - th: การเจ็บป่วยดังต่อไปนี้ เนื้องอก ถุงน้ำดี หรือมะเร็งทุกชนิด ริดสีดวงทวาร ไส้เลื่อนทุกชนิด ต้อเนื้อหรือต้อกระจก การตัดทอลซิลหรืออดีนอยด์ นิ่วทุกชนิด เส้นเลือดขอดที่ขา เยื่อบุโพรงมดลูกเจริญผิดที่ ที่เกิดขึ้นภายในระยะเวลา 120 วัน (Waiting Period) หลังจากที่กรมธรรม์ประกันภัยมีผลบังคับครั้งแรก
    en: null
waiting_period_days: 30

premium_source:
  url: https://ft.tipinsure.com/HealthTalisman/index
  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    8,888 บาทต่อปี จากเครื่องคำนวณเบี้ยของทิพยประกันภัยเอง (ft.tipinsure.com/HealthTalisman)
    ซึ่งคืนค่า total_premium = 8888.00 สำหรับทุกช่วงอายุ 15-40, 41-50, 51-60 และ 61-70 ปี
    และเท่ากันทั้งเพศชายและหญิง ตรงกับข้อความบนหน้าเว็บว่า "เบี้ยราคาเดียวทุกช่วงอายุ"
    ทิพยไม่ได้เผยแพร่ตารางเบี้ยเป็นเอกสาร PDF — ตัวเลขนี้มาจากระบบขายออนไลน์ของทิพยเอง
terms_source:
  url: https://ft.tipinsure.com/HealthTalisman/index
  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    "คุ้มครองผู้เอาประกันภัยรายใหม่ อายุ 15 - 70 ปี ... (ต่ออายุถึง 80ปี)" และตารางความคุ้มครอง
    ของช่วงอายุ 15-40 ปี ระบุ สูงสุดต่อปี 450,000 / ต่อโรคหรือต่ออุบัติเหตุแต่ละครั้ง 90,000 /
    ค่าห้องผู้ป่วยปกติ 4,500 / ICU-CCU 9,000 / ค่ารักษาพยาบาลอุบัติเหตุฉุกเฉิน 4,500 /
    ผู้ป่วยนอก "ไม่คุ้มครอง"
    ข้อควรระวัง (1) วงเงินชุดนี้ใช้กับผู้สมัครอายุ 15-40 ปีเท่านั้น ช่วงอายุอื่นได้วงเงินต่ำกว่า
    ที่เบี้ยเท่ากัน (41-50 ได้ 350,000 / 51-60 ได้ 250,000 / 61-70 ได้ 175,000)
    (2) ทิพยไม่เผยแพร่ตัวบทกรมธรรม์ต่อสาธารณะ ข้อยกเว้นที่บันทึกไว้คือชุดที่ทิพยประกาศบนหน้าเว็บ
    ของตนเอง ไม่ใช่รายการข้อยกเว้นทั้งหมดของกรมธรรม์
    (3) หน้าเดียวกันเรียกสินค้านี้ด้วยสามชื่อ คือ TIP Smart Health Care / TIP Deluxe Health Care
    ในข้อความโฆษณา, "TIP Insure ยันต์" ในระบบเสนอราคา และ "ทิพย เอ็กซ์ตร้า แคร์" ในบรรทัดที่อ้างชื่อ
    กรมธรรม์ เรายึดตัวเลขจากระบบเสนอราคาเพราะเป็นสิ่งที่ผู้ซื้อจะได้จริง


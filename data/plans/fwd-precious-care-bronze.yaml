# เอฟดับบลิวดี พรีเชียส แคร์ แพ็กเกจบรอนซ์ (แผนถูกที่สุดใน 6 แพ็กเกจ) แบบไม่มีความรับผิดส่วนแรก
# ไฟล์นี้เป็นกรณีที่หายากในตลาดไทย บริษัทประกาศ "ชื่อสัญญาหลัก" ที่ต้องแนบ
# และ "ทุนประกันภัย" ของสัญญาหลักไว้ในโบรชัวร์เดียวกัน แต่แลกมาด้วยการที่
# เบี้ยที่ประกาศเป็นเบี้ยแพ็กเกจรวม แยกไม่ได้ว่าส่วนไหนคือสัญญาหลัก ส่วนไหนคือสัญญาเพิ่มเติม
id: fwd-precious-care-bronze
insurer:
  th: เอฟดับบลิวดี ประกันชีวิต
  en: FWD Life Insurance (Thailand)
name:
  th: สัญญาเพิ่มเติมการประกันภัยสุขภาพแบบ เอฟดับบลิวดี พรีเชียส แคร์ — แพ็กเกจบรอนซ์
  en: FWD Precious Care health rider — Bronze package

type: rider
host_policy:
  name:
    th: สัญญาหลักแบบประกันตลอดชีพ 99/99 ของเอฟดับบลิวดี (ระบุชื่อไว้ในโบรชัวร์เดียวกัน)
    en: FWD Whole Life 99/99 — named as the host in the same brochure
  min_sum_insured_thb: 60000
  premium: null
  premium_unknown_reason: >-
    เอฟดับบลิวดีประกาศเฉพาะเบี้ย "แพ็กเกจรวม" ของ เอฟดับบลิวดี พรีเชียส โพรเทคชัน
    ซึ่งเป็นชื่อทางการตลาดของแบบตลอดชีพ 99/99 บวกสัญญาเพิ่มเติม พรีเชียส แคร์
    ไม่มีเอกสารใดที่แยกว่าในเบี้ยแพ็กเกจนั้น เป็นเบี้ยสัญญาหลักเท่าไร
    ตัวเลขเบี้ยในฟิลด์ premium ของไฟล์นี้จึงเป็นเบี้ยรวมทั้งสัญญาหลักและสัญญาเพิ่มเติมแล้ว
    ห้ามนำไปบวกซ้ำกับเบี้ยสัญญาหลักอีก สิ่งที่ประกาศชัดคือทุนประกันภัยของสัญญาหลัก 60,000 บาท
    (สังเกตว่าถ้าซื้อตลอดชีพ 99/99 เดี่ยวๆ ทุนขั้นต่ำคือ 300,000 บาท ทุน 60,000 บาทนี้
    เป็นเงื่อนไขเฉพาะของแพ็กเกจ)
  source:
    url: https://www.fwd.co.th/files/v3/assets/blt331c1aa12dcfd37a/blt36c0cfb8786a9cb3/67c00c02938bf55c6ef9b388/TH_Brochure_FWD_Precious_Protection_2025.pdf
    tier: official_insurer
    verified_on: 2026-08-10
    note: >-
      โบรชัวร์หน้า 5 หัวข้อ "2. สัญญาหลักแบบประกันตลอดชีพ 99/99" แถว "ทุนประกันภัย" = 60,000
      และหน้า 10 หมายเหตุ "เอฟดับบลิวดี พรีเชียส โพรเทคชัน เป็นชื่อทางการตลาดของแบบตลอดชีพ 99/99
      และสัญญาเพิ่มเติมการประกันภัยสุขภาพแบบ เอฟดับบลิวดี พรีเชียส แคร์"

shape: lump_sum
new_health_standard: true

# เบี้ยแพ็กเกจรวม (สัญญาหลัก + สัญญาเพิ่มเติม) แบบไม่มีความรับผิดส่วนแรก แพ็กเกจบรอนซ์
# โบรชัวร์หน้า 9 ประกาศเฉพาะอายุ 20, 30, 40, 50 เท่านั้น
premium:
  - { age_from: 20, age_to: 20, thb_per_year: 19398, sex: male }
  - { age_from: 30, age_to: 30, thb_per_year: 20101, sex: male }
  - { age_from: 40, age_to: 40, thb_per_year: 23289, sex: male }
  - { age_from: 50, age_to: 50, thb_per_year: 28507, sex: male }
  - { age_from: 20, age_to: 20, thb_per_year: 19273, sex: female }
  - { age_from: 30, age_to: 30, thb_per_year: 19934, sex: female }
  - { age_from: 40, age_to: 40, thb_per_year: 23052, sex: female }
  - { age_from: 50, age_to: 50, thb_per_year: 28155, sex: female }

entry_age_min: 0
entry_age_max: 75
renewal_ceiling_age: 98

# แพ็กเกจบรอนซ์ วงเงินรวม 1 ล้านบาท "ต่อปีกรมธรรม์" ไม่ใช่ต่อการเข้าพักครั้งใดครั้งหนึ่ง
ipd_annual_limit_thb: 1000000
ipd_limit_basis: per_policy_year
# หมวดผู้ป่วยนอก (หมวด 17-20) แพ็กเกจบรอนซ์ระบุ "-" คือไม่คุ้มครอง มีเฉพาะแซฟไฟร์และไดมอนด์
opd_annual_limit_thb: 0
room_board_thb_per_night: 2500
deductible_thb: 0
copay_percent: 0
copay_on_renewal: >-
  ปีแรกไม่มีค่าใช้จ่ายร่วม โบรชัวร์ระบุว่า "บริษัทฯ ขอสงวนสิทธิ์ในการเปลี่ยนแปลงเงื่อนไข
  ข้อตกลงความคุ้มครอง โดยการเพิ่มเงื่อนไขให้ผู้เอาประกันภัยมีค่าใช้จ่ายร่วม (Copayment)
  ในการต่ออายุสัญญาเพิ่มเติมกรณีครบรอบปีกรมธรรม์ประกันภัย (Renewal)"
  เอกสาร Copayment ของเอฟดับบลิวดีระบุเงื่อนไข 3 กรณี กรณีที่ 1 ป่วยเล็กน้อย
  (Simple Diseases) เข้าพักรักษาตัว >= 3 ครั้งต่อปีกรมธรรม์ และอัตราการเคลม >= 200%
  ของเบี้ยประกันสุขภาพ ร่วมจ่าย 30% ของค่าใช้จ่ายที่ได้รับความคุ้มครองในปีกรมธรรม์ถัดไป
  กรณีที่ 2 การเจ็บป่วยทั่วไป (ไม่รวมโรคร้ายแรง และการผ่าตัดใหญ่) >= 3 ครั้ง และ
  อัตราการเคลม >= 400% ร่วมจ่าย 30% กรณีที่ 3 เข้าเงื่อนไขทั้ง 2 กรณี ร่วมจ่าย 50%
  แยกจากนี้ ในตารางผลประโยชน์ยังมีค่าใช้จ่ายร่วม 20% ติดมากับหมวดค่าตรวจรักษาทางทันตกรรม
  และค่าดูแลรักษาสายตา แต่สองหมวดนี้แพ็กเกจบรอนซ์ไม่คุ้มครองอยู่แล้ว

# โบรชัวร์เขียนเองว่า "ข้อยกเว้นความคุ้มครองมีทั้งหมด 17 ข้อ เช่น" แล้วแสดงเพียง 5 ข้อ
exclusions:
  - th: ภาวะที่เป็นผลจากความผิดปกติที่เกิดขึ้นแต่กําเนิด หรือระบบการสร้างอวัยวะของร่างกายไม่สมบูรณ์แต่กําเนิด หรือโรคทางพันธุกรรมหรือความผิดปกติในการพัฒนาการของร่างกาย เว้นแต่ สัญญาเพิ่มเติมนี้มีผลคุ้มครองมาไม่น้อยกว่าหนึ่งปี และปรากฏอาการหลังผู้เอาประกันภัยมีอายุครบ 16 ปีบริบูรณ์
    en: null
  - th: การตรวจรักษาหรือการผ่าตัดเพื่อเสริมสวย หรือการแก้ไขปัญหาผิวพรรณ สิว ฝ้า กระ รังแค ผมร่วงหรือการควบคุมนํ้าหนักตัว การผ่าตัดที่สามารถทดแทนด้วยการรักษาแนวทางอื่น
    en: null
  - th: การตรวจสุขภาพ การร้องขอเข้าอยู่รักษาตัวในโรงพยาบาล หรือร้องขอการผ่าตัด การพักฟื้น หรือการพักเพื่อการฟื้นฟูหรือการรักษาโดยวิธีให้พักอยู่เฉยๆ การตรวจหรือการรักษาที่ไม่เกี่ยวข้องกับโรคที่เป็นสาเหตุของการรับตัวไว้ในโรงพยาบาล ซึ่งไม่ใช่ความจําเป็นทางการแพทย์ หรือไม่เป็นมาตรฐานทางการแพทย์
    en: null
  - th: การตรวจรักษาที่ยังอยู่ในระหว่างทดลอง การตรวจหรือการรักษาโรคหรืออาการหยุดหายใจขณะหลับ การตรวจหรือการรักษาความผิดปกติของการนอนหลับ การนอนกรน
    en: null
  - th: การฆ่าตัวตาย การพยายามฆ่าตัวตาย การทําร้ายร่างกายตนเอง หรือการพยายามทําร้ายร่างกายตนเอง ทั้งนี้รวมถึงอุบัติเหตุจากการที่ผู้เอาประกันภัย กิน ดื่ม หรือฉีดยาหรือสารมีพิษเข้าร่างกาย การใช้ยาเกินกว่าที่แพทย์สั่ง
    en: null
waiting_period_days: 30


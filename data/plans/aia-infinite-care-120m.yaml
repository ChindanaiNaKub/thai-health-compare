    tier: official_insurer
    verified_on: 2026-08-10
    note: >-
      โบรชัวร์เอไอเอ อิสระ พลัส หน้า 5 ระบุ "เบี้ยประกันภัยหลักเพื่อความคุ้มครอง (RPP)
      ขั้นต่ำ 6,000 บาทต่อปี โดยจะต้องมีเบี้ยประกันภัยหลักเพื่อความคุ้มครองรวมขั้นต่ำ
      12,000 บาทต่อปี" และ "จำนวนเงินเอาประกันภัย...ไม่น้อยกว่า 60,000 บาท"
      ข้อจำกัดที่ต้องรู้ (1) เอไอเอไม่ประกาศรายชื่อสัญญาหลักที่แนบสัญญาเพิ่มเติมนี้ได้
      จึงไม่มีเอกสารยืนยันว่าต้องเป็นแบบนี้ นี่คือแบบที่ถูกที่สุดที่ "ประกาศราคาไว้"
      (2) อิสระ พลัส รับประกันอายุ 15 วัน - 70 ปี ผู้สมัครอายุ 71-75 ปีใช้แบบนี้ไม่ได้
      (3) 12,000 บาทคือขั้นต่ำ ไม่ใช่ใบเสนอราคา และสมมติว่าชำระต่อเนื่องตลอดสัญญา


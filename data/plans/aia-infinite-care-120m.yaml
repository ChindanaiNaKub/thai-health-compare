    เบี้ยรายปี 201,000 บาท (แบบมีความรับผิดส่วนแรก 100,000 บาท เบี้ย 140,700 บาท
    และแบบ 300,000 บาท เบี้ย 100,500 บาท — ยังไม่ได้บันทึกเป็นแผนแยก)
    เอไอเอไม่เผยแพร่ตารางเบี้ยเต็มทุกช่วงอายุ ยอดรวมตลอดสัญญาจึงคำนวณไม่ได้
terms_source:
  url: https://www.aia.co.th/content/dam/th-wise/images/th/our-products/si_98_aia-infinite-care/Brochure%20AIA%20Infinite%20Care%20(new%20standard)_Final_27Dec2022_website.pdf
  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    อายุรับประกัน 18-75 ปี ต่ออายุได้ถึงอายุ 98 ปี คุ้มครองถึงอายุ 99 ปี
    วงเงิน 120 ล้านบาทต่อรอบปีกรมธรรม์ ค่าห้อง 25,000 บาทต่อวัน
    ผู้ป่วยนอกรวมกับค่าเวชศาสตร์ฟื้นฟูไม่เกิน 100,000 บาทต่อปี
    ระยะเวลาที่ไม่คุ้มครอง 30 วัน (120 วันสำหรับ 8 กลุ่มโรคที่ระบุ, 1 ปีสำหรับ
    ค่าตรวจสุขภาพทั่วไป, 180 วันสำหรับวัคซีนและทันตกรรม) — จากโบรชัวร์ฉบับที่
    หน้าผลิตภัณฑ์ปัจจุบันลิงก์ถึง ไม่ใช่ตัวบทกรมธรรม์ เพราะเอไอเอไม่เผยแพร่กรมธรรม์
    ต่อสาธารณะ ข้อยกเว้นที่บันทึกไว้เป็น "ข้อยกเว้นบางส่วน" ตามที่เอไอเอเผยแพร่เท่านั้น
    หมายเหตุ ก่อนหน้านี้ไฟล์นี้อ้างโบรชัวร์เก่าที่ยังเปิดได้แต่หน้าผลิตภัณฑ์ไม่ได้ลิงก์แล้ว
    ซึ่งระบุว่าต่ออายุถึง 84 ปี คุ้มครองถึง 85 ปี — เป็นข้อมูลที่ล้าสมัย


copay_on_renewal: >-
  ปีแรกไม่มีค่าใช้จ่ายร่วม แต่ในปีต่ออายุ ถ้าเคลมผู้ป่วยในด้วยโรคเล็กน้อยทั่วไปตั้งแต่ 3 ครั้ง
  และอัตราการเคลมตั้งแต่ 200% หรือเคลมโรคทั่วไป (ยกเว้นผ่าตัดใหญ่/โรคร้ายแรง 50 โรค)
  ตั้งแต่ 3 ครั้งและอัตราการเคลมตั้งแต่ 400% จะมีค่าใช้จ่ายร่วม 30% ของค่าใช้จ่ายที่คุ้มครอง
  — ตามเงื่อนไขมาตรฐานใหม่ที่ระบุในโบรชัวร์ของเอไอเอ


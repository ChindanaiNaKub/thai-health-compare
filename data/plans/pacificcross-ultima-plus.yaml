  note: >-
    แปซิฟิค ครอส ไม่มีตารางเบี้ยในโบรชัวร์เลยสักไฟล์ แต่เปิดระบบคำนวณเบี้ยของตัวเอง
    ที่คืนราคาทั้งตารางก่อนจะถามข้อมูลส่วนตัวใดๆ ใช้แค่วันเกิด เพศ และสัญชาติ
    ไม่ต้องกรอกชื่อ ไม่ต้องกรอกอีเมล ไม่มี captcha ตัวเลขทุกช่องด้านบนจึงเป็นราคา
    ที่บริษัทขายจริงในวันที่ตรวจ ไม่ใช่ตัวอย่างในโบรชัวร์ และตรวจซ้ำได้ด้วยตัวเอง
    ที่ POST /index.php?ajax=1&qe_change_plan=1 (พารามิเตอร์ gender, nationality,
    birth_date) เก็บข้อมูลโดยไล่ทุกปีเกิดตั้งแต่ พ.ศ. 2569 ย้อนถึง พ.ศ. 2463 ทั้งสองเพศ
    สามเรื่องที่ต้องรู้คู่กับตัวเลข
    (1) อัตราเดียวกันทั้งชายและหญิง คำตอบของระบบตรงกันทุกไบต์ทั้ง 80 อายุที่ตรวจ
    และสัญชาติไม่ทำให้ราคาต่างกัน ทดสอบทั้งสัญชาติไทยและต่างชาติแล้วได้เท่ากัน
    (2) ตัวเลขด้านบนรวมอากรแสตมป์แล้ว บริษัทบวกเองในโค้ดของตัวเองที่ share.js ว่า
    "let stamp_duty = Math.ceil(base_premium * 0.4 / 100)" และหน้าจอภาษาไทยเขียนกำกับว่า
    "เบี้ยประกันรวม … บาท (รวมอากรณ์แสตมป์)" (สะกดตามหน้าเว็บของบริษัท)
    (3) ตัวเลขด้านบนเป็นราคาแบบไม่ซื้อผู้ป่วยนอก ถ้าซื้อผู้ป่วยนอกพ่วงด้วย
    ราคาจะบวก 20% เท่ากันทุกช่วงอายุ ใบคำขอเอาประกันภัยภาษาไทยของบริษัท
    เขียนส่วนลดนี้ไว้ตรงๆ ว่า "ไม่เลือกความคุ้มครองผู้ป่วยนอก (-20%)"
    ราคายังลดได้อีกสองทางที่ไม่ได้คิดรวมไว้ในตารางนี้ คือส่วนลดครอบครัว 5%
    และความรับผิดส่วนแรก 20,000 / 40,000 / 100,000 / 200,000 / 300,000 บาทต่อปี
    ลดเบี้ยได้ 15% / 25% / 32.5% / 40% / 50% ตามลำดับ แผนนี้เลือกได้ครบทุกขั้น
    ความรับผิดส่วนแรกคิดต่อรอบปีกรมธรรม์ ไม่ใช่ต่อการเข้าพักรักษาแต่ละครั้ง
    สิ่งที่แผนนี้ไม่มี ต่างจากตระกูล Premier และ Maxima ตรงที่ซื้อความคุ้มครอง
    ทันตกรรมและสายตาพ่วงไม่ได้เลย ระบบของบริษัทคืนค่าเบี้ยสองรายการนี้เป็นศูนย์
    สำหรับตระกูล Ultima และตระกูล Standard จ่ายแพงที่สุดแต่ไม่ได้แปลว่าได้ครบที่สุด
    ข้อสังเกตที่ผู้อ่านมักโดนหลอก ช่วงอายุ 0-4 ปีเป็นช่วงที่แพงที่สุดช่วงหนึ่ง
    เด็กแรกเกิดจ่าย 88,151 บาท แต่เด็กห้าขวบจ่าย 50,856 บาท ที่ความคุ้มครองเท่ากัน
    เรื่องอายุรับสมัคร บริษัทให้คำตอบไม่ตรงกันสามที่บนทรัพย์สินของตัวเอง
    หน้าเลือกวันเกิดเขียนว่า "หากอายุเกิน 75 ปี กรุณาติดต่อคอลเซนเตอร์: 02-401-9189"
    ระบบหยุดเสนอราคาแผนนี้ที่อายุ 75 ส่วนหน้า FAQ ภาษาอังกฤษเขียนว่ารับถึงอายุ 80
    เราบันทึก 74 ตามสิ่งที่ระบบขายจริง ไม่ใช่สิ่งที่หน้าโฆษณาอ้าง
terms_source:
  url: https://cdn.prod.website-files.com/685ac8dcfa95c0ec42c27bd1/685ac8dcfa95c0ec42c27f38_Policy-Wording-New-Normal-Lifestyle-Series_EN.pdf
  tier: filed_wording
  verified_on: 2026-08-10
  note: >-
    ข้อควรระวังที่สำคัญที่สุดของแผนนี้ และเป็นเรื่องที่ผู้อ่านคนไทยควรรู้ก่อนเซ็นสัญญา
    แปซิฟิค ครอส เผยแพร่ตัวบทกรมธรรม์ฉบับเต็ม 38 หน้าจริง ครบทั้งคำนิยาม เงื่อนไขทั่วไป
    ข้อยกเว้นทั่วไป ข้อตกลงคุ้มครอง และเอกสารแนบท้ายอีก 13 ฉบับ ละเอียดกว่าที่
    ไทยประกันสุขภาพหรือกรุงเทพประกันภัยเผยแพร่ แต่มีเฉพาะภาษาอังกฤษ
    และท้ายทุกหน้าของเอกสารนั้นบริษัทเขียนเองว่า "This is an English translation of the
    Thai policy wording. In case if there is any discrepancy, the Thai policy wording
    will prevail." แปลว่าฉบับที่ผูกพันตามกฎหมายคือฉบับภาษาไทย แต่บริษัทไม่ได้เผยแพร่
    เราไล่ดูหน้าดาวน์โหลดทั้งฝั่งภาษาไทยและฝั่งภาษาอังกฤษ (ไฟล์ PDF ฝั่งละ 42 ไฟล์)
    รวมทั้งใบคำขอเอาประกันภัยภาษาไทย เมื่อ 2026-08-10 ไม่พบตัวบทภาษาไทยเลยสักฉบับ
    พูดตรงๆ คือบริษัทเผยแพร่ฉบับที่ตัวเองบอกว่าไม่ใช่ฉบับที่ใช้บังคับ
    และไม่เผยแพร่ฉบับที่ตัวเองบอกว่าใช้บังคับ
    ด้วยเหตุนี้ช่องข้อยกเว้นด้านบนจึงเว้นว่าง ไม่ใช่เพราะกรมธรรม์ไม่มีข้อยกเว้น
    แต่เพราะข้อยกเว้นที่เผยแพร่มีแต่ภาษาอังกฤษ ถ้าเราแปลเองแล้วเอามาแสดงตรงนี้
    ผู้อ่านจะเข้าใจว่าเป็นข้อความในสัญญา ทั้งที่เป็นคำแปลของเว็บนี้ ไม่ใช่ของบริษัท
    และไม่ใช่ฉบับที่ศาลจะใช้ตัดสิน เราจึงเลือกเว้นว่างพร้อมบอกเหตุผล
    ตัวเลขที่ดึงจากกรมธรรม์ฉบับภาษาอังกฤษมาใช้ในระเบียนนี้มีสามอย่าง
    (1) อายุต่ออายุสูงสุด 99 ปี ระบุไว้สองที่ ข้อ 6 เขียนว่า "This Insurance Policy may be
    renewable until the policy year when the Covered Person is not over 99 years of age,
    no supportive evidence is required." แต่ต้องอ่านคู่กับข้อเท็จจริงว่าระบบของบริษัท
    หยุดเสนอราคาแผนนี้ที่อายุ 75 เพดาน 99 ในกรมธรรม์จึงไม่มีตารางเบี้ยรองรับ
    ยอดรวมตลอดสัญญาที่เว็บนี้คำนวณให้ จึงมีเฉพาะช่วงอายุที่บริษัทประกาศราคาไว้จริง
    (2) ระยะเวลาที่ไม่คุ้มครอง 30 วันสำหรับการเจ็บป่วยทั่วไป และ 120 วันสำหรับแปดกลุ่มโรค
    คือ เนื้องอก ถุงน้ำ มะเร็งทุกชนิด ริดสีดวงทวาร ไส้เลื่อนทุกชนิด ต้อเนื้อหรือต้อกระจก
    ตัดทอนซิลหรืออะดีนอยด์ นิ่วทุกชนิด เส้นเลือดขอดที่ขา และเยื่อบุโพรงมดลูกเจริญผิดที่
    ส่วนอุบัติเหตุและการผ่าตัดฉุกเฉินไม่ต้องรอ
    (3) วงเงินคิดต่อการเข้าพักรักษาครั้งใดครั้งหนึ่ง โดยนับการกลับเข้ารักษาด้วยโรคเดิม
    ภายใน 90 วันหลังออกจากโรงพยาบาลเป็นครั้งเดียวกัน เกณฑ์ 90 วันเดียวกับเอไอเอ
    ไทยประกันสุขภาพ และแอกซ่า ข้อนี้สำคัญกับแผนวงเงินสูงเป็นพิเศษ เพราะ 50 ล้านบาท
    ที่โฆษณาไว้ ไม่ใช่วงเงินที่ได้ใหม่ทุกปี แต่เป็นวงเงินต่อการเข้าพักรักษาแต่ละครั้ง
    จะดีกว่าหรือแย่กว่าวงเงินต่อปี ขึ้นกับว่าป่วยด้วยโรคเดียวยาวๆ หรือหลายโรคในปีเดียว
    เงื่อนไขก่อนทำประกันใช้กติกา 5 ปีและ 3 ปีแบบเดียวกับมาตรฐานใหม่ทุกฉบับ
    และบริษัทสงวนสิทธิ์ปรับเบี้ยตามอายุ ชั้นอาชีพ และค่ารักษาที่สูงขึ้นของพอร์ตรวม
    ข้อสังเกตที่ต่างจากไทยประกันสุขภาพ คือแปซิฟิค ครอส ไม่ได้ประกาศเพดานการปรับเบี้ย
    รายบุคคลตามประวัติการเคลมไว้เป็นตัวเลข


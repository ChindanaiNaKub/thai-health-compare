    รายชื่อแบบประกันชีวิตที่รับแนบ ไม่ประกาศทุนประกันภัยขั้นต่ำ และไม่เผยแพร่ตาราง
    อัตราเบี้ยของแบบประกันชีวิตแบบใดเลย ต้นทุนจริงจึงสูงกว่าตัวเลขข้างล่างนี้เสมอ

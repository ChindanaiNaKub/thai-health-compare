copay_on_renewal: >-
  ปีแรกไม่มีค่าใช้จ่ายร่วม เงื่อนไขเดียวกับสัญญาเพิ่มเติมสุขภาพอื่นของไทยประกันชีวิต
  กรณีที่ 1 ร่วมจ่ายร้อยละ 30 ของค่าใช้จ่ายที่ได้รับความคุ้มครอง เมื่อเรียกร้องผลประโยชน์
  จากการป่วยเล็กน้อยทั่วไป (Simple Diseases) และเข้าพักรักษาตัวในโรงพยาบาลในรอบปีกรมธรรม์
  ตั้งแต่ 3 ครั้งขึ้นไป และมีอัตราการเรียกร้องค่าสินไหมทดแทนตั้งแต่ร้อยละ 200
  กรณีที่ 2 เงื่อนไขเดียวกันแต่อัตราการเรียกร้องตั้งแต่ร้อยละ 400 ไม่รวมค่าสินไหม
  จากค่ารักษาโรคร้ายแรง กรณีที่ 3 เข้าทั้งสองกรณี ร่วมจ่ายร้อยละ 50
  แจ้งล่วงหน้าไม่น้อยกว่า 15 วัน และยกเลิกเงื่อนไขคืนได้ รายละเอียดกลางของบริษัทอยู่ที่
  https://www.thailife.com/COPAYMENT


    ข้อขัดแย้งที่ต้องรู้ ข้อความโฆษณาบนหน้าเดียวกันเขียนผู้ป่วยนอกไว้ "สูงสุด 2,000 บาทต่อครั้ง"
    แต่ระบบเสนอราคาของทิพยเองคืนค่า 2,500 เรายึดระบบเสนอราคา
    วงเงินชุดนี้ใช้กับผู้สมัครอายุ 15-40 ปีเท่านั้น (41-50 ได้ 500,000 แต่ OPD 1,300 /

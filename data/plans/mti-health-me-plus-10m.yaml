copay_on_renewal: >-
  ปีแรกไม่มีค่าใช้จ่ายร่วม บริษัทระบุเพียงว่า "บริษัทฯ ขอสงวนสิทธิ์ในการปรับเบี้ยประกันภัย
  สำหรับต่ออายุกรมธรรม์ตามช่วงอายุ และสงวนสิทธ์ในการพิจารณาเพิ่มเติมเงื่อนไขหรือกำหนด
  ค่าใช้จ่ายร่วม (Copayment)" — เมืองไทยประกันภัยไม่ประกาศอัตราค่าใช้จ่ายร่วม
  ไม่ประกาศจำนวนครั้งหรืออัตราการเคลมที่จะทำให้เข้าเงื่อนไข และไม่ประกาศว่าจะแจ้งล่วงหน้ากี่วัน
  จึงเป็นเงื่อนไขปลายเปิดที่ผู้ซื้อประเมินต้นทุนล่วงหน้าไม่ได้เลย

# เมืองไทยประกันภัยไม่เผยแพร่รายการข้อยกเว้นของกรมธรรม์นี้ต่อสาธารณะ

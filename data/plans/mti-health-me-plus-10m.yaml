# 10 ล้านบาทคือ "ความคุ้มครองสูงสุดต่อการเข้าพักรักษาเป็นผู้ป่วยในครั้งใดครั้งหนึ่ง"
# ไม่ใช่ต่อรอบปีกรมธรรม์ (เฉพาะหมวด 9-11 เท่านั้นที่คิดต่อรอบปีกรมธรรม์

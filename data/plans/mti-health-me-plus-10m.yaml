ipd_limit_basis: per_confinement
# ผู้ป่วยนอกเป็น "ความคุ้มครองเลือกซื้อเพิ่มเติม" คนละสัญญากับแผนหลัก
# แผนหลักคุ้มครองเฉพาะ OPD ต่อเนื่องหลังนอน รพ. และ OPD อุบัติเหตุภายใน 24 ชม. 10,000 บาท/ครั้ง
opd_annual_limit_thb: null

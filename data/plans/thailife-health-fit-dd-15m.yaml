# ไทยประกันชีวิต เฮลท์ ฟิต ดีดี แผน 3 (15 ล้านบาทต่อรอบปีกรมธรรม์) แบบไม่มีความรับผิดส่วนแรก
# ไทยประกันชีวิตเป็นบริษัทเดียวในชุดข้อมูลนี้ที่ประกาศกลไกค่าใช้จ่ายร่วมตอนต่ออายุ
# ครบทั้งเงื่อนไข ตัวเลข และวิธียกเลิกเงื่อนไข
id: thailife-health-fit-dd-15m
insurer:
  th: ไทยประกันชีวิต
  en: Thai Life Insurance
name:
  th: สัญญาเพิ่มเติม ประกันสุขภาพ เฮลท์ ฟิต ดีดี — แผน 3 (15 ล้านบาท) ไม่มีความรับผิดส่วนแรก
  en: Health Fit DD health rider — plan 3 (15M), no deductible

type: rider
host_policy:
  name:
    th: ไทยประกันชีวิตไม่ประกาศว่าสัญญาเพิ่มเติมนี้แนบกับแบบประกันชีวิตแบบใดได้บ้าง
    en: Thai Life does not publish which main policies accept this rider
  min_sum_insured_thb: null
  premium: null
  premium_unknown_reason: >-
    ไทยประกันชีวิตระบุเพียงว่าสัญญาเพิ่มเติมนี้ต้องซื้อพร้อมสัญญาประกันชีวิต
    แต่ไม่ประกาศรายชื่อแบบประกันชีวิตที่รับแนบ ไม่ประกาศทุนประกันภัยขั้นต่ำ
    และไม่เผยแพร่ตารางอัตราเบี้ยของแบบประกันชีวิตแบบใดเลย
    ราคาจริงที่ผู้ซื้อต้องจ่ายจึงสูงกว่าตัวเลขเบี้ยสัญญาเพิ่มเติมข้างล่างนี้เสมอ
    ด้วยจำนวนที่บริษัทไม่เปิดเผย
  source:
    url: https://product.thailife.com/ประกันสุขภาพ/ประกันสุขภาพเฮลท์ฟิตดีดี/
    tier: official_insurer
    verified_on: 2026-08-10
    note: >-
      หน้าผลิตภัณฑ์ของไทยประกันชีวิตเอง ระบุเงื่อนไขการซื้อพ่วงสัญญาประกันชีวิต
      โดยไม่ระบุแบบประกันหลักและไม่ระบุทุนขั้นต่ำเป็นตัวเลข

shape: lump_sum
new_health_standard: true

# โบรชัวร์ (รหัสเอกสาร P0097-1/03/69) ตาราง "ตัวอย่าง เบี้ยประกันภัยรายปี* อายุ 35 ปี
# อาชีพชั้น 1,2 (คุ้มครองเฉพาะประเทศไทยเท่านั้น)" แถว "ไม่มี" (ไม่มีความรับผิดส่วนแรก)
# คอลัมน์แผน 3 — บริษัทเผยแพร่อายุเดียวเท่านั้นคือ 35 ปี
premium:
  - { age_from: 35, age_to: 35, thb_per_year: 19560, sex: male }
  - { age_from: 35, age_to: 35, thb_per_year: 22490, sex: female }

entry_age_min: 0
entry_age_max: 80
renewal_ceiling_age: 99

# 15 ล้านบาทคือ "ผลประโยชน์สูงสุดต่อรอบปีกรมธรรม์" ไม่ใช่ต่อการเข้าพักครั้งใดครั้งหนึ่ง
ipd_annual_limit_thb: 15000000
ipd_limit_basis: per_policy_year
opd_annual_limit_thb: null
# ไทยประกันชีวิตไม่ประกาศค่าห้องต่อวันเป็นตัวเลขบนหน้าผลิตภัณฑ์ของแผนนี้
room_board_thb_per_night: null
# แผนนี้มีทางเลือกความรับผิดส่วนแรก 30,000 / 50,000 / 100,000 บาท ซึ่งคิด
# "ต่อการเข้าพักรักษาตัวเป็นผู้ป่วยในครั้งใดครั้งหนึ่ง" คนละฐานกับกรุงไทย-แอกซ่า
# ที่คิดต่อรอบปีกรมธรรม์ ห้ามเอาตัวเลขความรับผิดส่วนแรกของสองบริษัทมาเทียบกันตรงๆ
# ระเบียนนี้เป็นแบบไม่มีความรับผิดส่วนแรก
deductible_thb: 0
copay_percent: 0
copay_on_renewal: >-
  ปีแรกไม่มีค่าใช้จ่ายร่วม ไทยประกันชีวิตประกาศกลไกไว้ครบ ต่างจากทุกบริษัทอื่นในชุดข้อมูลนี้
  กรณีที่ 1 อัตราร้อยละ 30 ของค่าใช้จ่ายที่ได้รับความคุ้มครอง เมื่อเรียกร้องผลประโยชน์
  จากการป่วยเล็กน้อยทั่วไป (Simple Diseases) และเข้าพักรักษาตัวในโรงพยาบาล ในรอบปี
  กรมธรรม์ตั้งแต่ 3 ครั้งขึ้นไป และมีอัตราการเรียกร้องค่าสินไหมทดแทนตั้งแต่ร้อยละ 200
  กรณีที่ 2 เงื่อนไขเดียวกันแต่อัตราการเรียกร้องตั้งแต่ร้อยละ 400 โดยไม่รวมค่าสินไหม
  จากค่ารักษาโรคร้ายแรง กรณีที่ 3 เข้าเงื่อนไขทั้งสองกรณี บริษัทจะกำหนดให้มี
  ค่าใช้จ่ายร่วมร้อยละ 50 ของค่าใช้จ่ายที่ได้รับความคุ้มครอง
  บริษัทต้องแจ้งล่วงหน้าไม่น้อยกว่า 15 วัน และมีเงื่อนไขยกเลิกค่าใช้จ่ายร่วมคืนได้
  รายละเอียดกลางของบริษัทอยู่ที่ https://www.thailife.com/COPAYMENT

# ไทยประกันชีวิตไม่เผยแพร่รายการข้อยกเว้นของสัญญาเพิ่มเติมนี้ คำว่า "ข้อยกเว้น"
# ไม่ปรากฏบนหน้าผลิตภัณฑ์เลย จึงบันทึกว่าไม่มีข้อมูล แทนที่จะคัดข้อยกเว้นมาตรฐานมาเดา
exclusions: []
waiting_period_days: 30

premium_source:
  url: https://product.thailife.com/media/wysiwyg/TL-brochure/HealthFitDD.pdf
  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    โบรชัวร์ของไทยประกันชีวิตเอง รหัสเอกสาร P0097-1/03/69 ตารางเบี้ยระบุเงื่อนไขไว้ในหัวตาราง
    ว่าเป็น "ตัวอย่าง" เบี้ยรายปีของผู้เอาประกันภัยอายุ 35 ปี อาชีพชั้น 1,2 และคุ้มครอง
    เฉพาะในประเทศไทย บริษัทไม่เผยแพร่เบี้ยของอายุอื่นเลย ยอดรวมตลอดสัญญาจึงคำนวณไม่ได้
    ตัวเลขในตารางแยกเพศ ชาย / หญิง และเป็นเบี้ยสัญญาเพิ่มเติมอย่างเดียว
    ยังไม่รวมเบี้ยสัญญาหลักที่บริษัทไม่ประกาศ
    แบบมีความรับผิดส่วนแรกถูกกว่ามาก เช่นแผน 3 ที่ความรับผิดส่วนแรก 100,000 บาท
    เบี้ยเหลือ 8,215 บาท (ชาย) / 9,446 บาท (หญิง)
terms_source:
  url: https://product.thailife.com/ประกันสุขภาพ/ประกันสุขภาพเฮลท์ฟิตดีดี/
  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    หน้าผลิตภัณฑ์ของบริษัทเอง ระบุ "อายุรับประกัน : 15 วัน - 80 ปี" และคุ้มครอง
    "ไม่เกินปีกรมธรรม์ที่ผู้เอาประกันภัยมีอายุครบ 99 ปี" ระยะเวลาที่ไม่คุ้มครอง
    "30 วัน สำหรับการเจ็บป่วยด้วยโรคทั่วไป และ 120 วัน" สำหรับกลุ่มโรคที่ระบุ
    (เนื้องอก การตัดทอนซิลหรืออดีนอยด์ ริดสีดวงทวาร นิ่ว ไส้เลื่อน เส้นเลือดขอด ต้อกระจก)
    วงเงิน "ผลประโยชน์สูงสุดต่อรอบปีกรมธรรม์" ของทั้งสี่แผน = 1 / 5 / 15 / 30 ล้านบาท
    และความรับผิดส่วนแรกเป็น "ต่อการเข้าพักรักษาตัวเป็นผู้ป่วยในครั้งใดครั้งหนึ่ง (เลือกได้)"
    ข้อจำกัด: เอกสารเหล่านี้เป็นหน้าขายและโบรชัวร์ ไม่ใช่ตัวบทกรมธรรม์
    บริษัทไม่เผยแพร่ตัวบทกรมธรรม์และไม่เผยแพร่รายการข้อยกเว้นต่อสาธารณะ


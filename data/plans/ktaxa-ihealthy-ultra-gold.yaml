# กรุงไทย-แอกซ่า ไอเฮลท์ตี้ อัลตร้า แผน Gold (วงเงิน 25 ล้านบาทต่อรอบปีกรมธรรม์)
# แบบไม่มีความรับผิดส่วนแรก เป็นสัญญาเพิ่มเติม ซื้อเดี่ยวไม่ได้
# กรุงไทย-แอกซ่าเป็นบริษัทประกันชีวิตรายเดียวในชุดข้อมูลนี้ที่เผยแพร่รายการข้อยกเว้นครบทุกข้อ
# และเป็นรายเดียวที่เคยประกาศ "ราคาสัญญาหลัก" เป็นตัวเลขจริง แม้จะเป็นตัวอย่างเดียว
id: ktaxa-ihealthy-ultra-gold
insurer:
  th: กรุงไทย-แอกซ่า ประกันชีวิต
  en: Krungthai-AXA Life Insurance
name:
  th: สัญญาเพิ่มเติมค่ารักษาพยาบาล ไอเฮลท์ตี้ อัลตร้า — แผน Gold (25 ล้านบาท) ไม่มีความรับผิดส่วนแรก
  en: iHealthy Ultra medical rider — plan Gold (25M), no deductible

type: rider
host_policy:
  name:
    th: Life Ready (แบบประกันชีวิตที่กรุงไทย-แอกซ่าใช้เป็นสัญญาหลักในตัวอย่างของตัวเอง)
    en: Life Ready — the main policy KTAXA itself pairs with iHealthy Ultra in its worked example
  min_sum_insured_thb: 50000
  # บริษัทเผยแพร่ตัวอย่างเดียว: เพศหญิง อายุ 35 ปี, ทุน 50,000 บาท, 750 บาท/ปี.
  # นี่คือ sample ที่ตรวจสอบได้ ไม่ใช่การอนุมานหรือราคาสำหรับอายุอื่น.
  premium:
    - { age_from: 35, age_to: 35, thb_per_year: 750, sex: female }
  premium_unknown_reason: null
  source:
    url: https://thailandgi-ktaxa.cdn.prismic.io/thailandgi-ktaxa/aRs0prpReVYa4jIi_AG_A4_Brochure_HealthUltra.pdf
    tier: official_insurer
    verified_on: 2026-08-15
    note: >-
      โบรชัวร์แพ็กเกจ Health Ultra ตัวอย่างการคำนวณเบี้ย ระบุสัญญาหลัก Life Ready
      ทุนประกันภัย 50,000 บาท เบี้ยปีละ 750 บาท คู่กับ iHealthy Ultra แผน Gold
      เบี้ยรายปีปีแรก 43,800 บาท สำหรับผู้เอาประกันภัยเพศหญิงอายุ 35 ปี
      หมายเหตุ ตัวเลข 43,800 บาทของแพ็กเกจไม่ตรงกับตารางเบี้ย Gold ในโบรชัวร์
      ไอเฮลท์ตี้ อัลตร้าเอง (อายุ 30 หญิง 41,500 / อายุ 40 หญิง 47,100) เพราะเป็นคนละอายุ
      เราจึงใช้ตารางเบี้ยของสัญญาเพิ่มเติมเป็นแหล่งอ้างอิงหลัก ไม่ใช่ตัวเลขในแพ็กเกจ
      ตัวอย่างเบี้ยสัญญาหลัก 750 บาทนี้บันทึกแยกเป็น sample อายุ 35 ปี เพศหญิงเท่านั้น

shape: lump_sum
new_health_standard: true

# ตาราง "ตัวอย่างเบี้ยประกันภัยรายปี iHealthy Ultra" คอลัมน์แผน Gold แบบเต็มความคุ้มครอง
# บริษัทเผยแพร่เฉพาะอายุ 20, 30, 40, 50 สำหรับผู้ใหญ่ (และ 6-10 สำหรับเด็ก) อายุอื่นไม่ประกาศ
# แยกเพศชาย/หญิง จึงบันทึกแยก
premium:
  - { age_from: 20, age_to: 20, thb_per_year: 31900, sex: male }
  - { age_from: 30, age_to: 30, thb_per_year: 35000, sex: male }
  - { age_from: 40, age_to: 40, thb_per_year: 40900, sex: male }
  - { age_from: 50, age_to: 50, thb_per_year: 55900, sex: male }
  - { age_from: 20, age_to: 20, thb_per_year: 36500, sex: female }
  - { age_from: 30, age_to: 30, thb_per_year: 41500, sex: female }
  - { age_from: 40, age_to: 40, thb_per_year: 47100, sex: female }
  - { age_from: 50, age_to: 50, thb_per_year: 64600, sex: female }

entry_age_min: 11
entry_age_max: 80
renewal_ceiling_age: 98

# 25 ล้านบาทคือ "ผลประโยชน์รวมสูงสุด (ต่อรอบปีกรมธรรม์ประกันภัย)" ไม่ใช่ต่อการเข้าพักครั้งใดครั้งหนึ่ง
# ต่างจากเมืองไทยประกันภัยและไทยประกันสุขภาพ ซึ่งคิดต่อครั้ง เทียบตัวเลขตรงๆ ไม่ได้
ipd_annual_limit_thb: 25000000
ipd_limit_basis: per_policy_year
opd_annual_limit_thb: null
room_board_thb_per_night: 9000
# แผน Gold มีทางเลือกแบบมีความรับผิดส่วนแรก 50,000 บาทต่อรอบปีกรมธรรม์ ซึ่งเบี้ยถูกกว่า
# (เช่น อายุ 30 = 26,300 ชาย / 31,100 หญิง) ระเบียนนี้เป็นแบบไม่มีความรับผิดส่วนแรก
deductible_thb: 0
copay_percent: 0
copay_on_renewal: >-
  กรุงไทย-แอกซ่าไม่ประกาศเงื่อนไขค่าใช้จ่ายร่วม (Copayment) ของสัญญาเพิ่มเติมนี้เลย
  ไม่มีอัตราร้อยละ ไม่มีจำนวนครั้งที่เข้าเงื่อนไข ไม่มีอัตราการเคลมที่เป็นตัวกระตุ้น
  และไม่มีระยะเวลาแจ้งล่วงหน้า ในเอกสารใดของบริษัท สิ่งเดียวที่มีคือทางเลือก
  "ความรับผิดส่วนแรก (Deductible) ต่อรอบปีกรมธรรม์ประกันภัย" ซึ่งเป็นคนละกลไกกัน
  เทียบกับไทยประกันชีวิตที่ประกาศกลไกร่วมจ่ายครบทั้งตัวเลขและเงื่อนไข ช่องนี้ของ
  กรุงไทย-แอกซ่าจึงเป็น "ไม่ประกาศ" ไม่ใช่ "ไม่มี"

# บริษัทเผยแพร่รายการข้อยกเว้นทั่วไปครบ 21 ข้อเป็น PDF แยกต่างหาก (ดู terms_source)
# ซึ่งเป็นรายเดียวในบรรดาบริษัทประกันชีวิตในชุดข้อมูลนี้ที่ทำแบบนั้น
# เรายังไม่ได้ถอดความครบทั้ง 21 ข้อแบบคำต่อคำ จึงไม่ลงรายการบางส่วนให้เข้าใจผิดว่าครบ

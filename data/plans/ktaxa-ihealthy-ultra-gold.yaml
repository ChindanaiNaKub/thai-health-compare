    ข้อจำกัด: เอกสารทั้งหมดนี้เป็นโบรชัวร์และเอกสารประกอบการขาย ไม่ใช่ตัวบทกรมธรรม์
    บริษัทไม่เผยแพร่ตัวบทกรมธรรม์ต่อสาธารณะ และไม่ประกาศระยะเวลาที่ไม่คุ้มครองเป็นจำนวนวัน

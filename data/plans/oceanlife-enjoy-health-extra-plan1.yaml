# ไทยสมุทร โอเชี่ยนไลฟ์ เอ็นจอย เฮลท์ เอ็กซ์ตร้า — แผน 1 แบบไม่มีความรับผิดส่วนแรก
# วงเงิน 1 ล้านบาทต่อการเข้ารักษาครั้งใดครั้งหนึ่ง ไม่ใช่ต่อปี
# ข้อจำกัดใหญ่ที่สุด: บริษัทประกาศเบี้ยแค่ 4 อายุ และไม่ประกาศราคาสัญญาหลักเลย
id: oceanlife-enjoy-health-extra-plan1
insurer:
  th: ไทยสมุทรประกันชีวิต
  en: Ocean Life Insurance PCL
name:
  th: โอเชี่ยนไลฟ์ เอ็นจอย เฮลท์ เอ็กซ์ตร้า — แผน 1 (ไม่มีความรับผิดส่วนแรก)
  en: Ocean Life Enjoy Health Extra — Plan 1 (no deductible)

type: rider
host_policy:
  name:
    th: บริษัทไม่ระบุชื่อแบบประกันภัยหลัก
    en: Insurer does not name the required main policy
  min_sum_insured_thb: null
  premium: null
  premium_unknown_reason: >-
    ไทยสมุทรไม่เผยแพร่ราคาสัญญาหลักของแผนนี้ และไม่เผยแพร่รายชื่อแบบประกันภัยหลัก
    ที่แนบสัญญาเพิ่มเติมนี้ได้ ทั้งที่โบรชัวร์เขียนเองว่างวดการชำระเบี้ยของสัญญาเพิ่มเติมนี้
    "ต้องสอดคล้องกับงวดการชำระเบี้ยประกันภัยของกรมธรรม์หลัก" แปลว่าต้องมีสัญญาหลักแน่นอน
    เงินที่ต้องจ่ายจริงต่อปีจึงสูงกว่าตัวเลขในตารางนี้เสมอ
    น่าสังเกตว่าบริษัทเดียวกันนี้ประกาศราคาสัญญาหลักครบทุกอายุสำหรับโครงการโอชิ สมอล เฮลท์
    ที่ขายออนไลน์ แต่ไม่ประกาศสำหรับแผนนี้ที่ขายผ่านตัวแทน
  source:
    url: https://www.ocean.co.th/our-products/health-insurance/enjoy-health-extra/download/brochure
    tier: official_insurer
    verified_on: 2026-08-10
    note: >-
      โบรชัวร์ของแผนนี้ไม่ระบุรายชื่อแบบประกันภัยหลักที่แนบได้ ไม่มีทุนขั้นต่ำ
      ไม่มีเบี้ยขั้นต่ำ และไม่มีตัวอย่างราคา ตรวจหน้าดาวน์โหลดเอกสารของบริษัท
      เมื่อ 2026-08-10 พบเฉพาะแบบฟอร์มเคลมและแบบฟอร์มบริการ

shape: lump_sum
new_health_standard: true

# บริษัทประกาศเบี้ยแค่สี่อายุ คือ 20 30 40 และ 50 ปี ไม่ใช่ตารางช่วงอายุ
# แผนนี้แยกเพศ ผู้หญิงจ่ายแพงกว่าผู้ชายทุกอายุที่ประกาศ
premium:
  - { age_from: 20, age_to: 20, thb_per_year: 16638, sex: male }
  - { age_from: 30, age_to: 30, thb_per_year: 17939, sex: male }
  - { age_from: 40, age_to: 40, thb_per_year: 22980, sex: male }
  - { age_from: 50, age_to: 50, thb_per_year: 31719, sex: male }
  - { age_from: 20, age_to: 20, thb_per_year: 17481, sex: female }
  - { age_from: 30, age_to: 30, thb_per_year: 19314, sex: female }
  - { age_from: 40, age_to: 40, thb_per_year: 24493, sex: female }
  - { age_from: 50, age_to: 50, thb_per_year: 32045, sex: female }

entry_age_min: 11
entry_age_max: 80
renewal_ceiling_age: 98

# 1,000,000 บาท เป็นเพดานรวมของหมวด 1-6 และหมวด 12-13
# คิดต่อการเข้ารักษาในโรงพยาบาลครั้งใดครั้งหนึ่ง ไม่ใช่ต่อรอบปีกรมธรรม์
ipd_annual_limit_thb: 1000000
ipd_limit_basis: per_confinement
# หมวด 7 ค่ารักษาผู้ป่วยนอกจากอุบัติเหตุภายใน 24 ชั่วโมง ให้ 20,000 บาทต่อครั้ง
# เป็นเพดานต่อครั้ง ไม่ใช่ต่อปี จึงไม่มีวงเงินผู้ป่วยนอกต่อปีให้บันทึก
opd_annual_limit_thb: null
# บริษัทไม่ประกาศค่าห้องเป็นตัวเลข เขียนว่า "จ่ายตามจริง (ไม่เกินค่าห้องพักเดี่ยวมาตรฐาน)"
# เงื่อนไขแบบนี้ดีกว่าเพดานตัวเลขในหลายกรณี แต่เทียบกับแผนอื่นเป็นตัวเลขไม่ได้
room_board_thb_per_night: null
# บันทึกแบบไม่เลือกความรับผิดส่วนแรก เป็นตัวเลือกที่แพงที่สุดและเทียบกับแผนอื่นได้ตรงที่สุด
deductible_thb: 0
copay_percent: 0
copay_on_renewal: >-
  ปีแรกไม่มีค่าใช้จ่ายร่วม ส่วนปีต่ออายุ ไทยสมุทรเขียนไว้แค่ว่าอาจมี ไม่ได้บอกว่าเท่าไร
  ใช้ข้อความชุดเดียวกับแผนซูพรีม เฮลท์ คือขึ้นอยู่กับอายุ ชั้นอาชีพ ค่ารักษาที่สูงขึ้น
  หรือประสบการณ์การจ่ายค่าสินไหม ตามเงื่อนไขและหลักเกณฑ์ของบริษัท
  ไม่มีเปอร์เซ็นต์ ไม่มีเกณฑ์จำนวนครั้ง ไม่มีเกณฑ์อัตราการเคลม

# โบรชัวร์เขียนเองว่ารายการข้อยกเว้นในเอกสาร "เป็นเพียงส่วนหนึ่งของเงื่อนไขข้อยกเว้นความคุ้มครอง"
exclusions: []
waiting_period_days: 30

premium_source:
  url: https://www.ocean.co.th/our-products/health-insurance/enjoy-health-extra/download/brochure
  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    โบรชัวร์ให้เบี้ยแค่สี่อายุ คือ 20 30 40 และ 50 ปี ยอดรวมตลอดสัญญาที่เว็บนี้คำนวณให้
    จึงเป็นช่องว่างเกือบทั้งแถว และนั่นคือสภาพของข้อมูลที่บริษัทเปิดเผย
    ตัวเลขในระเบียนนี้เป็นเบี้ยปีแรกของแผน 1 แบบไม่เลือกความรับผิดส่วนแรก
    ถ้าเลือกความรับผิดส่วนแรก เบี้ยลดลงมาก เช่นผู้ชายอายุ 30 ปี จาก 17,939 บาท
    เหลือ 11,788 / 8,273 / 3,880 บาท เมื่อเลือก 20,000 / 50,000 / 100,000 บาท
    แต่ต้องอ่านให้ดี ความรับผิดส่วนแรกของแผนนี้คิด "ต่อการเข้ารักษาในโรงพยาบาล
    ครั้งใดครั้งหนึ่ง" ไม่ใช่ต่อรอบปีกรมธรรม์ แปลว่าถ้านอนโรงพยาบาลสามครั้งในปีเดียว
    ต้องจ่ายส่วนแรกสามรอบ ต่างจากกรุงไทย-แอกซ่าและแปซิฟิค ครอส ที่คิดต่อปี
    ส่วนลดเบี้ยที่ดูมากจึงไม่ได้แปลว่าถูกกว่าจริงเสมอไป
    แผนนี้มีสามระดับ วงเงิน 1 ล้าน 3 ล้าน และ 5 ล้านบาทต่อการเข้ารักษาครั้งใดครั้งหนึ่ง
    ตัวเลขทั้งหมดเป็นเบี้ยสัญญาเพิ่มเติมอย่างเดียว ยังไม่รวมสัญญาหลักที่บังคับซื้อ
terms_source:
  url: https://www.ocean.co.th/our-products/health-insurance/enjoy-health-extra
  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    ไทยสมุทรไม่เผยแพร่ตัวบทกรมธรรม์ของแผนนี้ มีแต่โบรชัวร์ และโบรชัวร์เขียนกำกับตัวเองว่า
    "เงื่อนไขข้อยกเว้นที่ระบุไว้ในเอกสารฉบับนี้เป็นเพียงส่วนหนึ่งของเงื่อนไข
    ข้อยกเว้นความคุ้มครอง" เราจึงเว้นช่องข้อยกเว้นไว้ว่าง แทนที่จะแสดงบางส่วน
    ราวกับเป็นรายการทั้งหมด ระเบียนนี้ใช้ tier เป็น official_insurer ไม่ใช่ filed_wording
    เรื่องฐานการคิดวงเงิน แผนนี้คิดต่อการเข้ารักษาครั้งใดครั้งหนึ่ง ต่างจากแผนซูพรีม เฮลท์
    ของบริษัทเดียวกันที่คิดต่อรอบปีกรมธรรม์ สองแผนนี้ของบริษัทเดียวกันจึงเทียบกันตรงๆ ไม่ได้
    หมวด 9-11 (ล้างไต รังสีรักษา เคมีบำบัด) คิดต่อรอบปีกรมธรรม์ที่ 50,000 บาทสำหรับแผนนี้
    ส่วนหมวด 8 (เวชศาสตร์ฟื้นฟู) บริษัทเขียนว่า "ไม่คุ้มครอง" เป็นหมวดที่แผนอื่น
    ในชุดข้อมูลนี้ส่วนใหญ่คุ้มครอง
    ค่าห้องเขียนว่าจ่ายตามจริงไม่เกินค่าห้องพักเดี่ยวมาตรฐาน ไม่มีตัวเลขกำกับ
    เงื่อนไขแบบนี้มักดีกว่าเพดานตัวเลขในโรงพยาบาลที่ค่าห้องแพง แต่ผูกกับนิยาม
    "ห้องพักเดี่ยวมาตรฐาน" ของแต่ละโรงพยาบาล แต่บริษัทไม่ได้นิยามไว้ในโบรชัวร์


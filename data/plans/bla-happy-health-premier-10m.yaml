# สัญญาเพิ่มเติม บีแอลเอ แฮปปี้ เฮลธ์ พรีเมียร์ แผน 10 ล้านบาท แบบไม่มีความรับผิดส่วนแรก
# ตัวเลขทุกตัวมาจากหน้าผลิตภัณฑ์ของกรุงเทพประกันชีวิตเอง ไม่มีเว็บตัวแทน
# จุดสำคัญ: 10 ล้านบาทเป็นวงเงิน "ต่อการเข้าพักรักษาตัวครั้งใดครั้งหนึ่ง" ไม่ใช่ต่อปี
id: bla-happy-health-premier-10m
insurer:
  th: กรุงเทพประกันชีวิต
  en: Bangkok Life Assurance
name:
  th: สัญญาเพิ่มเติมบีแอลเอ แฮปปี้ เฮลธ์ พรีเมียร์ — แผน 10 ล้านบาท (ไม่มีความรับผิดส่วนแรก)
  en: BLA Happy Health Premier — 10M plan, no deductible

type: rider
host_policy:
  name:
    th: บีแอลเอ ตลอดชีพ 99/99
    en: BLA Lifelong 99/99
  min_sum_insured_thb: 50000
  premium: null
  premium_unknown_reason: >-
    กรุงเทพประกันชีวิตไม่เผยแพร่อัตราเบี้ยของ บีแอลเอ ตลอดชีพ 99/99 ต่อสาธารณะ
    หน้าผลิตภัณฑ์ประกาศเฉพาะ "จำนวนเงินเอาประกันภัยเริ่มต้น : 50,000 บาท" และ
    "อายุรับประกันภัย : แรกเกิด – 80 ปี" แต่ไม่มีตารางเบี้ยหรือตัวอย่างเบี้ยใด ๆ
    แบบประกันเดียวของกรุงเทพประกันชีวิตที่ประกาศอัตราเบี้ยไว้จริงคือ แคร์ริ่ง พรีเมียร์ 99/20
    (อัตราต่อจำนวนเงินเอาประกันภัย 1,000 บาท) แต่รับประกันถึงอายุ 70 ปีเท่านั้น
    จึงรองรับผู้สมัครสัญญาเพิ่มเติมนี้ที่อายุ 71-80 ปีไม่ได้ และมีทุนขั้นต่ำ 200,000 บาท
    ซึ่งแพงกว่า เราจึงไม่ใช้เป็นราคาพื้น และบันทึกว่า "ไม่เปิดเผย" ตามจริง
  source:
    url: https://www.bangkoklife.com/th/products/detail/204
    tier: official_insurer
    verified_on: 2026-08-10
    note: >-
      หน้าผลิตภัณฑ์ บีแอลเอ ตลอดชีพ 99/99 ระบุ "อายุรับประกันภัย : แรกเกิด – 80 ปี",
      "จำนวนเงินเอาประกันภัยเริ่มต้น : 50,000 บาท" และที่สำคัญที่สุดคือ
      "บีแอลเอ ตลอดชีพ 99/99 ต้องซื้อพร้อมกับสัญญาเพิ่มเติมสุขภาพ หรือสัญญาเพิ่มเติมโรคร้ายแรง
      จึงจะซื้อสัญญาเพิ่มเติมอื่น ๆ ได้" ซึ่งเป็นการยืนยันการจับคู่จากบริษัทเอง
      ต่างจากบริษัทอื่นที่ไม่ประกาศว่าสัญญาเพิ่มเติมแนบกับสัญญาหลักแบบใดได้บ้าง

shape: lump_sum
new_health_standard: true

# กรุงเทพประกันชีวิตประกาศเบี้ยเป็นตัวอย่างเฉพาะอายุ 35 ปี ทั้งชายและหญิง
# ในตารางผลประโยชน์บนหน้าผลิตภัณฑ์ ไม่มีตารางเบี้ยเต็มทุกช่วงอายุ
# ค่าที่บันทึกคือคอลัมน์ "แผน 10 ล้าน" ช่องความรับผิดส่วนแรก "ไม่มี"
premium:
  - { age_from: 35, age_to: 35, thb_per_year: 24551, sex: male }
  - { age_from: 35, age_to: 35, thb_per_year: 27057, sex: female }

entry_age_min: 11
entry_age_max: 80
renewal_ceiling_age: 99

# "ผลประโยชน์รวมสูงสุดต่อการเข้าพักรักษาตัวครั้งใดครั้งหนึ่งจากการเจ็บป่วย หรือบาดเจ็บทั่วไป"
# = 10,000,000 บาท ต่อครั้ง ไม่ใช่ต่อรอบปีกรมธรรม์
# (กรณีมะเร็ง หัวใจ หลอดเลือดสมอง วงเงินต่อครั้งเป็น 11,000,000 บาท)
ipd_annual_limit_thb: 10000000
ipd_limit_basis: per_confinement
# หมวดที่ 7 ค่ารักษาผู้ป่วยนอกกรณีอุบัติเหตุภายใน 24 ชั่วโมง 10,000 บาทต่อครั้ง
# ไม่ใช่ OPD ทั่วไป แผนนี้ไม่มีความคุ้มครองผู้ป่วยนอกจากการเจ็บป่วยทั่วไป
opd_annual_limit_thb: null
room_board_thb_per_night: 5000
deductible_thb: 0
copay_percent: 0
copay_on_renewal: >-
  ปีแรกไม่มีค่าใช้จ่ายร่วม แต่บริษัทระบุว่า "หากผู้เอาประกันภัยมีประวัติการเรียกร้องสินไหม
  เป็นไปตามเงื่อนไขข้อใดข้อหนึ่งของเงื่อนไขต่ออายุแบบมีค่าใช้จ่ายร่วม (Copayment)
  ผู้เอาประกันภัยจะได้รับความคุ้มครองในปีต่ออายุเป็นแบบมีค่าใช้จ่ายร่วม (Copayment)
  (สำหรับกรมธรรม์ประกันสุขภาพมาตรฐานที่เริ่มคุ้มครองตั้งแต่วันที่ 20 มีนาคม 2568 เป็นต้นไป)"
  กรุงเทพประกันชีวิตไม่เผยแพร่ตัวเลขอัตราค่าใช้จ่ายร่วมหรือหลักเกณฑ์การนับครั้ง/อัตราการเคลม
  บนหน้าผลิตภัณฑ์นี้ จึงไม่ทราบว่าจะเป็น 30% หรือ 50% และเข้าเงื่อนไขเมื่อใด

# กรุงเทพประกันชีวิตเผยแพร่เฉพาะ "ตัวอย่างข้อยกเว้นความคุ้มครอง" 5 ข้อ ไม่ใช่ชุดเต็ม
# และระบุเองว่า "ข้อยกเว้นอย่างสมบูรณ์...ศึกษารายละเอียดได้จากกรมธรรม์ประกันชีวิตของท่าน"
exclusions:
  - th: ภาวะที่เป็นผลจากความผิดปกติที่เกิดขึ้นแต่กำเนิด หรือระบบการสร้างอวัยวะของร่างกายไม่สมบูรณ์แต่กำเนิด หรือโรคทางพันธุกรรม หรือความผิดปกติในการพัฒนาการของร่างกาย
    en: null
  - th: การตรวจรักษาหรือการผ่าตัดเพื่อเสริมสวย หรือการแก้ไขปัญหาผิวพรรณ สิว ฝ้า กระ รังแค ผมร่วง หรือการควบคุมน้ำหนักตัว การผ่าตัดที่สามารถทดแทนด้วยการรักษาแนวทางอื่น
    en: null
  - th: การตั้งครรภ์ แท้งบุตร ทำแท้ง การคลอดบุตร โรคแทรกซ้อนจากการตั้งครรภ์ การแก้ไขปัญหาการมีบุตรยาก (รวมถึงการสืบวิเคราะห์และการรักษา) การทำหมันหรือการคุมกำเนิด
    en: null
  - th: การฆ่าตัวตาย การพยายามฆ่าตัวตาย หรือการทำร้ายร่างกายตนเอง
    en: null
  - th: การบาดเจ็บที่เกิดขึ้นจากการกระทำของผู้ได้รับความคุ้มครองขณะอยู่ภายใต้ฤทธิ์สุรา สารเสพติด หรือยาเสพติดให้โทษ จนไม่สามารถครองสติได้ (กรณีตรวจเลือด ถือเกณฑ์แอลกอฮอล์ในเลือดตั้งแต่ 150 มิลลิกรัมเปอร์เซ็นต์ขึ้นไป)
    en: null
waiting_period_days: 30

premium_source:
  url: https://www.bangkoklife.com/th/products/detail/269
  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    ตารางผลประโยชน์บนหน้าผลิตภัณฑ์ของกรุงเทพประกันชีวิต แถว
    "ตัวอย่าง เบี้ยประกันภัยรายปีมาตรฐาน สำหรับเพศชาย อายุ 35 ปี" และแถวเพศหญิง
    คอลัมน์แผน 10 ล้าน ช่องความรับผิดส่วนแรก "ไม่มี" = 24,551 บาท (ชาย) และ 27,057 บาท (หญิง)
    ตารางเดียวกันยังประกาศแผน 10 ล้านแบบมีความรับผิดส่วนแรก 30,000 บาท (15,950/18,110)
    และ 100,000 บาท (8,898/10,088) ซึ่งเป็นคนละแผนกับที่บันทึกในไฟล์นี้
    กรุงเทพประกันชีวิตไม่เผยแพร่ตารางเบี้ยเต็มทุกช่วงอายุ ยอดรวมตลอดสัญญาจึงคำนวณไม่ได้
terms_source:
  url: https://www.bangkoklife.com/th/products/detail/269
  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    อายุรับประกันภัย 11-80 ปี คุ้มครองสูงสุดถึงอายุ 99 ปี ค่าห้อง 5,000 บาทต่อวัน
    (แผน 10 ล้าน) หรือค่าห้องพักเดี่ยวราคาเริ่มต้นของโรงพยาบาล แล้วแต่จำนวนใดจะสูงกว่า
    สูงสุด 180 วัน วงเงิน 10 ล้านบาทเป็น "ต่อการเข้าพักรักษาตัวครั้งใดครั้งหนึ่ง"
    ระยะเวลาที่ไม่คุ้มครอง 30 วัน (120 วันสำหรับ 8 โรค: เนื้องอก/ถุงน้ำ/มะเร็ง ริดสีดวงทวาร
    ไส้เลื่อน ต้อเนื้อ/ต้อกระจก ตัดทอนซิล/อดีนอยด์ นิ่ว เส้นเลือดขอดที่ขา เยื่อบุโพรงมดลูก
    เจริญผิดที่) และ 90 วันสำหรับค่าชดเชยผู้ป่วยอาการวิกฤต
    ข้อมูลทั้งหมดมาจากหน้าผลิตภัณฑ์ของบริษัทเอง ไม่ใช่ตัวบทกรมธรรม์
    เพราะกรุงเทพประกันชีวิตไม่เผยแพร่กรมธรรม์ต่อสาธารณะ และระบุเองว่า
    "สื่อโฆษณาฉบับนี้เป็นเพียงการสรุปผลประโยชน์เบื้องต้นเท่านั้น"
    ข้อยกเว้นที่บันทึกไว้เป็น "ตัวอย่างข้อยกเว้นความคุ้มครอง" ตามที่บริษัทเผยแพร่เท่านั้น


copay_on_renewal: >-
  ปีแรกไม่มีค่าใช้จ่ายร่วม แต่ตอนต่ออายุบริษัทสงวนสิทธิ์เพิ่มเงื่อนไขนี้ได้
  ตัวบทกรมธรรม์ (ภาษาอังกฤษ ข้อ General Conditions) เขียนไว้สองระดับ
  ระดับแรกคือให้ผู้เอาประกันภัยร่วมจ่ายไม่เกิน 30% ของค่ารักษาที่คุ้มครอง
  พร้อมลดเบี้ยปีต่ออายุไม่เกิน 30% ใช้ได้ทั้งกรณีทั่วไปและกรณีที่อัตราการเคลม
  ของผู้เอาประกันภัยรายนั้นเกิน 400% ระดับที่สองคือถ้าเข้าเงื่อนไขระดับแรก
  ตั้งแต่สองครั้งขึ้นไป บริษัทจะกำหนดให้ร่วมจ่ายได้ถึง 50% และลดเบี้ยได้ถึง 50%
  บริษัทต้องแจ้งล่วงหน้า 15 วัน และอาจพิจารณายกเลิกเงื่อนไขร่วมจ่ายคืนให้ภายหลังได้
  โครงสร้างนี้เป็นข้อความมาตรฐานของ คปภ. ชุดเดียวกับที่ไทยประกันชีวิตใช้
  ต่างกันตรงที่ไทยประกันชีวิตเผยแพร่เป็นภาษาไทย แปซิฟิค ครอส เผยแพร่เฉพาะภาษาอังกฤษ
  เรื่องที่ควรคิดให้หนักสำหรับแผนนี้โดยเฉพาะ เพราะเป็นแผนที่ถือยาวถึงอายุ 99 ได้
  ต่ออายุยังไม่การันตีร้อยเปอร์เซ็นต์ บริษัทระบุเหตุปฏิเสธการต่ออายุไว้สามข้อ
  คือแจ้งข้อมูลไม่ครบถ้วน เคลมโดยไม่มีความจำเป็นทางการแพทย์ และเอาประกันภัย
  ค่าชดเชยรายวันไว้เกินรายได้จริง โดยแจ้งล่วงหน้า 30 วัน
  อีกเรื่องที่ต้องแยกให้ขาด บริษัทมีค่าใช้จ่ายร่วม 20% ตั้งแต่วันแรกอยู่แล้ว
  แต่เก็บเฉพาะความคุ้มครองทันตกรรมและสายตาที่ซื้อเพิ่ม ไม่ได้เก็บกับค่ารักษาผู้ป่วยใน
  จึงไม่นับรวมในช่อง copay_percent ด้านบน


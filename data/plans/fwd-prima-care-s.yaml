  verified_on: 2026-08-10
  note: >-
    หน้า 6 "อายุรับประกันภัย 16 – 70 ปี (ต่ออายุได้สูงสุดถึงอายุ 98 ปี)" และ
    "ระยะเวลาคุ้มครอง ถึงอายุ 99 ปี หรือไม่เกินระยะเวลาคุ้มครองของกรมธรรม์ประกันชีวิต"
    หน้า 4 ตารางผลประโยชน์ หัวข้อ 1 "ผลประโยชน์กรณีผู้ป่วยใน ต่อการเข้าพักรักษาตัว
    เป็นผู้ป่วยในครั้งใดครั้งหนึ่ง" แผน S ค่าห้องและค่าอาหาร 1,500 บาทต่อวัน (สูงสุด 125 วัน)
    หน้า 7 ระยะเวลาที่ไม่คุ้มครอง 30 วันสำหรับการเจ็บป่วยใดๆ, 90 วันสำหรับ 8 กลุ่มโรคที่ระบุ,
    120 วันสำหรับโรคมะเร็งระยะลุกลาม, อุบัติเหตุฉุกเฉินคุ้มครองทันที
    เอกสารนี้ไม่ใช่ตัวบทกรมธรรม์ โบรชัวร์เขียนเองว่า "เอกสารนี้มิใช่ส่วนหนึ่งของสัญญาประกันภัย
    ข้อกําหนดและเงื่อนไขของความคุ้มครองจะระบุไว้ในกรมธรรม์ประกันภัย"
    เอฟดับบลิวดีไม่เผยแพร่ตัวบทกรมธรรม์ต่อสาธารณะ


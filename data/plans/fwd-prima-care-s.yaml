  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    โบรชัวร์ฉบับปรับปรุงใหม่ มกราคม 2569 หน้า 8 ตาราง "ตัวอย่างเบี้ยประกันภัยรายปี (ปีแรก)"
    แผน S ชาย อายุ 30/40/50 = 5,300 / 6,300 / 7,900 บาท หญิง = 6,800 / 8,200 / 10,200 บาท
    เงื่อนไขที่โบรชัวร์กำกับไว้ (1) เป็นเบี้ยสำหรับขั้นอาชีพ 1 และ 2 เท่านั้น
    (2) "เบี้ยประกันภัยปรับตามอายุที่เพิ่มขึ้น" (3) บริษัทปรับเบี้ยได้ ณ วันครบรอบปีกรมธรรม์
    จากอายุ ขั้นอาชีพ ค่ารักษาที่สูงขึ้น หรือประสบการณ์สินไหมรวมของสัญญาเพิ่มเติมนี้
    เอฟดับบลิวดีไม่เผยแพร่เบี้ยของอายุอื่นนอกจาก 30/40/50 ยอดรวมตลอดสัญญาจึงคำนวณไม่ได้
    เบี้ยนี้เป็นเบี้ยสัญญาเพิ่มเติมอย่างเดียว ยังไม่รวมเบี้ยสัญญาหลักที่ไม่มีการประกาศ
terms_source:
  url: https://www.fwd.co.th/files/v3/assets/blt331c1aa12dcfd37a/blt3866802f75fca3b6/69521ad46ae381bb2f51eca9/TH_Brochure_Prima_Care_V1.pdf

# เอฟดับบลิวดี พรีม่า แคร์ แผน S (แผนถูกที่สุดใน 5 แผน).
# ต่างจากไฟล์ของเอไอเอตรงที่ เอฟดับบลิวดีเผยแพร่ "ตารางเบี้ยจริง" 3 ช่วงอายุ x 2 เพศ
# ในโบรชัวร์ของตัวเอง แต่ก็เหมือนกันตรงที่ไม่ประกาศว่าสัญญาเพิ่มเติมนี้แนบกับสัญญาหลักแบบใดได้
id: fwd-prima-care-s
insurer:
  th: เอฟดับบลิวดี ประกันชีวิต
  en: FWD Life Insurance (Thailand)
name:
  th: สัญญาเพิ่มเติมการประกันภัยสุขภาพแบบ เอฟดับบลิวดี พรีม่า แคร์ — แผน S
  en: FWD Prima Care health rider — plan S

type: rider
host_policy:
  name:
    th: สัญญาหลักแบบประกันตลอดชีพ 99/99 ของเอฟดับบลิวดี (แบบที่ถูกที่สุดที่ประกาศทุนขั้นต่ำและคุ้มครองยาวพอ)
    en: FWD Whole Life 99/99 — the cheapest FWD main policy with a published minimum that lasts long enough
  min_sum_insured_thb: 300000
  premium: null
  premium_unknown_reason: >-
    เอฟดับบลิวดีไม่ประกาศรายชื่อสัญญาหลักที่แนบ พรีม่า แคร์ ได้ โบรชัวร์ระบุเพียงว่า
    ระยะเวลาคุ้มครอง "ถึงอายุ 99 ปี หรือไม่เกินระยะเวลาคุ้มครองของกรมธรรม์ประกันชีวิต"
    และเอฟดับบลิวดีไม่เผยแพร่ตารางอัตราเบี้ยของแบบตลอดชีพ 99/99 เลย เผยแพร่เฉพาะ
    "ทุนประกันภัยขั้นตํ่า 300,000 บาท" จึงไม่มีตัวเลขราคาพื้นของสัญญาหลักที่อ้างอิงได้
    หมายเหตุ แบบเดียวของเอฟดับบลิวดีที่ประกาศเบี้ยขั้นต่ำเป็นตัวเลข คือ มั่นใจชัวร์
    ("เบี้ยประกันภัยขั้นตํ่า 2,000 บาทต่อปี") แต่แบบนั้นรับอายุ 20-50 ปี คุ้มครอง 15 ปี
    จึงรองรับสัญญาเพิ่มเติมที่ต่ออายุถึง 98 ปีไม่ได้ เราจึงไม่ใช้ตัวเลข 2,000 บาท
  source:
    url: https://www.fwd.co.th/files/v3/assets/blt331c1aa12dcfd37a/bltab2941a67fd44909/6669669346a03743bda265b1/TH_Brochure_Whole_Life_99-99.pdf
    tier: official_insurer
    verified_on: 2026-08-10
    note: >-
      โบรชัวร์ตลอดชีพ 99/99 หน้า 3 "ทุนประกันภัยขั้นตํ่า — 300,000 บาท",
      "อายุรับประกันภัย — 1 เดือน 1 วัน – 75 ปี", "ระยะเวลาคุ้มครอง — ถึงอายุ 99 ปี"
      ไม่มีตารางเบี้ยในเอกสารใดของเอฟดับบลิวดี


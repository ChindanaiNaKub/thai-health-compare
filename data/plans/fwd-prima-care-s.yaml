# ตารางเบี้ยจริงจากโบรชัวร์หน้า 8 "ตัวอย่างเบี้ยประกันภัยรายปี (ปีแรก)" แผน S
# มีเฉพาะอายุ 30, 40, 50 เท่านั้น อายุอื่นเอฟดับบลิวดีไม่ประกาศ จึงไม่บันทึก
premium:
  - { age_from: 30, age_to: 30, thb_per_year: 5300, sex: male }
  - { age_from: 40, age_to: 40, thb_per_year: 6300, sex: male }
  - { age_from: 50, age_to: 50, thb_per_year: 7900, sex: male }
  - { age_from: 30, age_to: 30, thb_per_year: 6800, sex: female }
  - { age_from: 40, age_to: 40, thb_per_year: 8200, sex: female }
  - { age_from: 50, age_to: 50, thb_per_year: 10200, sex: female }

entry_age_min: 16
entry_age_max: 70
renewal_ceiling_age: 98

# พรีม่า แคร์ ไม่ใช่แผนเหมาจ่าย ไม่มี "วงเงินรวม" ต่อปีหรือต่อครั้ง มีแต่วงเงินรายหมวด
# หมวดที่ 1, 2, 5 คิด "ต่อการเข้าพักรักษาตัวเป็นผู้ป่วยในครั้งใดครั้งหนึ่ง"
# หมวดที่ 3 (มะเร็ง/ล้างไต/บอลลูน) เท่านั้นที่คิด "ต่อรอบปีกรมธรรม์"
# เราจึงไม่กรอกวงเงินรวม แทนที่จะเดาโดยเอาตัวเลขหมวดใดหมวดหนึ่งมาแทน
ipd_annual_limit_thb: null
ipd_limit_basis: per_confinement
opd_annual_limit_thb: null
room_board_thb_per_night: 1500
deductible_thb: 0
copay_percent: 0
copay_on_renewal: >-
  ปีแรกไม่มีค่าใช้จ่ายร่วม โบรชัวร์ระบุว่า "บริษัทขอสงวนสิทธิ์ในการเปลี่ยนแปลงเงื่อนไข
  ข้อตกลงความคุ้มครอง โดยการเพิ่มเงื่อนไขให้ผู้เอาประกันภัยมีค่าใช้จ่ายร่วม (Copayment)
  ในการต่ออายุสัญญาเพิ่มเติมกรณีครบรอบปีกรมธรรม์ประกันภัย (Renewal)"
  เอกสาร Copayment ของเอฟดับบลิวดีระบุเงื่อนไข 3 กรณี กรณีที่ 1 ป่วยเล็กน้อย
  (Simple Diseases) เข้าพักรักษาตัว >= 3 ครั้งต่อปีกรมธรรม์ และอัตราการเคลม >= 200%
  ของเบี้ยประกันสุขภาพ ร่วมจ่าย 30% ของค่าใช้จ่ายที่ได้รับความคุ้มครองในปีกรมธรรม์ถัดไป
  กรณีที่ 2 การเจ็บป่วยทั่วไป (ไม่รวมโรคร้ายแรง และการผ่าตัดใหญ่) >= 3 ครั้ง และ
  อัตราการเคลม >= 400% ร่วมจ่าย 30% กรณีที่ 3 เข้าเงื่อนไขทั้ง 2 กรณี ร่วมจ่าย 50%
  การนับครั้งนับตามจำนวนครั้งที่เข้าพักรักษาตัวในโรงพยาบาล (Admission)
  ไม่นับแบบ per confinement — Copayment มีผลกับสัญญาที่เริ่มคุ้มครองตั้งแต่ 1 มีนาคม 2568

# โบรชัวร์เขียนเองว่า "ข้อยกเว้นความคุ้มครองมีทั้งหมด 17 ข้อ เช่น" แล้วแสดงเพียง 5 ข้อ
# ที่บันทึกไว้จึงเป็น 5 จาก 17 ห้ามอ่านว่าเป็นรายการทั้งหมด
exclusions:
  - th: ภาวะที่เป็นผลจากความผิดปกติที่เกิดขึ้นแต่กําเนิด หรือระบบการสร้างอวัยวะของร่างกายไม่สมบูรณ์แต่กําเนิด หรือโรคทางพันธุกรรม หรือความผิดปกติในการพัฒนาการของร่างกาย เว้นแต่สัญญาเพิ่มเติมนี้มีผลคุ้มครองมาไม่น้อยกว่าหนึ่งปี (1 ปี) และปรากฏอาการหลังผู้เอาประกันภัยมีอายุครบสิบหกปีบริบูรณ์
    en: null
  - th: การตรวจรักษาหรือการผ่าตัดเพื่อเสริมสวย หรือการแก้ไขปัญหาผิวพรรณ สิว ฝ้า กระ รังแค ผมร่วงหรือการควบคุมนํ้าหนักตัว การผ่าตัดที่สามารถทดแทนด้วยการรักษาแนวทางอื่น เว้นแต่เป็นการตกแต่งบาดแผลอันเนื่องมาจากอุบัติเหตุที่ได้รับความคุ้มครอง
    en: null
  - th: การตรวจสุขภาพ การร้องขอเข้าอยู่รักษาตัวในโรงพยาบาล หรือร้องขอการผ่าตัด การพักฟื้น หรือการพักเพื่อการฟื้นฟูหรือการรักษาโดยวิธีให้พักอยู่เฉยๆ การตรวจหรือการรักษาที่ไม่เกี่ยวข้องกับโรคที่เป็นสาเหตุของการรับตัวไว้ในโรงพยาบาล ซึ่งไม่ใช่ความจําเป็นทางการแพทย์ หรือไม่เป็นมาตรฐานทางการแพทย์
    en: null
  - th: การตรวจรักษาที่ยังอยู่ในระหว่างทดลอง การตรวจหรือการรักษาโรคหรืออาการหยุดหายใจขณะหลับ การตรวจหรือการรักษาความผิดปกติของการนอนหลับ การนอนกรน
    en: null
  - th: การฆ่าตัวตาย การพยายามฆ่าตัวตาย การทําร้ายร่างกายตนเอง หรือการพยายามทําร้ายร่างกายตนเอง ทั้งนี้รวมถึงอุบัติเหตุจากการที่ผู้เอาประกันภัย กิน ดื่ม หรือฉีดยาหรือสารมีพิษเข้าร่างกาย การใช้ยาเกินกว่าที่แพทย์สั่ง
    en: null
waiting_period_days: 30

premium_source:

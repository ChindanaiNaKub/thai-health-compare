# ตรวจสอบกับหนังสือเวียนของกรมบัญชีกลางเอง เมื่อ 2026-08-10
# อัตราค่าห้องยืนยันจากหนังสือเวียน ว 2/2556 ซึ่งยังไม่มีฉบับใดยกเลิกหรือแทนที่
id: csmbs
name:
  th: สวัสดิการรักษาพยาบาลข้าราชการ
  en: Civil Servant Medical Benefit Scheme
who:
  th: ข้าราชการ ลูกจ้างประจำ ผู้รับบำนาญ และบุคคลในครอบครัวตามเงื่อนไข
  en: Civil servants, pensioners, and eligible family members
covers:
  - th: รักษาพยาบาลในสถานพยาบาลของรัฐ เบิกจ่ายตรงได้
    en: null
  - th: ครอบคลุมบิดามารดา คู่สมรส และบุตรตามเงื่อนไข
    en: null
  - th: ค่าเตียงสามัญเบิกได้รวมกับค่าอาหารในราคาไม่เกิน 400 บาทต่อวัน และค่าห้องพิเศษเบิกได้รวมกับค่าอาหารในราคาไม่เกิน 1,000 บาทต่อวัน ตามระเบียบกระทรวงการคลัง
    en: null
  - th: ค่าบริการทางทันตกรรมเบิกได้ตามอัตราค่าบริการสาธารณสุข หมวดที่ 13 ซึ่งเป็นการจ่ายรายหัตถการ ไม่ใช่วงเงินรายปี
    en: null
gaps:
  - th: โดยหลักใช้ได้กับสถานพยาบาลของรัฐ ช่องทางเบิกจ่ายกับสถานพยาบาลเอกชนมีอยู่จริงแต่จำกัด โดยเฉพาะกรณีฉุกเฉินตามใบประเมินคัดแยกผู้ป่วยฉุกเฉิน
    en: null
  - th: ค่าห้องพิเศษเบิกได้ไม่เกิน 1,000 บาทต่อวันรวมค่าอาหาร ส่วนที่เกินจากนี้ผู้ป่วยรับเอง ซึ่งห้องเดี่ยวโรงพยาบาลเอกชนในกรุงเทพฯ แพงกว่านี้หลายเท่า
    en: null
  - th: ไม่มีวงเงินทันตกรรมรายปี เพราะเป็นตารางค่าบริการรายหัตถการ หัตถการที่ไม่อยู่ในตารางจึงเบิกไม่ได้
    en: null
  - th: ตั้งแต่หนังสือเวียน ว 224 ลงวันที่ 2 เมษายน 2569 การเบิกจ่ายตรงผู้ป่วยนอกต้องใช้บัตรประจำตัวประชาชนทำธุรกรรมทุกครั้ง หรือยืนยันตัวตนทางอิเล็กทรอนิกส์ เช่น สแกนใบหน้าคู่กับบัตรประชาชนผ่าน e-KYC การยืนยันแบบสองชั้นด้วยรหัส OTP ทาง SMS หรือ Biometrics
    en: null
source:
  url: https://www.cgd.go.th/cs/internet/internet/(รักษา)กฎหมายระเบียบบ.html
  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    ทะเบียนหนังสือเวียนสวัสดิการรักษาพยาบาลของกรมบัญชีกลางเอง อัตราค่าห้องมาจาก
    หนังสือด่วนที่สุด ที่ กค 0422.2/พิเศษ ว 2 ลงวันที่ 4 ธันวาคม 2556 หมวด 1
    ค่าห้องและค่าอาหาร ซึ่งกำหนด "เตียงสามัญ วัน 400 เบิกได้รวมกับค่าอาหารในราคา
    ไม่เกิน 400 บาท ตามระเบียบกระทรวงการคลัง" และ "ห้องพิเศษ วัน 1,000 เบิกได้รวมกับ
    ค่าอาหารในราคาไม่เกิน 1,000 บาท ตามระเบียบกระทรวงการคลัง" มีผลบังคับใช้สำหรับ
    การรักษาพยาบาลที่เกิดขึ้นตั้งแต่วันที่ 1 มกราคม 2557 เป็นต้นไป
    ตรวจทะเบียนหนังสือเวียนครบทั้ง 617 รายการแล้ว ไม่มีฉบับใดหลังจากนี้ที่แก้ไขอัตรา
    หมวด 1 ค่าห้องและค่าอาหาร ตัวเลขสองตัวนี้จึงยังเป็นอัตราปัจจุบัน
    เงื่อนไขการยืนยันตัวตนมาจากหนังสือ ที่ กค 0416.4/ว 224 ลงวันที่ 2 เมษายน 2569
    เรื่องแนวปฏิบัติการเบิกจ่ายตรงเงินสวัสดิการเกี่ยวกับการรักษาพยาบาลประเภทผู้ป่วยนอก
    ซึ่งยกเลิกแนวปฏิบัติเดิมและส่งถึงผู้อำนวยการสถานพยาบาลของทางราชการและของเอกชน
    ทันตกรรมอยู่ในหมวดที่ 13 ค่าบริการทางทันตกรรม แก้ไขล่าสุดโดย กค 0416.2/ว 369
    ลงวันที่ 21 กันยายน 2559
    สิ่งที่ไม่ได้บันทึกและเหตุผล: เพดาน 13 วันสำหรับค่าห้องพิเศษ ซึ่งถูกอ้างซ้ำกันทั่วไป
    ไม่ปรากฏในหนังสือเวียนฉบับนี้ หนังสือเวียนอ้างต่อไปยัง "ระเบียบกระทรวงการคลัง"
    โดยไม่ยกข้อความมา และเราหาตัวบทที่ระบุ 13 วันจากแหล่งปฐมภูมิไม่พบ จึงไม่ยืนยัน
    หมายเหตุวิธีตรวจสอบ: เว็บกรมบัญชีกลางอยู่หลัง Cloudflare การเปิดหน้าธรรมดาผ่าน
    แต่การค้นด้วย query จะถูกบล็อก และไฟล์ PDF ของหนังสือเวียนเป็นภาพสแกน
    ต้องเรนเดอร์เป็นภาพอ่าน แกะข้อความตรงๆ ไม่ได้ ตัวเลขในต้นฉบับพิมพ์เป็นเลขไทย

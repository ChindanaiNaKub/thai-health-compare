# ตรวจสอบกับหน้าของ สปสช. เอง เมื่อ 2026-08-10 ไม่ใช้ข่าว บล็อก หรือเว็บเปรียบเทียบเป็นแหล่งอ้างอิง
id: ucs
name:
  th: หลักประกันสุขภาพแห่งชาติ (บัตรทอง / สิทธิ 30 บาท)
  en: Universal Coverage Scheme
who:
  th: คนไทยที่ไม่มีสิทธิประกันสังคมหรือสิทธิสวัสดิการรักษาพยาบาลข้าราชการ
  en: Thai nationals without SSO or civil-servant entitlement
covers:
  - th: รักษาพยาบาลทั่วไป ผู้ป่วยนอกและผู้ป่วยใน ที่หน่วยบริการปฐมภูมิหรือหน่วยบริการประจำตามสิทธิ ไม่มีค่าใช้จ่าย
    en: null
  - th: ยาในบัญชียาหลักแห่งชาติ
    en: null
  - th: "นโยบาย 30 บาทรักษาทุกที่ ใช้บัตรประชาชนเข้ารับบริการได้ ไม่ต้องใช้ใบส่งตัว ที่หน่วยบริการนวัตกรรมเอกชนที่เข้าร่วม ได้แก่ ร้านยาคุณภาพ (เจ็บป่วยเล็กน้อย 32 อาการ) คลินิกทันตกรรม (อุดฟัน ถอนฟัน ขูดหินปูน เคลือบหลุมร่องฟัน เคลือบฟลูออไรด์) คลินิกกายภาพบำบัด (ฟื้นฟู 4 กลุ่มโรค ใน 6 เดือนแรกหลังพ้นวิกฤต) และคลินิกเทคนิคการแพทย์ (ตรวจแล็บ 22 รายการตามใบสั่งแพทย์)"
    en: null
  - th: เจ็บป่วยฉุกเฉินไม่ถึงขั้นวิกฤต เข้ารักษาได้ที่โรงพยาบาลรัฐทุกแห่งและโรงพยาบาลเอกชนที่เข้าร่วมกับ สปสช. ส่วนเจ็บป่วยฉุกเฉินวิกฤตถึงแก่ชีวิต ใช้สิทธิ UCEP ที่โรงพยาบาลรัฐและเอกชนที่ใกล้ที่สุดได้
    en: null
  - th: ผู้ป่วยมะเร็งสามารถเข้ารับการรักษาที่สถานพยาบาลอื่นได้ ตามนโยบายมะเร็งรักษาทุกที่
    en: null
gaps:
  - th: ระบบส่งต่อยังไม่ได้หายไป สปสช. ระบุว่าโรงพยาบาลรัฐสังกัดอื่น เช่น กรุงเทพมหานคร กระทรวงกลาโหม สำนักงานตำรวจแห่งชาติ และมหาวิทยาลัย เป็นโรงพยาบาลสำหรับรับส่งต่อผู้ป่วย ต้องใช้ใบส่งตัว และเมื่อรักษาเสร็จผู้ป่วยกลับไปที่หน่วยบริการประจำของตนเอง
    en: null
  - th: การเข้ารักษาแบบผู้ป่วยในและการรักษาที่ไม่ฉุกเฉินในโรงพยาบาลเอกชน อยู่นอกสิทธิ หน่วยบริการเอกชนที่ร่วมนโยบาย 30 บาทรักษาทุกที่ เป็นร้านยาและคลินิกเฉพาะขอบเขตที่กำหนดไว้เท่านั้น ไม่ใช่โรงพยาบาลเอกชนทั่วไป
    en: null
  - th: ไม่มีการประกาศเพดานค่าห้องเป็นตัวเงิน เพราะสิทธิบัตรทองไม่ได้จ่ายเป็นวงเงินค่าห้องให้ผู้ป่วย ใครต้องการห้องพิเศษต้องรับส่วนต่างเอง
    en: null
  - th: เวลารอคอยการรักษาที่ไม่ฉุกเฉินอาจนาน และผูกกับหน่วยบริการประจำตามสิทธิเป็นหลัก
    en: null
source:
  url: https://www.nhso.go.th/th/population-th/2024-08-20-15-19-43/30-bath-th-2
  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    หน้าอธิบายนโยบาย 30 บาทรักษาทุกที่ ของ สปสช. เอง ซึ่งระบุว่าเป็น "ทางเลือกเสริม
    สำหรับอาการเจ็บป่วยเล็กน้อย" และ "ยังคงเข้ารับการรักษาได้ที่หน่วยบริการปฐมภูมิประจำตัว"
    หน้าเดียวกันเป็นที่มาของรายการหน่วยบริการนวัตกรรมเอกชน ของเงื่อนไขฉุกเฉินและ UCEP
    และของหมายเหตุเรื่องใบส่งตัวสำหรับโรงพยาบาลรัฐสังกัดอื่น
    กรณีมะเร็งรักษาทุกที่มาจาก https://www.nhso.go.th/th/communicate-th/thnewsforperson/2025-08-31-02-26-17
    สิ่งที่ไม่ได้บันทึกไว้ในไฟล์นี้และเหตุผล: ค่าห้องและค่าอาหารของสิทธิบัตรทอง
    หน้าของ สปสช. ที่เคยอธิบายเรื่องนี้ (page/coverage_rights_Meal) ตอบ HTTP 500
    และหน้าที่มาแทนตอบ 404 เมื่อ 2026-08-10 จึงไม่มีข้อความจาก URL ที่ยังมีชีวิตให้อ้างอิง
    เราไม่บันทึกตัวเลขจากแคชของหน้าที่ตายแล้ว
    ข้อควรระวังอีกข้อ: หน้าเปรียบเทียบสิทธิบัตรทองกับประกันสังคมของ สปสช. เอง
    (thnewsforperson/News_4239) ยังอ้างสิทธิทำฟันประกันสังคมที่ 900 บาท/ปี และค่าห้อง
    700 บาท/วัน โดยไม่กำกับว่าเป็นกรณีฉุกเฉิน ทั้งสองจุดล้าสมัยแล้ว จึงไม่ใช้หน้านั้นเป็นแหล่งอ้างอิง
verified_on: 2026-08-10

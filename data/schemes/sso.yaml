# ตรวจสอบกับเอกสารของสำนักงานประกันสังคมเอง เมื่อ 2026-08-10
# สิทธิทำฟันเปลี่ยนเมื่อ 1 พ.ค. 2569 และหน้าสิทธิประโยชน์ของ สปส. เองยังไม่อัปเดตตาม
id: sso
name:
  th: กองทุนประกันสังคม (สิทธิประกันสังคม)
  en: Social Security Scheme
who:
  th: ผู้ประกันตนที่ส่งเงินสมทบเข้ากองทุนประกันสังคม
  en: Insured persons contributing to the Social Security Fund
covers:
  - th: ค่ารักษาที่เกิดขึ้นทั้งหมดในโรงพยาบาลตามบัตรรับรองสิทธิการรักษาพยาบาล ผู้ประกันตนไม่ต้องจ่าย
    en: null
  - th: "สิทธิทำฟันตั้งแต่ 1 พ.ค. 2569 ถอนฟัน อุดฟัน ขูดหินปูน ในโรงพยาบาลเอกชน วงเงิน 900 บาท/ปี ส่วนในโรงพยาบาลรัฐ อุด ขูด ถอน รวมถึงเกลารากฟัน และการขลิบแต่งกระดูกเตรียมช่องปากก่อนใส่ฟันปลอม ไม่จำกัดจำนวนครั้งตามความจำเป็นทางการแพทย์"
    en: null
  - th: "ผ่าฟันคุด จ่ายเพิ่มในอัตรา 1,500-2,500 บาท/ซี่ ฟันปลอมถอดได้ 1,500-6,000 บาท พร้อมค่าซ่อมแซม 900 บาท/ครั้ง และการฝังรากฟันเทียมรองรับฟันเทียมทั้งปาก สำหรับผู้สูญเสียฟันทั้งหมดที่ใส่ฟันปลอมชนิดถอดได้ไม่ได้ จ่ายค่าผ่าตัด 17,500 บาท/ราย และชุดรากฟันเทียม 3,300 บาท"
    en: null
gaps:
  - th: มีเงื่อนไขการส่งเงินสมทบก่อนใช้สิทธิ ต้องจ่ายเงินสมทบในส่วนของกรณีเจ็บป่วยมาแล้วไม่น้อยกว่า 3 เดือน ภายในระยะเวลา 15 เดือน ก่อนวันรับบริการทางการแพทย์ คนเพิ่งเริ่มงานหรือเพิ่งกลับเข้าระบบจึงยังไม่มีสิทธิ
    en: null
  - th: การขออยู่ห้องพิเศษและการขอแพทย์พิเศษเอง เป็นข้อยกเว้นที่ระบุไว้ชัด ไม่มีเพดานค่าห้องพิเศษเป็นตัวเงิน ผู้ประกันตนรับส่วนต่างเองทั้งหมด
    en: null
  - th: ตัวเลขค่าห้องและค่าอาหาร 700 บาท/วัน ที่มักถูกอ้างว่าเป็นสิทธิทั่วไป จริงๆ เป็นเพดานของการรักษานอกโรงพยาบาลตามบัตรรับรองสิทธิเฉพาะกรณีฉุกเฉิน และจำกัดไม่เกิน 72 ชั่วโมงเท่านั้น
    en: null
  - th: สิทธิทำฟันคุ้มครองต่อไปอีกไม่เกิน 6 เดือนหลังจากออกจากงาน หลังจากนั้นสิ้นสุด
    en: null
source:
  url: https://www.sso.go.th/wpr/assets/upload/files_storage/sso_th/1d936c61bf5d6cc1f7a51ffdb2f9bd2c.pdf
  tier: official_insurer
  verified_on: 2026-08-10
  note: >-
    อินโฟกราฟิกของสำนักงานประกันสังคมเอง ชื่อเอกสาร "อัปเดทใหม่! สิทธิทำฟันประกันสังคมปี 2569"
    ระบุ "อัปเดตใหม่! สิทธิทำฟัน ประกันสังคมปี 2569 ครอบคลุมมากขึ้น จ่ายหนักกว่าเดิม
    เริ่ม 1 พ.ค.2569" และเป็นที่มาของทุกตัวเลขสิทธิทำฟันข้างต้น
    ข้อควรระวังสำคัญ: ณ วันที่ตรวจสอบ (2026-08-10) หน้าสิทธิประโยชน์ของสำนักงานประกันสังคมเอง
    (wpr/main/privilege/กองทุนประกันสังคม_detail_detail_1_125_0/24) ยังแสดงสิทธิเดิมอยู่ คือ
    "ให้ผู้ประกันตนมีสิทธิได้รับค่าบริการทางการแพทย์เท่าที่จ่ายจริง 900 บาท/ครั้ง/ปี"
    พร้อมฟันปลอมชั้นละไม่เกิน 1,300 / 1,500 / 2,400 / 4,400 บาท ภายใน 5 ปี
    เอกสารของรัฐสองฉบับจึงไม่ตรงกัน เราเลือกฉบับที่ใหม่กว่าและระบุวันบังคับใช้ชัดเจน
    แต่บันทึกความไม่ตรงกันไว้ตรงนี้แทนที่จะเลือกข้างเงียบๆ
    เงื่อนไขเงินสมทบ 3 เดือนใน 15 เดือน และรายการที่ไม่คุ้มครอง (ห้องพิเศษ แพทย์พิเศษ)
    มาจาก https://www.sso.go.th/wpr/main/privilege/กองทุนประกันสังคม_detail_detail_1_125_0/30
    เพดาน 700 บาท/วัน และกรอบ 72 ชั่วโมง มาจากหน้ากรณีฉุกเฉินของ สปส.
    https://www.sso.go.th/wpr/main/service/กองทุนประกันสังคม_detail_detail_1_125_690/605_605
    ซึ่งเขียนว่า "ภายในระยะเวลาไม่เกิน 72 ชั่วโมง (ไม่รวมวันหยุดราชการ) ค่าห้องและค่าอาหาร
    เบิกได้ไม่เกิน 700 บาท/วัน" ทั้งกรณีสถานพยาบาลของรัฐและของเอกชน
verified_on: 2026-08-10

    tier: official_insurer
    verified_on: 2026-08-15
    note: Official SCB brochure with benefits and age-banded annual premiums; not filed policy wording.
  - url: https://www.scb.co.th/th/personal-banking/insurance/health-insurance/scb-health-elite.html
    tier: official_insurer

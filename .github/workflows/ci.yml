name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monthly nudge so stale records surface without anyone remembering to look.
    - cron: '0 2 1 * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  staleness:
    runs-on: ubuntu-latest
    # Advisory on PRs; the scheduled run is what actually nags.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check-staleness

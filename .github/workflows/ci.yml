name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monthly nudge so stale records surface without anyone remembering to look.
    - cron: '0 2 1 * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  data-health:
    runs-on: ubuntu-latest
    permissions: { contents: read, issues: write }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check-staleness > staleness.md 2>&1 || true
      - run: bun run check-sources > sources.md
      - name: Combine reports
        run: |
          { echo '## Staleness'; cat staleness.md; echo; echo '## Sources'; cat sources.md; } > report.md
      - name: Create or update issue
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'Data health: source check';
            const day = new Date().toISOString().slice(0, 10);
            const body = `Checked ${day}\n\n${fs.readFileSync('report.md', 'utf8')}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            const common = { owner: context.repo.owner, repo: context.repo.repo };
            if (existing) {
              await github.rest.issues.update({ ...common, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ ...common, title, body });
            }
